<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Módulos 1 a 4 · Modo Juego</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1124;--bg2:#141938;--card:#1a2045;--card2:#242b5c;--line:#2f3770;
  --txt:#f1f2ff;--mut:#a7acd9;--acc:#8b6cff;--acc2:#22d3ee;--ok:#22c55e;--bad:#f43f5e;--warn:#fbbf24;
  --r:18px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(1200px 600px at 10% -10%,#2a1f6b 0%,transparent 60%),radial-gradient(900px 500px at 110% 10%,#0b4a5c 0%,transparent 55%),var(--bg);background-attachment:fixed;color:var(--txt);font-family:Nunito,system-ui,Segoe UI,Roboto,sans-serif;font-size:17px;line-height:1.45;min-height:100vh}
#app{max-width:760px;margin:0 auto;padding:16px 16px 140px}
h1,h2,h3{margin:0;line-height:1.2}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:default}
.mut{color:var(--mut)}
small{font-size:.8em}

/* botones */
.btn{background:linear-gradient(135deg,var(--acc),#5b3df5);padding:14px 22px;border-radius:14px;font-weight:800;box-shadow:0 6px 0 #3a23a8;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #3a23a8}
.btn.alt{background:linear-gradient(135deg,#0ea5b7,#0b7285);box-shadow:0 6px 0 #075563}
.ghost{padding:10px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:700}
.ghost:disabled{opacity:.35}

/* home */
.hero{background:linear-gradient(135deg,#2b1f7a,#14306b);border:1px solid #4636a8;border-radius:24px;padding:20px;position:relative;overflow:hidden}
.hero h1{font-size:28px;font-weight:900}
.hero p{margin:4px 0 0;color:#c9ccff}
.hero .float{position:absolute;right:-6px;top:-10px;font-size:90px;opacity:.15;transform:rotate(12deg)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{background:rgba(0,0,0,.25);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:900}
.stat span{font-size:12px;color:#c9ccff}
.xpbar{height:12px;background:rgba(0,0,0,.35);border-radius:99px;margin-top:12px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));border-radius:99px;transition:width .5s}
.xplabel{display:flex;justify-content:space-between;font-size:13px;color:#c9ccff;margin-top:6px}
.sec{margin-top:26px}
.sec>h2{font-size:20px;font-weight:900;margin-bottom:4px}
.sec>p{margin:0 0 12px;color:var(--mut);font-size:15px}
.unit{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--acc2);margin:16px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:flex;gap:12px;align-items:center;transition:transform .12s,border-color .12s}
.mcard:hover{transform:translateY(-2px);border-color:var(--acc)}
.mcard .em{font-size:34px;width:52px;height:52px;display:grid;place-items:center;background:var(--card2);border-radius:14px;flex:none}
.mcard h3{font-size:16px;font-weight:800}
.mcard .meta{font-size:12px;color:var(--mut)}
.mcard .st{font-size:14px;letter-spacing:2px;margin-top:2px}
.mcard.done{border-color:#2e7d4f}
.mode{background:linear-gradient(135deg,var(--card),var(--card2))}
.plan{display:flex;gap:8px;flex-wrap:wrap}
.plan span{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px}
details{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin-top:12px}
summary{font-weight:800;cursor:pointer}
details ol{margin:10px 0 4px;padding-left:20px}
details li{margin-bottom:6px}

/* barra misión */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;position:sticky;top:0;padding:10px 0;background:linear-gradient(var(--bg) 70%,transparent);z-index:5}
.prog{flex:1;height:14px;background:var(--card);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#86efac);border-radius:99px;transition:width .4s}
.tag{display:inline-block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--acc2);margin-bottom:8px}
.q{font-size:22px;font-weight:900;margin-bottom:16px}
.big{font-size:1.5em;color:var(--warn)}

/* tarjetas de concepto */
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:99px;background:var(--line)}
.dots i.on{background:var(--acc2)}
.card{background:linear-gradient(160deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:24px;padding:24px 20px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.35)}
.emo{font-size:72px;line-height:1;margin-bottom:10px}
.card h2{font-size:28px;font-weight:900;background:linear-gradient(90deg,#fff,#c4b5fd);-webkit-background-clip:text;background-clip:text;color:transparent}
.d{font-size:19px;font-weight:600;margin:12px 0 0}
.ex{margin-top:14px;background:rgba(34,211,238,.1);border:1px dashed rgba(34,211,238,.5);border-radius:14px;padding:10px 12px;font-size:15px;text-align:left}
.tip{margin-top:14px;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.55);border-radius:14px;padding:10px 12px;font-size:16px;text-align:left;color:#fde68a}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:18px}
.nav .btn{flex:1}
.pop{animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.92) translateY(10px);opacity:0}to{transform:none;opacity:1}}

/* visuales dentro de tarjetas */
.ladder{display:flex;flex-direction:column-reverse;gap:6px;margin-top:16px}
.ladder div{margin-left:calc(var(--i)*14%);width:58%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:10px;padding:8px 10px;font-weight:800;text-align:left;font-size:15px}
.flow{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:16px}
.flow span{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-weight:800;font-size:15px}
.flow span.hl{background:rgba(251,191,36,.18);border-color:var(--warn);color:#fde68a}
.flow b{color:var(--acc2);font-size:20px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.duo div{background:var(--card2);border-radius:14px;padding:12px;border:1px solid var(--line)}
.duo div b{display:block;font-size:20px}
.scale{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:16px}
.scale span{background:var(--card2);border-radius:8px;padding:6px 0;font-weight:900;font-size:15px;display:flex;flex-direction:column}
.scale small{color:var(--mut);font-weight:600;font-size:11px}
.pyr{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:16px}
.pyr div{padding:10px 6px;font-weight:900;border-radius:6px;font-size:15px}
.pyr div:nth-child(1){background:#7c3aed}.pyr div:nth-child(2){background:#2563eb}.pyr div:nth-child(3){background:#0d9488}
.pyr small{display:block;font-weight:600;opacity:.9}
.nest{margin-top:16px;text-align:left;font-weight:800;font-size:15px}
.nest div{border:2px solid var(--acc2);border-radius:14px;padding:8px 10px 10px;margin-top:6px;background:rgba(34,211,238,.06)}
.arch{display:grid;gap:8px;margin-top:14px;text-align:left;font-size:14px}
.arch div{background:var(--card2);border-radius:12px;padding:10px;border:1px solid var(--line)}
.arch b{display:block;color:var(--acc2)}
.tb{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px;text-align:left;background:var(--card2);border-radius:12px;overflow:hidden}
.tb td,.tb th{padding:6px 8px;border-bottom:1px solid var(--line)}
.tb th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.tree{margin-top:14px;text-align:left;font-size:14px;font-weight:700}
.tree div{border-left:3px solid var(--acc2);padding:4px 0 4px 10px;margin:6px 0 0 8px}
.tree .tq{color:var(--warn)}

/* módulos */
.modh{margin:22px 0 2px;padding:10px 14px;border-radius:14px;background:linear-gradient(90deg,rgba(139,108,255,.28),transparent);border-left:4px solid var(--acc);font-weight:900;font-size:17px}
.modh small{display:block;font-weight:600;color:var(--mut);font-size:13px}
.modsel{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.modsel button{padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:14px}
.modsel button.on{background:var(--acc);border-color:var(--acc)}

/* opciones / quiz */
.opts{display:grid;gap:10px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;font-weight:700;transition:transform .08s,border-color .1s;display:flex;gap:10px;align-items:center}
.opt:hover:not(:disabled){border-color:var(--acc);transform:translateY(-1px)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--card2);display:grid;place-items:center;font-size:13px;color:var(--mut)}
.opt.right{border-color:var(--ok);background:rgba(34,197,94,.15)}
.opt.wrong{border-color:var(--bad);background:rgba(244,63,94,.15)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

/* feedback */
.fb{position:fixed;left:0;right:0;bottom:0;padding:16px max(16px,calc(50% - 364px));display:flex;gap:14px;align-items:center;justify-content:space-between;z-index:20;animation:up .25s ease-out;border-top:3px solid}
.fb.ok{background:#0f2e22;border-color:var(--ok)}
.fb.bad{background:#3a1220;border-color:var(--bad)}
.fb b{font-size:19px;font-weight:900}
.fb.ok b{color:#86efac}.fb.bad b{color:#fda4af}
.fb p{margin:4px 0 0;font-size:15px}
.fb .btn{flex:none}
.fb{max-height:75vh;overflow:auto}
.rec{margin-top:10px;background:rgba(255,255,255,.07);border-left:4px solid var(--acc2);border-radius:10px;padding:8px 12px;font-size:14.5px}
.rec span{display:block;font-size:12px;font-weight:900;color:var(--acc2);text-transform:uppercase;letter-spacing:.08em}
.rec p{margin:4px 0 0}
.rec b{font-size:inherit;color:#fff!important}
@media(max-width:560px){.fb{flex-direction:column;align-items:stretch}.fb .btn{width:100%}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}

/* ordenar */
.slots{display:grid;gap:8px;margin-bottom:16px}
.slot{border:2px dashed var(--line);border-radius:14px;padding:12px 14px;min-height:50px;display:flex;gap:10px;align-items:center;color:var(--mut);font-weight:800}
.slot.fill{border-style:solid;border-color:var(--ok);background:rgba(34,197,94,.12);color:var(--txt);animation:pop .3s}
.slot .n{width:26px;height:26px;border-radius:99px;background:var(--card2);display:grid;place-items:center;font-size:13px;flex:none}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card2);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:800}
.chip:hover:not(:disabled){border-color:var(--acc)}
.chip:disabled{opacity:.15}
.chip.sel{border-color:var(--warn);background:rgba(251,191,36,.15)}

/* clasificar */
.item{background:linear-gradient(135deg,#3b2a99,#1f3b8a);border-radius:20px;padding:26px 18px;text-align:center;font-size:21px;font-weight:900;margin-bottom:16px;box-shadow:0 14px 30px rgba(0,0,0,.35)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.bucket{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px 10px;font-weight:900;font-size:16px}
.bucket:hover:not(:disabled){border-color:var(--acc2)}
.bucket.right{border-color:var(--ok);background:rgba(34,197,94,.15)}
.bucket.wrong{border-color:var(--bad);background:rgba(244,63,94,.15)}
.buckets.pyrb{display:flex;flex-direction:column;align-items:center;gap:6px}
.buckets.pyrb .bucket{border-radius:8px}
.counter{font-size:13px;color:var(--mut);margin-bottom:8px;text-align:center}

/* unir */
.match{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.match .col{display:grid;gap:8px;align-content:start}
.mt{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;text-align:left;font-weight:700;font-size:15px}
.mt.l{font-weight:900;background:var(--card2)}
.mt.sel{border-color:var(--warn);background:rgba(251,191,36,.15)}
.mt.done{border-color:var(--ok);background:rgba(34,197,94,.12);opacity:.55}

/* binario */
.bulbs{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:14px}
.bulb{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .15s}
.bulb .l{font-size:28px;filter:grayscale(1) brightness(.5)}
.bulb b{font-size:15px}
.bulb .bit{font-size:18px;font-weight:900;color:var(--mut)}
.bulb.on{border-color:var(--warn);background:rgba(251,191,36,.15);box-shadow:0 0 22px rgba(251,191,36,.35)}
.bulb.on .l{filter:none}
.bulb.on .bit{color:var(--warn)}
.sumline{text-align:center;font-size:18px;margin-bottom:6px}
.sumline .over{color:var(--bad)}
.binout{text-align:center;font-family:ui-monospace,Consolas,monospace;font-size:30px;letter-spacing:6px;font-weight:900;color:var(--acc2);margin:8px 0 12px}
.hintbox table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px;background:var(--card);border-radius:12px;overflow:hidden}
.hintbox td,.hintbox th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.bitsrow{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;text-align:center;margin-bottom:6px}
.bitsrow span{background:var(--card);border-radius:10px;padding:8px 0;font-weight:900;font-size:24px;font-family:ui-monospace,Consolas,monospace}
.bitsrow span.one{background:rgba(251,191,36,.18);color:var(--warn)}
.bitsrow.sc span{font-size:14px;font-family:inherit;color:var(--mut);padding:4px 0;background:none}
.inp{width:100%;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;color:var(--txt);font:inherit;font-size:22px;font-weight:800;text-align:center;margin:12px 0}
.inp:focus{outline:none;border-color:var(--acc)}
.asc{display:grid;gap:8px;margin:10px 0 16px}
.asc div{display:grid;grid-template-columns:50px 60px 1fr;align-items:center;background:var(--card);border-radius:12px;padding:8px 12px}
.asc .c{font-size:26px;font-weight:900;color:var(--warn)}
.asc code{font-size:20px;letter-spacing:3px;color:var(--acc2);font-weight:800}

/* flashcards */
.flash{perspective:1200px;margin-bottom:14px}
.flash .inner{position:relative;min-height:320px;transition:transform .5s;transform-style:preserve-3d}
.flash.flip .inner{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center}
.flash .back{transform:rotateY(180deg)}
.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px}
.boxes div{background:var(--card);border-radius:12px;padding:8px 4px;text-align:center;font-size:12px;color:var(--mut);border:1px solid var(--line)}
.boxes b{display:block;font-size:20px;color:var(--txt)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate button{padding:14px 6px;border-radius:14px;font-weight:900;background:var(--card);border:2px solid var(--line)}
.rate .r1{border-color:var(--bad)}.rate .r2{border-color:var(--warn)}.rate .r3{border-color:var(--ok)}

/* memotest */
.memo{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:560px){.memo{grid-template-columns:repeat(3,1fr)}}
.tile{aspect-ratio:3/4;border-radius:14px;background:linear-gradient(135deg,var(--acc),#3b2a99);display:grid;place-items:center;font-size:30px;padding:6px;transition:transform .3s}
.tile.open,.tile.done{background:var(--card);border:2px solid var(--line);font-size:13px;font-weight:800;line-height:1.25}
.tile.open.c,.tile.done.c{color:var(--warn);font-size:15px;font-weight:900}
.tile.done{border-color:var(--ok);background:rgba(34,197,94,.12)}

/* VF */
.vf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vf button{padding:22px;border-radius:18px;font-size:20px;font-weight:900}
.vf .v{background:rgba(34,197,94,.15);border:2px solid var(--ok)}
.vf .f{background:rgba(244,63,94,.15);border:2px solid var(--bad)}

/* timer */
.timer{height:10px;background:var(--card);border-radius:99px;overflow:hidden;margin-bottom:14px}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--bad),var(--warn),var(--ok));transition:width .1s linear}

/* final */
.final{text-align:center;padding-top:30px}
.final .stars{font-size:64px;letter-spacing:6px;margin:10px 0}
.final .stars span{display:inline-block;animation:pop .5s backwards}
.final h2{font-size:30px;font-weight:900}
.final .row{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}

/* trucos */
.cheat{display:grid;gap:10px}
.cheat div{background:var(--card);border-left:4px solid var(--warn);border-radius:12px;padding:10px 14px}
.cheat b{color:var(--acc2);font-size:13px;text-transform:uppercase;letter-spacing:.06em}

.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--acc),#5b3df5);padding:12px 20px;border-radius:99px;font-weight:900;z-index:50;animation:pop .3s;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:26px;flex-wrap:wrap}
/* personaje: Bit */
.bitbot{animation:float 3s ease-in-out infinite;overflow:visible;flex:none}
.bitbot.party{animation:jump .45s ease-in-out infinite alternate}
.bitbot.sad{animation:none;transform:rotate(-7deg)}
.bitbot.wow{animation:float 1.6s ease-in-out infinite}
.bitbot .eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
.bitbot .led{animation:led 1.1s infinite alternate}
@keyframes float{50%{transform:translateY(-5px)}}
@keyframes jump{to{transform:translateY(-12px) rotate(5deg)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes led{to{opacity:.35}}
.say{display:flex;gap:10px;align-items:flex-end;text-align:left;margin:16px 0}
.say .bitw{cursor:pointer;flex:none}
.say .bub{background:#f4f2ff;color:#1b1840;border-radius:18px 18px 18px 4px;padding:10px 14px;font-weight:700;font-size:15px;line-height:1.4;box-shadow:0 8px 20px rgba(0,0,0,.25);animation:pop .35s}
.say .bub b{color:#5b3df5}
.say .bub small{display:block;color:#6b6890;font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.fbl{display:flex;gap:12px;align-items:center}
.final .bitbot{margin:0 auto}

/* machete */
.mach{columns:2 330px;column-gap:14px;margin-top:6px}
.mach section{break-inside:avoid;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:0 0 14px;font-size:14.5px;display:inline-block;width:100%}
.mach h3{font-size:16px;color:var(--acc2);margin-bottom:8px;font-weight:900}
.mach table{width:100%;border-collapse:collapse;margin:4px 0}
.mach td,.mach th{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.mach th{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.mach ul{margin:4px 0;padding-left:18px}.mach li{margin-bottom:4px}
.mach p{margin:6px 0}
.mach .tr{color:#fde68a;font-weight:800}
.mach .tp{color:#fda4af}
.mach .h{transition:filter .2s}
.mach.hide .h{filter:blur(5px);background:rgba(255,255,255,.1);border-radius:4px;cursor:pointer;user-select:none}

function addXP(n){
  const before=levelOf(S.xp);S.xp+=n;
  const t=today();
  if(S.lastDay!==t){const y=new Date(Date.now()-864e5);const ys=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();S.streak=S.lastDay===ys?S.streak+1:1;S.lastDay=t}
  save();
  const after=levelOf(S.xp);
  if(after>before){toast('⬆️ Subiste a '+LEVELS[after][0]);confetti()}

function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function confetti(){const cols=['#8b6cff','#22d3ee','#fbbf24','#22c55e','#f43f5e','#fff'];for(let i=0;i<70;i++){const c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=pick(cols);c.style.animationDuration=(1.4+Math.random()*1.6)+'s';c.style.animationDelay=Math.random()*.4+'s';c.style.borderRadius=Math.random()>.5?'50%':'2px';document.body.appendChild(c);setTimeout(()=>c.remove(),3600)}}

function beep(ok){if(!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=ok?'triangle':'sawtooth';o.frequency.setValueAtTime(ok?660:200,t);o.frequency.exponentialRampToValueAtTime(ok?1320:110,t+.18);g.gain.setValueAtTime(ok?.14:.08,t);g.gain.exponentialRampToValueAtTime(.001,t+.28);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.3)}catch(e){}}

{id:'props',u:1,e:'⭐',t:'Las 8 propiedades',ref:'1.2',steps:[
 {type:'cards',items:[
  {e:'⭐',t:'Información que vale',fq:'¿Cuáles son las 8 propiedades de la información?',d:'No toda la información sirve: para aportar valor debe cumplir 8 propiedades (Lapiedra Alcamí, Devece Carañana y Guiral Herrando, 2011).',tip:'RECCo-PuDeCo → Relevancia · Exactitud · Completa · Confianza · Comunicación · Puntualidad · Detalle · Comprensión'},
  {e:'🎯',t:'1. Relevancia',d:'Reduce la incertidumbre y aporta conocimiento. La irrelevante solo confunde y suma volumen.'},
  {e:'📏',t:'2. Exactitud',d:'Muy difícil de lograr, pero tiene que apuntar a la necesidad por la que se pidió.'},
  {e:'🧩',t:'3. Completa',d:'Reúne TODOS los puntos de la necesidad. Se apoya en la exactitud.'},
  {e:'🤝',t:'4. Confianza',d:'La fuente tiene que ser válida. Si no, trabajás con información errónea.'},
  {e:'📡',t:'5. Comunicación',d:'Circula por la jerarquía con seguridad, accesos limitados y fluidez: cada parte recibe lo que necesita.'},
  {e:'⏰',t:'6. Puntualidad',d:'Llega cuando se la necesita. Si se demora genera conflictos; cierta info caduca o pierde exactitud.'},
  {e:'🔬',t:'7. Detalle',d:'El justo y necesario. MÁS NO SIEMPRE ES MEJOR: mucha complejidad baja el rendimiento del análisis.'},
  {e:'💬',t:'8. Comprensión',d:'Si no se entiende, no vale ni se puede usar. La presentación es clave.'}
 ]},

  {e:'💡',t:'Sistema binario',d:'Lo usan los circuitos digitales. Solo dos valores: 1 = encendido, 0 = apagado.'},
  {e:'🔹',t:'Bit',d:'Un 1 o un 0. Es la UNIDAD MÍNIMA de información.'},
  {e:'📦',t:'Byte',d:'8 bits juntos. Representa 256 valores porque 2⁸ = 256 (el 2 = dos valores; el 8 = cantidad de bits). Va de 0 (00000000) a 255 (11111111).',tip:'1 byte = 1 carácter (una letra, un número o un símbolo).'},
  {e:'🪜',t:'La escala',fq:'¿Cuál es la escala de posiciones del byte?',d:'Tenela de memoria. Cada casillero vale el doble que el de su derecha:',html:V.scale,tip:'Empezá en 1 y duplicá: 1, 2, 4, 8, 16, 32, 64, 128.'},
  {e:'➡️',t:'Decimal → Binario',d:'De izquierda a derecha preguntás: ¿el resto es ≥ que el casillero? SÍ → pongo 1 y resto. NO → pongo 0.',ex:'184: entra 128 (resta 56) · 64 no · 32 sí (24) · 16 sí (8) · 8 sí (0) · resto 0 → 10111000'},
  {e:'⬅️',t:'Binario → Decimal',d:'Ponés la escala arriba y SUMÁS los valores donde hay un 1.',ex:'11001110 → 128 + 64 + 8 + 4 + 2 = 206'},
  {e:'🔤',t:'ASCII',d:'Código Estadounidense Estándar para el Intercambio de Información (ANSI, 1967). Sirve para INTERCAMBIAR información: cada carácter tiene su valor.',ex:'J=74 · u=117 · a=97 · n=110 → “Juan” = 4 bytes',tip:'Para el examen: la tabla tiene 256 valores (el original era de 7 bits = 128; el extendido llega a 256).'}
 ]},

  {e:'🐱',t:'Orden de las unidades',fq:'¿Cuál es el orden de las unidades de medida?',d:'KB → MB → GB → TB → PB → EB → ZB → YB',tip:'“Kilos de Mega Gatos Tienen Pulgas En Zonas Yermas”'},
  {e:'💾',t:'Medios de almacenamiento',d:'Externos: pendrives, tarjetas de memoria y discos extraíbles (en TB). Internos de gran volumen: servidores.',ex:'El CD perdió su función de backup (respaldo): hoy es casi solo para música.'},
  {e:'☁️',t:'Servidores propios o nube',d:'Algunas empresas tienen servidores propios. Otras contratan la NUBE: un proveedor aloja la info en línea, con acceso desde muchos dispositivos.'},
  {e:'🛡️',t:'Los 3 factores del almacenamiento',d:'1) Confiabilidad → no perder la integridad. 2) Fiabilidad en el acceso → siempre disponible. 3) Seguridad → sin accesos no autorizados.',tip:'“Que esté BIEN, que esté SIEMPRE y que sea MÍA.”'},
  {e:'🏷️',t:'Modelo ITAMI (1987)',d:'La empresa tiene recursos TANGIBLES (capital) e INTANGIBLES (info del mercado, marca). La info importa en 3 aspectos: el entorno, la info interna y la proyección hacia el entorno.',html:V.itami,tip:'ITAMI = Intangibles'},

  {e:'⚙️',t:'Sistema',d:'Conjunto de elementos que INTERACTÚAN entre sí persiguiendo un determinado FIN.',ex:'Empresas, transportes, universidades… todos son sistemas.'},
  {e:'🤾‍♀️',t:'Sinergia',d:'El sistema es MÁS que la suma de sus partes: la unión genera un “plus” que ninguna parte logra sola.',ex:'Handball femenino: una jugadora sola no arma un “sistema defensivo”; las 6 juntas logran la defensa 6-0 o 5-1.',tip:'1 + 1 = 3'},
  {e:'🪆',t:'Recursividad',d:'Un elemento de un sistema también es un sistema. Todo sistema es subsistema de uno mayor.',html:V.nest,ex:'En la empresa: Ventas, Compras y Logística son subsistemas… y cada una tiene sus propios subsistemas.',tip:'Como las mamushkas: muñeca dentro de muñeca.'},

  {e:'🧩',t:'Sistemas Integrados',d:'Forman parte de los SI y están MODULARIZADOS: facilitan la implementación, reducen tiempos y estandarizan procesos.'}
 ]},

 ]}

{id:'si',u:2,e:'🗄️',t:'Sistemas de Información',ref:'2.1 – 2.3',steps:[
 {type:'cards',items:[
  {e:'🗄️',t:'Sistema de Información (SI)',d:'Sistema capaz de ALMACENAR la información de una empresa, manteniendo su INTEGRIDAD y permitiendo su MANIPULACIÓN.',ex:'Su fin: apoyar las actividades, optimizar procesos y recolectar info para análisis. Las personas lo nutren todo el tiempo.'},
  {e:'➕',t:'La fórmula del SI',fq:'¿Cuál es la fórmula del SI?',d:'Todo sistema tiene E-P-S. El SI le suma el ALMACENAMIENTO (la info persiste en el tiempo, en una base de datos).',html:V.si,tip:'SI = E + P + S + ALMACENAMIENTO, sobre Hardware + Software + Red'},
  {e:'🖥️',t:'Hardware del SI',d:'TERMINALES: las usan los usuarios para sus operaciones (transacciones). SERVIDORES: más potentes, guardan toda la info, siempre disponibles. La BD vive en los servidores.'},
  {e:'💿',t:'Software del SI',d:'Interfaz con el usuario + SGBD (Sistema de Gestión de Base de Datos: manipular la info con seguridad y disponibilidad) + software adicional (seguridad, representación, etc.).'},
  {e:'🌐',t:'Red de comunicación',d:'Con más de una terminal, se comunican entre sí y con el servidor. Incluye mensajería interna y la estructura de red.'},
  {e:'📜',t:'Antes de los SI',d:'Todo era manual: formularios, informes y cuadernos escritos. Con la Informática llegaron los SI en 4 etapas; cada una parte de la anterior.'},
  {e:'📅',t:'Evolución: 4 etapas',fq:'¿Cuáles son las 4 etapas de evolución de los SI con su década?',d:'SPT (’60) → MIS (’70) → DSS (’80) → EIS (fines ’80 / principios ’90). Lapiedra Alcamí y otros (2011).',tip:'“Siempre Me Decido Ejecutar” = SPT · MIS · DSS · EIS (60-70-80-90)'},
  {e:'🧾',t:'SPT – Procesamiento de Transacciones',d:'(’60) Apoyan los procesos diarios, reemplazan lo manual y guardan la info del día.'},
  {e:'📋',t:'MIS – Administración de la Información',d:'(’70) Administran todos los procesos, gestionan la info y permiten analizarla.'},
  {e:'🧭',t:'DSS – Apoyo a la Toma de Decisiones',d:'(’80) Parten de los MIS y profundizan el análisis para los cargos GERENCIALES.'},
  {e:'👔',t:'EIS – Información para Ejecutivos',d:'(fines ’80 / principios ’90) Toman los DSS y suman apoyo a las tareas: acceso, gestión y representación de la info, fácil de usar.'}
 ]},
 {type:'order',q:'Armá la línea de tiempo de los SI',items:['🧾 SPT – años ’60','📋 MIS – años ’70','🧭 DSS – años ’80','👔 EIS – fines ’80 / principios ’90']},
 {type:'sort',rk:['sihw','sisw','red'],q:'¿A qué componente del SI pertenece?',buckets:['🖥️ Hardware','💿 Software','🌐 Red de comunicación'],items:[
  ['Terminales que usan los empleados',0],['Servidores (donde vive la BD)',0],['Interfaz con el usuario',1],['SGBD',1],['Software de seguridad y de representación de la info',1],['Mensajería interna',2],['Estructura que comunica los equipos',2]]},
 {type:'quiz',qs:[
  {q:'¿Qué le AGREGA el SI al clásico E-P-S?',o:['El almacenamiento','La salida','El monitor','El usuario']},
  {q:'¿Qué es un SI?',o:['Sistema que almacena la info de la empresa, manteniendo su integridad y permitiendo manipularla','Cualquier computadora','Un antivirus','Una red social interna']},
  {q:'¿Dónde se almacena la base de datos?',o:['En los servidores','En las terminales','En la ROM','En la impresora']},
  {q:'¿Qué hace el SGBD?',o:['Permite manipular la información con seguridad y disponibilidad','Imprime facturas','Conecta los cables','Enciende la computadora']},
  {q:'Los DSS apoyan la toma de decisiones de…',o:['Los cargos gerenciales','Los cajeros','Los proveedores','Los clientes']},
  {q:'¿Para qué se modularizan los Sistemas Integrados?',o:['Facilitar la implementación, reducir tiempos y estandarizar','Para que sean más caros','Para no usar base de datos','Para que cada área quede aislada']},
  {q:'¿Qué le suman los EIS a los DSS?',o:['Apoyo a las tareas: acceso, gestión y representación fácil de la info','Procesar las transacciones diarias','Reemplazar los formularios manuales','Agrupar el presentismo']}
 ]}
]},
{id:'piramide',u:2,e:'🔺',t:'La pirámide de niveles',ref:'2.4',steps:[
 {type:'cards',items:[
  {e:'🔺',t:'Niveles de tratamiento',fq:'¿Cuáles son los niveles de la pirámide y qué SI usa cada uno?',d:'Cada usuario tiene un rol y usa la info para ciertas tareas (Lapiedra Alcamí y otros, 2011).',html:V.pyr},
  {e:'🧾',t:'Nivel Operativo → SPT',d:'Abajo, con más usuarios. Hacen las operaciones diarias = TRANSACCIONES: altas de clientes, facturas, proveedores, órdenes de compra.',ex:'El SPT trata la info de las operaciones, la guarda y permite manipularla.'},
  {e:'⚖️',t:'Nivel Táctico → MIS',d:'Necesita AGRUPAR la info para ver datos generales: facturación por períodos, presentismo, promedio de atrasos en pagos.',ex:'El MIS parte de los transaccionales y genera conocimiento para detectar TENDENCIAS.'},
  {e:'🔝',t:'Nivel Estratégico → DSS y EIS',d:'Arriba: TOMA DE DECISIONES. EIS = Dirección General · DSS = Gerentes de áreas.',ex:'Muestran conocimiento del análisis de forma fácil de comprender.',tip:'EIS = Ejecutivos (los de más arriba) · DSS = Decisiones de gerentes'},
  {e:'🧾',t:'Ejemplo: la facturación',fq:'¿Cómo se usa la facturación en cada nivel?',d:'Operativo: genera una factura en cada venta y la consulta ante reclamos. Táctico: informe anual mes a mes → meses fuertes y débiles. Estratégico: lanza campañas en los meses débiles.'},
  {e:'❗',t:'La pregunta trampa',fq:'¿El nivel operativo detecta los meses de baja facturación?',d:'¿El operativo detecta los meses flojos? NO. Tiene otra función. La información es SIEMPRE LA MISMA (la que carga el operativo); lo que cambia es el análisis.'}
 ]},
 {type:'sort',pyr:1,rk:['estr','tact','oper'],q:'¿En qué nivel de la pirámide va?',buckets:['🔝 Estratégico','⚖️ Táctico','🧾 Operativo'],items:[
  ['Cargar un cliente nuevo',2],['Emitir una factura en cada venta',2],['Usa el SPT',2],['Usa el MIS',1],['Usa el EIS (Dirección General)',0],['Usa el DSS (gerentes)',0],
  ['Informe de facturación mes a mes del año',1],['Promedio de atrasos en pagos de clientes',1],['Lanzar campañas en los meses flojos',0],['Presentismo del personal por período',1],['Generar una orden de compra',2],['El nivel con MÁS usuarios',2],['Toma de decisiones',0]]},
 {type:'quiz',qs:[
  {q:'¿El nivel operativo detecta los meses de poca facturación?',r:'trampa',o:['No: tiene otra función; eso surge del análisis del táctico','Sí, con resultados exactos','Sí, pero solo en diciembre','Depende del SGBD']},
  {q:'Entre un nivel y otro, ¿qué cambia?',o:['El proceso de análisis (la info es la misma)','La información','La base de datos','El hardware']},
  {q:'El EIS lo usa… y el DSS lo usa…',r:'estr',o:['Dirección General · Gerentes de áreas','Gerentes · Dirección General','Operativos · Tácticos','Clientes · Proveedores']},
  {q:'¿Qué nivel tiene más usuarios?',o:['Operativo','Táctico','Estratégico','Todos igual']}
 ]}
]},
{id:'org',u:2,e:'🏢',t:'El SI en la empresa',ref:'2.5 – 2.6',steps:[
 {type:'cards',items:[
  {e:'🦴',t:'La columna vertebral',fq:'¿Qué 6 aspectos hacen compatibles al SI y la organización?',d:'Hoy el SI automatiza los procesos y lleva la info por toda la empresa. Para que encaje con la organización hay que cuidar 6 aspectos:',ex:'Objetivos · Medio · Dirección · Desgaste · Permeabilidad · Interoperabilidad',tip:'“Olga Mira Dos Dramas Por Internet” = O · M · D · D · P · I'},
  {e:'🎯',t:'1. Objetivos',d:'La empresa define misión y visión. El SI se ADAPTA a sus objetivos para no romper la estructura.',ex:'Caso especial: empresas sin objetivos claros implementan un SI justamente para poner orden.'},
  {e:'🌎',t:'2. El medio',d:'La empresa es un sistema ABIERTO: el medio (clientes, proveedores, lo legal y lo económico) la retroalimenta. La empresa y el SI se fusionan.',ex:'El medio entra al sistema por contacto directo o a través del SI.'},
  {e:'🧭',t:'3. La dirección',d:'Es cumplir objetivos, misión y visión. El SI solo es estable si la dirección mantiene lo establecido.'},
  {e:'🌀',t:'4. El desgaste',fq:'¿Cuál es la cadena del desgaste (entropía)?',d:'Entropía = desgaste por retroalimentaciones internas y externas. Cadena: desgaste → inestabilidad → caos → desaparición.',ex:'Una persona enferma no rinde → su puesto no cumple → afecta a las áreas que dependen de ese trabajo.'},
  {e:'🎛️',t:'Control y equilibrio',d:'CONTROL: la propiedad que un sistema NUNCA puede perder. Se mantiene con el PRINCIPIO DE EQUILIBRIO, que compensa lo adverso.'},
  {e:'🧽',t:'5. Permeabilidad',d:'LIMITAR las entradas externas. El medio nutre pero también daña: el sistema debe ser “razonablemente abierto”.',tip:'Permeabilidad = filtro (como una esponja que deja pasar solo lo necesario).'},
  {e:'🤝',t:'6. Interoperabilidad',d:'COOPERACIÓN y sincronización de procesos entre varios sistemas, para ser eficientes.',ex:'Compras elige proveedor según las preferencias que marcan los clientes en Ventas.',tip:'INTER-operar = operar ENTRE sistemas.'},
  {e:'🏛️',t:'Arquitecturas del SI',fq:'¿Cuáles son las arquitecturas de un SI?',d:'Elmasri y Navathe (2007): la empresa elige centralizada o distribuida según lo que necesite.',html:V.arch},
  {e:'⚠️',t:'Cierre',fq:'¿Qué pasa si hay disparidad entre el SI y la organización?',d:'El SI debe tener la MISMA estructura que la organización: cualquier disparidad deteriora toda la estructura.'}
 ]},
 {type:'order',q:'Los 6 aspectos (Olga Mira Dos Dramas Por Internet)',items:['🎯 Objetivos','🌎 Medio','🧭 Dirección','🌀 Desgaste','🧽 Permeabilidad','🤝 Interoperabilidad']},
 {type:'order',q:'La cadena del desgaste',items:['🌀 Desgaste elevado','📉 Inestabilidad','💥 Caos','⚰️ Desaparición del sistema']},
 {type:'sort',rk:['central','m1','m2'],q:'¿Qué arquitectura es?',buckets:['🏠 Centralizada','🌐 Distribuida M1','🔗 Distribuida M2'],items:[
  ['Todo ocurre en un mismo sitio',0],['Usuarios → Aplicaciones → SGBD → BD, dentro de la empresa',0],['Varias sedes y UNA sola base de datos',1],['Las sedes son “clientes” que acceden por la red',1],['Cada sede tiene su propio servidor y BD',2],['Los servidores se comunican entre sí',2],['La más compleja de diseñar',2]]},
 {type:'quiz',qs:[
  {q:'La empresa solo deja entrar del exterior lo que el sistema necesita. Eso es…',o:['Permeabilidad','Interoperabilidad','Sinergia','Entropía']},
  {q:'Ventas y Compras se coordinan para elegir proveedor. Eso es…',o:['Interoperabilidad','Permeabilidad','Recursividad','Control']},
  {q:'La propiedad que un sistema NUNCA puede perder:',o:['Control','Permeabilidad','Sinergia','Detalle']},
  {q:'El control se mantiene buscando el…',o:['Principio de equilibrio','Principio de entropía','Máximo detalle','Sistema cerrado']},
  {q:'Un problema en un subsistema…',o:['Afecta en mayor o menor medida a todos los que dependen de él','No afecta a nadie','Solo afecta a los clientes','Mejora la sinergia']},
  {q:'Si hay disparidad entre el SI y la organización…',o:['Se deteriora toda la estructura','No pasa nada','Mejora la permeabilidad','El SI se adapta solo']},
  {q:'Elementos del medio de una empresa:',r:'medio',o:['Clientes, proveedores, aspectos legales y económicos','Solo los empleados','La RAM y la ROM','Las terminales']}
 ]}
]},

{id:'logistica',u:3,e:'🚚',t:'Logística y WMS',ref:'3.1',steps:[
 {type:'cards',items:[
  {e:'🧩',t:'El subsistema logístico',d:'El SI abarca TODAS las áreas. Adentro tiene subsistemas o módulos: ventas, compras, finanzas… y el LOGÍSTICO.',ex:'Puede ser independiente del SI, pero la mayor eficiencia se logra INTEGRÁNDOLO: facilita el flujo de información.',tip:'Integrado > independiente.'},
  {e:'🚚',t:'Logística',fq:'¿Cuál es la misión de la logística según Guill Fuster (2011)?',d:'Es parte de la gestión de la cadena de suministros. Misión: colocar los productos ADECUADOS en el LUGAR adecuado, en el MOMENTO preciso y en las CONDICIONES deseadas, aportando lo máximo a la rentabilidad.',ex:'Guill Fuster (2011).',tip:'Producto + Lugar + Momento + Condiciones = 💰 rentabilidad'},
  {e:'⛓️',t:'Cadena de suministros',fq:'¿En qué se basa la cadena de suministros?',d:'Se basa en el FLUJO DE INFORMACIÓN Y MATERIALES, dentro y fuera de la organización.',html:V.cadena,ex:'Si la empresa solo COMERCIALIZA no hay transformación, pero se respeta el mismo ciclo (Guill Fuster, 2011).'},
  {e:'💎',t:'Cadena de valor de Porter (1985)',d:'Hay que analizar TODOS los procesos que generan valor a la empresa, con eje en la producción de bienes y/o servicios.',ex:'Citado por Rodríguez y Lamarca (2012).'},
  {e:'📶',t:'Qué aporta en cada nivel',d:'Operativo: info de cada producto en TIEMPO REAL para el día a día. Táctico y estratégico: decidir con info EXACTA del movimiento de productos.',ex:'Los ERP traen un módulo de producción: manejar el inventario, mejorar los ciclos de producción y ganar ventaja competitiva (Rodríguez y Lamarca, 2012).'},
  {e:'🏭',t:'WMS',fq:'¿Qué es un WMS y por qué conviene optimizar el almacenaje?',d:'Warehouse Management System = Sistema de Gestión de Almacenes. Optimizar el almacenaje aumenta la competitividad: mejor respuesta al cliente, menos costos y más producción.',tip:'No todo es bajar costos de compra y subir ventas: producción también es protagonista.'},
  {e:'🚫',t:'Errores frecuentes del almacén',d:'Falta de control de stock, mal manejo de mínimos y máximos, movimiento de transitorios, identificación, clasificación y ubicación de productos.',ex:'Wolters Kluwer (2016).'},
  {e:'📥',t:'3 funciones del área de producción',fq:'¿Cuáles son las 3 funciones básicas del área de producción?',d:'ENTRADA (insumos de proveedores) → ALMACENAMIENTO (ubicación, conservación, vencimientos, stock mínimo y máximo) → SALIDA (despachar o transformar).',html:V.prod,ex:'Silva García (2018).'},
  {e:'🏆',t:'5 ventajas del WMS',fq:'¿Cuáles son las 5 ventajas de un SI basado en WMS?',d:'Silva García (2018):',html:V.vwms,tip:'C-O-M-S-D: Control · Optimización · Mejora RR. HH. · Sencilla identificación · Disminución de errores'}
 ]},
 {type:'order',q:'Las 3 funciones del área de producción',items:['📥 Entrada','📦 Almacenamiento','📤 Salida']},
 {type:'order',q:'Las 5 ventajas del WMS (C-O-M-S-D)',items:['🎛️ Control total de la mercadería','📐 Optimización de espacios','👷 Mejora en la labor de los RR. HH.','🔎 Sencilla identificación','✅ Disminución de errores']},
 {type:'sort',rk:['vwms','vwms','vwms','vwms','vwms'],q:'¿Qué ventaja del WMS es?',buckets:['🎛️ Control total','📐 Optimización de espacios','👷 Mejora RR. HH.','🔎 Sencilla identificación','✅ Menos errores'],items:[
  ['Ver en tiempo real el movimiento de la mercadería',0],['Buscar el lugar adecuado para cada mercadería',1],['Info precisa y exacta que fortalece los procesos diarios',2],['Encontrar fácil la mercadería y su ubicación',3],['Evitar ventas sin stock y compras innecesarias',4],['Evitar excesos de producción y problemas de despacho',4]]},
 {type:'quiz',qs:[
  {q:'Según Guill Fuster (2011), la logística es parte de…',r:'logist',o:['La gestión de la cadena de suministros','El área de recursos humanos','La cadena de valor de Porter','El CRM']},
  {q:'¿En qué se basa la cadena de suministros?',o:['En el flujo de información y materiales, dentro y fuera de la organización','Solo en las ventas','En el flujo de dinero entre bancos','En la publicidad']},
  {q:'¿Qué plantea Porter (1985)?',o:['Analizar todos los procesos que generan valor a la empresa','Que la logística es independiente del SI','Las 4 perspectivas del CMI','Que el cliente es el eje central']},
  {q:'¿Por qué conviene integrar el sistema logístico al SI?',r:'sublog',o:['Porque facilita el flujo de información y logra mayor eficiencia','Porque es obligatorio por ley','Porque así no hace falta base de datos','Porque reduce la cantidad de usuarios']},
  {q:'Una empresa que solo COMERCIALIZA (no fabrica)…',r:'cadsum',o:['No transforma, pero respeta el mismo ciclo de la cadena','No tiene cadena de suministros','No necesita proveedores','No usa logística']},
  {q:'En el nivel OPERATIVO, el sistema logístico aporta…',r:'lognivel',o:['La información de cada producto en tiempo real','Las campañas para los meses flojos','El diagnóstico de la estrategia','Los patrones de compra']},
  {q:'WMS significa…',r:'wms',o:['Warehouse Management System (Sistema de Gestión de Almacenes)','Web Marketing System','Workflow Management Software','World Media Service']},
  {q:'“Mal manejo de mínimos y máximos” es…',r:'werr',o:['Un error frecuente del almacén (Wolters Kluwer, 2016)','Una ventaja del WMS','Una etapa del almacén','Un riesgo del ERP']}
 ]}
]},
{id:'deposito',u:3,e:'🏷️',t:'Almacén: etapas y códigos',ref:'3.1',steps:[
 {type:'cards',items:[
  {e:'🔄',t:'El SI en el almacén',d:'El SI guarda cada dato de la mercadería y lo convierte en información. En cada proceso: entrada de datos → proceso y almacenamiento → salida (pantalla o impresora).'},
  {e:'📋',t:'Las 6 etapas del almacén',fq:'¿Cuáles son las 6 etapas del proceso de almacén, en orden?',d:'1) Recepción · 2) Alta y carga de ubicación · 3) Almacenaje · 4) Revisión y mantenimiento periódico · 5) Gestión de pedidos de clientes · 6) Logística y distribución.',ex:'Wolters Kluwer (2016).',tip:'“Recibo, Doy de alta, Guardo, Reviso, Pido y Distribuyo”'},
  {e:'📡',t:'Tecnologías de identificación',fq:'¿Cuáles son las 4 tecnologías de identificación de productos?',d:'Detectan productos automáticamente con lectores (Silva García, 2018; Wolters Kluwer, 2016):',html:V.tecid,tip:'RFID = Rango (distancia y alturas) · Voice = manos libres · Pick to light = luces'},

  {e:'🔢',t:'Cómo se lee el EAN 13',d:'Es el más usado. 13 dígitos: 3 del PAÍS + 4 o 5 de la EMPRESA + los del PRODUCTO + el último de CONTROL.',tip:'País → Empresa → Producto → Control'}
 ]},
 {type:'order',q:'Las 6 etapas del almacén, en orden',items:['📥 Recepción de mercadería','🏷️ Alta y carga de ubicación','📦 Almacenaje','🔧 Revisión y mantenimiento periódico','🧾 Gestión de pedidos de clientes','🚚 Logística y distribución']},

{id:'erp',u:3,e:'🧩',t:'ERP: el SI empaquetado',ref:'3.2',steps:[
 {type:'cards',items:[
  {e:'🧩',t:'ERP',fq:'¿Qué es un ERP y en qué se diferencia de un SI a medida?',d:'Enterprise Resource Planning = Planificación de Recursos Empresariales. Son SI integrados que planifican los recursos… pero vienen EMPAQUETADOS y se PARAMETRIZAN según la empresa.',html:V.erp,ex:'Fuster, Guitart Hormigo, Joana y Rodríguez (2011).',tip:'ERP = paquete que se “acomoda” a la empresa.'},
  {e:'🧱',t:'Módulos e interoperabilidad',d:'Módulos funcionales adaptables (ventas, compras, finanzas…), flexibles y amigables. Se integran con otras aplicaciones: INTEROPERABILIDAD.',ex:'Los módulos están vinculados, pero funcionan de manera independiente (Gómez Vieites y Suárez Rey, 2011).'},
  {e:'🛠️',t:'Cómo se implementa',fq:'¿Cuáles son los 4 pasos para implementar un ERP?',d:'1) El proveedor tiene módulos para rubros específicos → 2) Orienta a la organización sobre los paquetes → 3) Se elige el paquete y qué módulos → 4) Relevamiento más profundo (incluida la interfaz).',ex:'Si comprás solo algunos módulos, después podés sumar los restantes.'},
  {e:'🎚️',t:'Parametrización',fq:'¿Cuáles son los 5 aspectos de la parametrización de un ERP?',d:'1) Estructura fiscal · 2) Localización (horarios, divisas, impuestos) · 3) Tipologías de productos/servicios · 4) Estructura física, organizativa y documental · 5) Flujos de procesos.',ex:'Gómez Vieites y Suárez Rey (2011). Además, el ERP puede integrarse a BD analíticas para obtener conocimiento.',tip:'F-L-T-E-F: Fiscal · Localización · Tipologías · Estructura · Flujos'},
  {e:'🌡️',t:'El “sensor” del ERP',fq:'¿Qué define si un ERP da ventajas o problemas?',d:'La CORRECTA IMPLEMENTACIÓN. Si se aceleran los tiempos o se elige el paquete equivocado: problemas de comunicación entre usuarios, procesos que no coinciden, problemas de acceso y permisos, parametrización que no sirve.'},
  {e:'✅',t:'Ventajas: MIA',fq:'¿Cuáles son las 3 ventajas/características del ERP?',d:'Fuster y otros (2011):',html:V.mia,ex:'Consecuencias: mejores procesos, mejor comunicación y disponibilidad de la info, control más eficiente.',tip:'MIA = Modularidad · Integración · Adaptabilidad'},
  {e:'⚠️',t:'Riesgos del ERP',fq:'¿Cuáles son los 4 riesgos del ERP?',d:'1) Poca flexibilidad de la organización al cambio · 2) Incompatibilidad entre procesos del ERP y de la empresa · 3) Implementación que se extiende · 4) Costos (implementación + capacitaciones + recursos tecnológicos).',tip:'“Flexibilidad, Compatibilidad, Tiempo y Plata”'},
  {e:'💼',t:'Ejemplo: Presea',d:'Software Presea, de la empresa Neuralsoft: un ERP comercial con módulos para distintos procesos de la organización.'}
 ]},
 {type:'order',q:'Los pasos para implementar un ERP',items:['📦 El proveedor tiene módulos por rubro','🧭 Orienta a la organización sobre los paquetes','✅ Se elige el paquete y los módulos','🔍 Relevamiento más profundo (incluida la interfaz)']},
 {type:'order',q:'Parametrización (F-L-T-E-F)',items:['🧾 Estructura fiscal','🌍 Localización','🏷️ Tipologías de productos/servicios','🏢 Estructura física, organizativa y documental','🔀 Flujos de procesos']},
 {type:'sort',rk:['mia','riesgos','malaimpl'],q:'¿Ventaja, riesgo o mala implementación?',buckets:['✅ Ventaja (MIA)','⚠️ Riesgo del ERP','💥 Mala implementación'],items:[
  ['Los datos se cargan una sola vez y los ven todas las áreas',0],['Se divide en módulos con labores específicas',0],['Diseño estándar que se ajusta a la medida',0],['La organización no se adapta al cambio',1],['Costos de capacitación y recursos tecnológicos',1],['El período de implementación se extiende',1],['Se apuraron los tiempos y hay problemas de acceso y permisos',2],['Parametrización que no responde a las necesidades',2]]},
 {type:'quiz',qs:[
  {q:'¿Qué diferencia a un ERP de un SI desarrollado a medida?',r:'erp',o:['Viene empaquetado y se parametriza','Es siempre más barato','No tiene módulos','No usa base de datos']},
  {q:'¿Qué define si un ERP trae ventajas o problemas?',r:'malaimpl',o:['La correcta implementación','La marca del proveedor','La cantidad de usuarios','El color de la interfaz']},
  {q:'“Los datos se ingresan una sola vez y quedan disponibles para cada área” describe…',r:'mia',o:['Integración','Modularidad','Adaptabilidad','Parametrización']},
  {q:'“Diseñado de manera estándar, pero se ajusta a la medida” describe…',r:'mia',o:['Adaptabilidad','Integración','Modularidad','Interoperabilidad']},
  {q:'Horarios, divisas e impuestos son parte de…',r:'param',o:['La localización (parametrización)','La estructura fiscal','Los flujos de procesos','Las tipologías']},
  {q:'¿Cuál NO es un riesgo del ERP?',r:'riesgos',o:['Modularidad','Costos','Extensión del período de implementación','Poca flexibilidad de la organización']},
  {q:'Si compraste solo algunos módulos del ERP…',r:'erpimpl',o:['Podés agregar los restantes cuando quieras','Nunca podés sumar otros','Tenés que cambiar de proveedor','Los módulos no funcionan']},
  {q:'Ejemplo de ERP comercial del módulo:',r:'presea',o:['Presea, de Neuralsoft','Excel, de Microsoft','Linux','El EAN 13']}
 ]}
]},
{id:'crm',u:3,e:'💖',t:'CRM: el cliente al centro',ref:'3.3',steps:[
 {type:'cards',items:[
  {e:'💖',t:'CRM',fq:'¿Qué es un CRM?',d:'Customer Relationship Management = Gestión de Relaciones con el Cliente. SI basado en políticas que ponen al CLIENTE COMO EJE: trato especial y oferta personalizada según sus preferencias.',ex:'Fuster y otros (2011). Aborda preferencias, necesidades, patrones de comportamiento y tendencias de los clientes.'},
  {e:'🧭',t:'4 aspectos a considerar',fq:'¿Cuáles son los 4 aspectos a considerar en un CRM?',d:'1) Analizar el ambiente del MERCADO · 2) Tener la TECNOLOGÍA necesaria · 3) Optimizar la COMUNICACIÓN · 4) Lograr EFICIENCIA en los procesos.',ex:'León Lara y Rodríguez Carbajal (2014).',tip:'M-T-C-E: Mercado, Tecnología, Comunicación, Eficiencia'},
  {e:'🌊',t:'Big Data',d:'Los macrodatos convierten información en conocimiento; ese conocimiento puesto en acción es SABIDURÍA. El SI genera la info a partir de los datos recolectados.',tip:'¡La escalera del Módulo 1 otra vez! Dato → Info → Conocimiento → Sabiduría.'},
  {e:'⚙️',t:'2 funcionalidades (en paralelo)',fq:'¿Cuáles son las 2 funcionalidades del CRM?',d:'Fuster y otros (2011):',html:V.crmf,tip:'Operacional = Optimiza · Analítica = Analiza'},
  {e:'🪜',t:'4 fases del CRM',fq:'¿Cuáles son las 4 fases del CRM (Dans, 2001)?',d:'Parte del marketing tradicional y necesita articularse en 4 fases (Dans, 2001):',html:V.crm,tip:'I-C-I-A: Identifico, Clasifico, Interactúo, Adapto'},
  {e:'🆔',t:'1. Identificación',d:'Se aborda la cartera de clientes: de recolectar pocos o ningún dato a tener info específica de cada cliente, sea cual sea el canal.'},
  {e:'🗂️',t:'2. Clasificación',d:'Se guarda lo de la fase 1 en la BD para armar el PERFIL del cliente. Franja etaria, género y lugar de residencia marcan una tendencia inicial.'},
  {e:'💬',t:'3. Interacción',d:'Se revisa la comunicación: buscar los MEDIOS adecuados y preferidos por el cliente para optimizar el vínculo.'},
  {e:'🎁',t:'4. Adaptación',d:'Análisis complejo de necesidades y preferencias para ofrecer lo que el cliente VERDADERAMENTE necesita: atención personalizada.'},
  {e:'⚠️',t:'Ojo',d:'El CRM es muy interesante, pero NO hay que descuidar los procesos internos ni los proveedores: también son parte de la cadena.'}
 ]},
 {type:'order',q:'Las 4 fases del CRM (I-C-I-A)',items:['🆔 Identificación','🗂️ Clasificación','💬 Interacción','🎁 Adaptación']},
 {type:'order',q:'Los 4 aspectos del CRM (M-T-C-E)',items:['📊 Mercado','💻 Tecnología','💬 Comunicación','⚡ Eficiencia']},
 {type:'sort',rk:['fident','fclas','finter','fadap'],q:'¿En qué fase del CRM estás?',buckets:['🆔 Identificación','🗂️ Clasificación','💬 Interacción','🎁 Adaptación'],items:[
  ['Pasar de no tener datos a tener info de cada cliente',0],['Abordar la cartera de clientes',0],['Armar el perfil con edad, género y residencia',1],['Guardar en la BD lo obtenido en la fase anterior',1],['Buscar los medios de comunicación que prefiere el cliente',2],['Optimizar el vínculo con la info almacenada',2],['Ofrecer lo que el cliente verdaderamente necesita',3],['Atención personalizada tras un análisis complejo',3]]},
 {type:'sort',rk:['crmfun','crmfun'],q:'¿Funcionalidad operacional o analítica?',buckets:['⚙️ Operacional','🔬 Analítica'],items:[
  ['Optimizar cada proceso que realiza',0],['Agilizar cada pedido del cliente',0],['Analizar la información en busca de conocimiento',1],['Detectar tendencias de compra de los clientes',1]]},
 {type:'quiz',qs:[
  {q:'CRM significa…',r:'crm',o:['Customer Relationship Management','Central Resource Manager','Customer Retail Machine','Control de Recursos y Materiales']},
  {q:'La política de un CRM busca que el cliente…',r:'crm',o:['Sienta un trato especial, con una oferta personalizada','Pague menos siempre','No tenga que comunicarse','Compre solo online']},
  {q:'Las 4 fases del CRM son de…',r:'fasescrm',o:['Dans (2001)','Porter (1985)','Kaplan y Norton (1992)','Castillo Puente (2004)']},
  {q:'¿En qué fase se arma el PERFIL del cliente con edad, género y residencia?',r:'fclas',o:['Clasificación','Identificación','Interacción','Adaptación']},
  {q:'La funcionalidad ANALÍTICA del CRM se basa en…',r:'crmfun',o:['El análisis de la información para buscar conocimiento','Optimizar cada proceso','Imprimir facturas','Controlar el stock']},
  {q:'Según el módulo, el Big Data convierte…',r:'bigdata',o:['Información en conocimiento (y en acción, en sabiduría)','Conocimiento en datos','Dinero en información','Clientes en proveedores']},
  {q:'¿Qué advierte el cierre del tema CRM?',r:'crm',o:['No descuidar los procesos internos ni los proveedores','Que el CRM reemplaza al ERP','Que el cliente no es tan importante','Que no hace falta tecnología']},
  {q:'Los 4 aspectos a considerar en un CRM los plantean…',r:'aspcrm',o:['León Lara y Rodríguez Carbajal (2014)','Dans (2001)','Elmasri y Navathe (2007)','Guill Fuster (2011)']}
 ]}
]},
{id:'siio',u:3,e:'🔗',t:'SIIO: SI entre empresas',ref:'3.4',steps:[
 {type:'cards',items:[
  {e:'🔗',t:'SIIO',fq:'¿Qué es un SIIO?',d:'Sistemas de Información INTERORGANIZACIONALES: SI compartidos por MÁS DE UNA organización, gracias al avance de las TIC.',ex:'Mejoran la comunicación entre organizaciones, optimizan la producción y fortalecen la cooperación.',tip:'SIIO = SI + “Inter” Organizaciones'},
  {e:'⚙️',t:'De dónde sale',d:'Sistema (Johansen, 1993): “conjunto de elementos que interactúan entre sí para lograr un determinado fin” → SI: gestiona la info y la guarda en BD → SIIO: ese SI compartido.'},
  {e:'🌐',t:'La diferencia clave',fq:'¿Cuál es la diferencia clave entre un SIIO y un SI común?',d:'Se componen IGUAL que un SI común, pero con equipamiento más sofisticado (muchas operaciones son remotas). La diferencia clave es la RED DE COMUNICACIÓN: muy eficiente, para que sea confiable y la info esté disponible.',ex:'Conviene equipamiento HOMOGÉNEO entre las organizaciones para evitar incompatibilidades (Báez Rendón, Campos Moreno y Medina, 2009).'},
  {e:'🔌',t:'Ejemplo: electrodomésticos',d:'Una cadena vende electrodomésticos en varias sucursales y su SIIO incluye a los proveedores.',ex:'Los reclamos llegan AUTOMÁTICAMENTE al proveedor, que además ve lo de otros comercios… y puede DETENER LA PRODUCCIÓN en tiempo real hasta revisar el problema.'},
  {e:'⚔️',t:'Competitivos vs cooperativos',fq:'¿Cómo se clasifican los SIIO?',d:'Castillo Puente (2004):',html:V.siio},
  {e:'🏭',t:'Aplicaciones',d:'Unen organizaciones para optimizar procesos: mejora la fabricación y comercialización, los servicios, la atención al cliente y la respuesta de proveedores.'},
  {e:'🧱',t:'4 niveles a analizar',fq:'¿Cuáles son los 4 niveles a analizar en un SIIO?',d:'Para su correcto funcionamiento:',html:V.nsiio,tip:'“Co-Co-E-Co”: Comunicación, Confianza, Efectividad, Conflicto'}
 ]},
 {type:'order',q:'Los 4 niveles del SIIO (Co-Co-E-Co)',items:['📡 Comunicación','🤝 Confianza','🎯 Efectividad','🚒 Conflicto']},
 {type:'sort',rk:['ncom','nconf','nefec','nconfl'],q:'¿Qué nivel del SIIO es?',buckets:['📡 Comunicación','🤝 Confianza','🎯 Efectividad','🚒 Conflicto'],items:[
  ['Asegurar la conexión entre las organizaciones',0],['Que sea fluida y la info llegue a todos los puntos',0],['Disponibilidad e integridad de la información',1],['Estabilidad del sistema y fiabilidad de la red',1],['Cumplir los procesos con la menor cantidad de recursos',2],['Cumplir cada labor en tiempo y forma',2],['Planes de contingencia para mantener el SIIO en línea',3],['Situaciones que rompen la estructura normal',3]]},
 {type:'sort',rk:['compet','coop'],q:'¿SIIO competitivo o cooperativo?',buckets:['⚔️ Competitivos','🤝 Cooperativos'],items:[
  ['Comparten info general pero siguen compitiendo',0],['BD compartida de situación financiera de clientes',0],['Se muestran independientes entre sí',0],['Comparten información actualizada',1],['Mejoran notoriamente el dinamismo',1],['La cooperación favorece los procesos de cada una',1]]},
 {type:'quiz',qs:[
  {q:'La diferencia clave entre un SIIO y un SI común es…',r:'siiored',o:['La red de comunicación','Que no tiene base de datos','Que no usa hardware','Que es gratuito']},
  {q:'¿Por qué conviene equipamiento homogéneo entre las organizaciones?',r:'siiored',o:['Para favorecer los procesos y evitar incompatibilidades','Para que sea más barato','Porque lo exige la ley','Para competir mejor']},
  {q:'En el ejemplo de los electrodomésticos, el proveedor puede…',r:'electro',o:['Detener la producción en tiempo real al recibir el reporte','Cerrar las sucursales','Cambiar el precio sin avisar','Borrar los reclamos']},
  {q:'La clasificación de los SIIO en competitivos y cooperativos es de…',r:'compet',o:['Castillo Puente (2004)','Johansen (1993)','Dans (2001)','Porter (1985)']},
  {q:'Disponibilidad e integridad de la info, estabilidad y red fiable corresponden al nivel…',r:'nconf',o:['Confianza','Comunicación','Efectividad','Conflicto']},
  {q:'Los planes de contingencia corresponden al nivel…',r:'nconfl',o:['Conflicto','Confianza','Efectividad','Comunicación']},
  {q:'¿Qué permitió que surgieran los SIIO?',r:'siio',o:['El avance de las TIC','La desaparición de los SI','El ERP','Los códigos de barras']}
 ]}
]},

{id:'dw',u:4,e:'🏬',t:'Almacenes de datos',ref:'4.1',steps:[
 {type:'cards',items:[
  {e:'💡',t:'¿Por qué surgen los SGC?',d:'La info del SI crece con el tiempo y se puede aprovechar de forma ANALÍTICA (Cano, 2007). Los niveles táctico y estratégico necesitan info que apoye la TOMA DE DECISIONES → surgen los Sistemas de Gestión de Conocimiento.',tip:'Hilo con el Módulo 1: los SGC recorren la escalera Dato → Info → Conocimiento → Sabiduría.'},
  {e:'🧩',t:'Las 3 piezas del SGC',fq:'¿Cuáles son las 3 piezas de un SGC?',d:'Almacén (Data Warehouse): contener grandes volúmenes · Minería (Data Mining): analizar · Visualización: reflejar los resultados.',html:V.sgc,tip:'Guardo → Analizo → Muestro'},
  {e:'🧠',t:'Inteligencia de Negocio (BI)',d:'Business Intelligence: aprovechar la información en busca de conocimiento. Da apoyo continuo, favorece la competitividad y ayuda al nivel estratégico a decidir (Cano, 2007).',ex:'Los datos almacenados son SOLO datos: hay que analizarlos bien.'},
  {e:'🏬',t:'Almacén de datos',fq:'¿Qué es un almacén de datos?',d:'Conjunto de datos recolectados con un CRITERIO o agrupados por TEMA, que brinda info precisa para apoyar la toma de decisiones y ayuda a analizar la info de la empresa.',tip:'El almacén NO analiza: solo almacena. El análisis lo hace la minería.'},
  {e:'⚖️',t:'Almacén vs BD común',fq:'¿En qué se diferencia un almacén de datos de una BD común?',d:'Elmasri y Navathe (2007):',html:V.dwbd},
  {e:'🔗',t:'Integridad',d:'El almacén toma los datos de las BD comunes. Si la BD operacional pierde integridad, el almacén TAMBIÉN la pierde.'},
  {e:'🏖️',t:'Ejemplo: Partido de la Costa',d:'Hoteles, gastronomía y turismo aportan datos de la temporada → van a un almacén → se analizan → el partido conoce el rendimiento por períodos y mejora la próxima temporada.'},
  {e:'🎲',t:'Dimensiones y hechos',fq:'¿Qué son las dimensiones y los hechos?',d:'DIMENSIONES: las variables que se cruzan (artículos, períodos, locales). HECHOS: el valor que se compara (cantidad, importe).',tip:'Los hechos NO son dimensiones.'},
  {e:'🧊',t:'Cuadro, cubo e hipercubo',fq:'¿Cuántas dimensiones tienen el cuadro de doble entrada, el cubo y el hipercubo?',d:'Más dimensiones = estudio más profundo en busca de patrones o reglas.',html:V.cubo,ex:'Cubo: Artículo N°4 · Enero-2016 · Local 5 → 850 unidades (el hecho es la cantidad).',tip:'Cuadro 2 · Cubo 3 · Hipercubo 4+'},
  {e:'🔄',t:'Operaciones sobre el cubo',fq:'¿Qué son la rotación y el cambio de jerarquización?',d:'ROTACIÓN: analizar desde otra perspectiva, cambiando la dimensión principal. CAMBIO DE JERARQUIZACIÓN: subir el nivel (trimestre, semestre, año → más general) o bajarlo (quincena, semana → más específico).'}
 ]},
 {type:'order',q:'Las 3 piezas del SGC, en el orden en que trabajan',items:['🏬 Almacén de datos','⛏️ Minería de datos','📊 Visualización del conocimiento']},
 {type:'sort',rk:['dwbd','dwbd'],q:'¿Almacén de datos o BD común?',buckets:['🏬 Almacén de datos','🗃️ BD común'],items:[
  ['Principalmente de lectura',0],['Grandes porciones de datos',0],['Actualizaciones periódicas',0],['Recolecta datos operacionales para un análisis complejo',0],['Consulta y manipulación continua',1],['Pequeñas porciones de datos',1],['Altas y modificaciones del día a día',1]]},

  {q:'¿El almacén de datos realiza el análisis?',r:'dw',o:['No: solo almacena; el análisis lo hace la minería','Sí, siempre','Solo en el nivel operativo','Sí, con el SGBD']},
  {q:'¿Cuántas dimensiones tiene un cubo de datos?',r:'cubo',o:['3','2','4 o más','1']},
  {q:'Un análisis con 5 dimensiones se representa con un…',r:'cubo',o:['Hipercubo','Cubo','Cuadro de doble entrada','Árbol de decisión']},
  {q:'Si la BD operacional pierde integridad…',r:'dwint',o:['El almacén también la pierde','El almacén la corrige solo','No afecta al almacén','Se borra el almacén']},
  {q:'Business Intelligence es…',r:'bi',o:['Aprovechar la información en busca de conocimiento para apoyar decisiones','Un tipo de código de barras','Un ERP gratuito','Un antivirus']},

{id:'mineria',u:4,e:'⛏️',t:'Minería de datos',ref:'4.2',steps:[
 {type:'cards',items:[
  {e:'⛏️',t:'Minería de datos',fq:'¿Qué es la minería de datos y qué aporta?',d:'Data Mining: la técnica que DESCUBRE nueva información en los grandes volúmenes del almacén: problemas, patrones y reglas. Se hace por etapas (Elmasri y Navathe, 2007).',ex:'Aportes: detecta comportamientos INUSUALES y patrones NUEVOS que no se ven a simple vista.'},
  {e:'🔍',t:'¿Por qué no alcanza la BD común?',d:'Las consultas de una BD común trabajan sobre PEQUEÑAS porciones: no tienen precisión para decidir. La minería usa los almacenes para extraer patrones que estudian los niveles táctico y estratégico.'},
  {e:'🤝',t:'Almacén + minería',d:'NO son independientes: el almacén se DISEÑA según los temas que se van a recolectar y la investigación que se hará. Se diseñan en conjunto.',tip:'Trampa: “almacén y minería son independientes” → FALSO.'},
  {e:'🎯',t:'4 perspectivas de la minería',fq:'¿En qué 4 perspectivas trabaja la minería?',d:'1) Identificación de determinadas situaciones · 2) Predicción del comportamiento futuro · 3) Optimización de recursos · 4) División de datos según parámetros específicos.',tip:'“Identifico, Predigo, Optimizo y Divido”'},
  {e:'🪜',t:'6 fases del descubrimiento',fq:'¿Cuáles son las 6 fases del descubrimiento de conocimiento?',d:'Almacén y minería se construyen juntos en 6 etapas (Elmasri y Navathe, 2007):',html:V.fases,tip:'“Sé Limpio, Enriquecí, Transformé, Miné y Presenté” → S-L-E-T-M-P'},
  {e:'🧹',t:'Selección y limpieza',d:'1) SELECCIÓN: según el tema, elijo los datos del análisis. 2) LIMPIEZA: reviso datos (pueden venir de varias bases) y elimino REDUNDANCIAS e INCONSISTENCIAS.'},
  {e:'➕',t:'Enriquecimiento y transformación',d:'3) ENRIQUECIMIENTO: sumo datos EXTERNOS de otras fuentes. 4) TRANSFORMACIÓN: estructura homogénea; agrupar por subtemas para reducir el volumen y clasificar.',tip:'Enriquecer = agregar de AFUERA · Limpiar = sacar lo repetido o incoherente'},
  {e:'📊',t:'Minería y presentación',d:'5) MINERÍA: aplico técnicas para buscar problemas, patrones y reglas. 6) PRESENTACIÓN: muestro los resultados de forma sencilla para el nivel estratégico.'},
  {e:'👗',t:'Reglas de asociación',fq:'¿Qué es una regla de asociación? Dá el ejemplo.',d:'Si pasa “a”, es probable (o seguro) que pase “b”.',ex:'Quien compra un vestido de fiesta suele comprar una cartera → poner carteras arriba de los vestidos, por colores. También se usa en salud.'},
  {e:'🏷️',t:'Clasificación y categorías',d:'JERARQUIZACIÓN/CLASIFICACIÓN: detectar aptitudes para un rol (quién rendirá bien en un puesto). CATEGORIZACIÓN: dividir eventos en grupos para trabajar cada uno.',ex:'Categorización: un parque temático detecta tipos de visitantes y satisface a cada grupo.'},
  {e:'📅',t:'Secuenciales y series de tiempo',d:'SECUENCIALES: patrones que se REPITEN (zapatillas del mismo estilo → preferencia). SERIES DE TIEMPO: similitudes en el tiempo (producto “x” con pico cada enero).',tip:'Secuencial = ¿qué se repite? · Serie de tiempo = ¿cuándo hay picos?'}
 ]},
 {type:'order',q:'Las 6 fases del descubrimiento (S-L-E-T-M-P)',items:['🎯 Selección','🧹 Limpieza','➕ Enriquecimiento','🔄 Transformación','⛏️ Minería','📊 Presentación y visualización']},
 {type:'sort',rk:['fsel','flim','fenr','ftra','fmin','fpre'],q:'¿Qué fase del descubrimiento es?',buckets:['🎯 Selección','🧹 Limpieza','➕ Enriquecimiento','🔄 Transformación','⛏️ Minería','📊 Presentación'],items:[
  ['Elegir qué datos entran según el tema',0],['Eliminar redundancias e inconsistencias',1],['Agregar datos externos de otras fuentes',2],['Llevar los datos a una estructura homogénea',3],['Agrupar por subtemas para reducir el volumen',3],['Aplicar técnicas para buscar patrones y reglas',4],['Mostrar los resultados de forma sencilla',5]]},
 {type:'sort',rk:['pasoc','pclas','pcat','psec','pser'],q:'¿Qué tipo de patrón es?',buckets:['🔗 Asociación','🏅 Clasificación','🗂️ Categorización','🔁 Secuencial','📅 Serie de tiempo'],items:[
  ['Quien compra un vestido compra una cartera',0],['Si pasa “a”, es probable que pase “b”',0],['Detectar quién rendirá bien en un puesto de trabajo',1],['Un parque temático divide a sus visitantes en grupos',2],['Compras repetidas de zapatillas del mismo estilo',3],['Un producto que tiene pico de ventas cada enero',4]]},
 {type:'quiz',qs:[
  {q:'¿Qué etapa agrega datos EXTERNOS?',r:'fenr',o:['Enriquecimiento','Limpieza','Selección','Transformación']},
  {q:'¿Qué etapa elimina redundancias e inconsistencias?',r:'flim',o:['Limpieza','Enriquecimiento','Presentación','Minería']},
  {q:'“Vestido → cartera” es un patrón de…',r:'pasoc',o:['Asociación','Serie de tiempo','Categorización','Secuencial']},
  {q:'“El producto x vende más en enero de cada año” es…',r:'pser',o:['Serie de tiempo','Asociación','Clasificación','Categorización']},
  {q:'¿Almacén y minería son independientes?',r:'mindep',o:['No: se diseñan en conjunto','Sí, totalmente','Solo en las pymes','Depende del ERP']},
  {q:'¿Cuál NO es una perspectiva de la minería?',r:'pmin',o:['Parametrización','Predicción del comportamiento futuro','Optimización de recursos','División de datos']},
  {q:'Dos grandes aportes de la minería:',r:'mining',o:['Detectar comportamientos inusuales y patrones que no se ven a simple vista','Imprimir más rápido y gastar menos papel','Reemplazar al almacén y a la BD','Tomar las decisiones por los gerentes']},
  {q:'¿Por qué las consultas en una BD común no alcanzan para decidir?',r:'dwbd',o:['Trabajan sobre pequeñas porciones de datos y no tienen precisión','Porque son ilegales','Porque no tienen datos','Porque son muy lentas']}
 ]}
]},
{id:'visual',u:4,e:'📈',t:'Visualizar el conocimiento',ref:'4.3',steps:[
 {type:'cards',items:[
  {e:'🖼️',t:'¿Por qué visualizar?',d:'Después de la minería falta PRESENTAR el conocimiento, de forma comprensible para el nivel estratégico. Una buena visualización ayuda a convertir el conocimiento en SABIDURÍA.',ex:'Hernández Orallo, Juan Lizandra, Minaya Collado y Monserrat Aranda (2018).'},
  {e:'🎁',t:'La presentación importa',d:'“Es importante el producto, pero aún más su presentación.” Una mala impresión inicial puede arruinar un proyecto valioso. Se trabaja el impacto y también el público receptor.'},
  {e:'👀',t:'“Observar lo que no se ve”',fq:'¿Qué significa “observar lo que no se ve”?',d:'Es la idea de la visualización del conocimiento: mostrar lo que no se veía en la información hasta después del análisis.',ex:'Hoy la comunicación visual es la más usada (Cano, 2007). Los bancos usan Big Data y minería para mejorar productos y captar clientes.'},
  {e:'🧰',t:'5 técnicas sencillas',fq:'¿Cuáles son las 5 técnicas sencillas de representación del conocimiento?',d:'Tablas · Árboles de decisión · Redes semánticas · Gráficos lineales · Gráficos de dispersión (Cano, 2007; Elmasri y Navathe, 2007).',tip:'T-A-R-L-D: Tablas, Árboles, Redes, Lineales, Dispersión'},
  {e:'📋',t:'Tablas',d:'Representan datos según las variables elegidas para obtener conocimiento. Tabla 1: artículos × cuatrimestres.',html:V.tabla1},
  {e:'🌳',t:'Árboles de decisión',d:'Estructura JERÁRQUICA de decisiones que detecta patrones por categorización. En la raíz y en los nodos internos hay una PREGUNTA. Sirven para patrones muy marcados.',html:V.tree},
  {e:'🕸️',t:'Redes semánticas',d:'Localizan valores muy vinculados entre sí: encuentran VINCULACIONES entre variables.',ex:'Fig. 4: almacén de datos y minería conectados por el nodo en común “Información”.'},
  {e:'📈',t:'Gráficos lineales',d:'Muestran TENDENCIAS entre variables. Pueden ser otra forma de mostrar una tabla; según el usuario se usa uno o ambos.'},
  {e:'🔵',t:'Gráficos de dispersión',d:'Muestran la AGRUPACIÓN de los datos y una o varias tendencias. Su impacto visual permite detectar ZONAS y GRUPOS fácilmente.',ex:'Fig. 6: aparecen 3 grupos bien definidos para analizar.'},
  {e:'🙋',t:'¿Quién decide?',fq:'¿El sistema toma las decisiones?',d:'El sistema NO toma decisiones: analiza y muestra. La decisión es del personal encargado, con su criterio.',ex:'La película: si la ves varias veces mirando distintas variables, cada vez notás algo nuevo → recolectar por temas (almacén), buscar patrones (minería) y mostrar claro (visualización).'}
 ]},
 {type:'sort',rk:['tarb','tarb','tarb'],q:'Usá el árbol del parcial: ¿qué condición tiene?',buckets:['🏆 Promocional','✅ Regular','❌ Libre'],items:[
  ['Aprobó el parcial con 8',0],['Aprobó el parcial con 7',0],['Aprobó el parcial con 5',1],['Desaprobó el parcial y aprobó el recuperatorio',1],['Desaprobó el parcial y el recuperatorio',2]]},
 {type:'sort',rk:['ttab','tarb','tred','tlin','tdis'],q:'¿Qué técnica conviene?',buckets:['📋 Tabla','🌳 Árbol de decisión','🕸️ Red semántica','📈 Gráfico lineal','🔵 Dispersión'],items:[
  ['Quiero ver grupos o zonas de datos',4],['Quiero mostrar la tendencia de ventas en el año',3],['Quiero encontrar qué variables están muy vinculadas',2],['Quiero preguntas en la raíz y en los nodos',1],['Patrones muy marcados, por categorización',1],['Quiero cruzar artículos × cuatrimestres con cantidades',0]]},

  {q:'“Es importante el producto, pero aún más su…”',r:'visual',o:['Presentación','Precio','Almacén','Código de barras']},
  {q:'¿Quién toma la decisión final?',r:'nodec',o:['El personal encargado, con su criterio','El sistema','La minería de datos','El almacén de datos']},
  {q:'En un árbol de decisión, la pregunta que orienta el camino está en…',r:'tarb',o:['La raíz y los nodos internos','Solo en las hojas','El eje X','La leyenda']},
  {q:'En la red semántica del módulo, el nodo en común entre almacén y minería es…',r:'tred',o:['Información','Cliente','Proveedor','Hardware']}
 ]}
]},
{id:'cmi',u:4,e:'🎛️',t:'Cuadro de Mando Integral',ref:'4.4',steps:[
 {type:'cards',items:[
  {e:'🎛️',t:'CMI',fq:'¿Qué es el Cuadro de Mando Integral?',d:'Tablero o Cuadro de Mando Integral: herramienta para ADMINISTRAR y hacer SEGUIMIENTO del sistema de gestión, que permite TRANSFORMAR LA ESTRATEGIA.',ex:'Rodríguez Monroy, Fuentes-Pila y Torrubiano (2006). El PDF una vez dice “CIM”, pero es CMI.'},
  {e:'🧠',t:'Vinculado a BI',d:'Está ligado a la Inteligencia del Negocio: monitorea indicadores financieros, operativos, productivos, etc.',ex:'Favorece las decisiones de 2 maneras: ayuda a resolver bien y REDUCE LOS TIEMPOS.'},
  {e:'🩺',t:'Objetivo: el diagnóstico',fq:'¿Cuál es el objetivo del CMI?',d:'DIAGNÓSTICO: encontrar parámetros que no están alineados con los objetivos, impulsar la mejora continua y clarificar estrategias.',ex:'Suárez Kimura, De Marco y Prat (2013).',tip:'CMI = el médico de la empresa 🩺'},
  {e:'🧭',t:'4 perspectivas',fq:'¿Cuáles son las 4 perspectivas del CMI y de quién son?',d:'Kaplan y Norton (1992):',html:V.cmi,tip:'F-C-P-A: “Finanzas Con Procesos Aprendidos”'},
  {e:'🏁',t:'Cierre del módulo',d:'La inteligencia de la información hizo a las organizaciones más eficientes. La minería le da al nivel estratégico la información para decidir: por eso se volvió esencial.'}
 ]},
 {type:'order',q:'Las 4 perspectivas del CMI (F-C-P-A)',items:['💰 Financiera','🙋 Cliente','⚙️ Procesos internos','🌱 Aprendizaje y crecimiento']},

{id:'ingsoft',u:5,e:'🛠️',t:'Ingeniería de Software y ciclo de vida',ref:'5.1',steps:[
 {type:'cards',items:[
  {e:'🛠️',t:'Ingeniería de Software',fq:'¿Qué es la Ingeniería de Software?',d:'Construcción de software COMPLEJO, con MÁS DE UNA VERSIÓN, hecho por MÚLTIPLES PERSONAS en equipo con un objetivo general común.',ex:'Ciencias que involucra: Sistemas Operativos, Bases de Datos, Lenguajes de Programación, Inteligencia Artificial y Modelos Teóricos.',tip:'Complejo + varias versiones + equipo'},
  {e:'👥',t:'El equipo',d:'Necesita programación, estructuras de datos, algoritmos, capacidad de diálogo, interpretar requerimientos y abstraer problemas en niveles.',ex:'Equipo cohesionado: NO todos deben saber todo, pero al menos UNO debe cubrir cada punto.'},
  {e:'🫠',t:'Los SI son “maleables”',d:'Se pueden modificar de manera sencilla, a diferencia de otros sistemas.',ex:'Ghezzi, Jazayeri y Mandrioli (2003).'},
  {e:'🔁',t:'Ciclo de vida',fq:'¿Qué es el ciclo de vida y cuál es su función?',d:'La planificación del proceso para llegar al producto final (guía de implementación). Función: PONER ORDEN, dividido en etapas, para desarrollar bien el software.',ex:'Cada modelo varía en velocidad, calidad, control, seguimiento, gastos y riesgos. Elegir mal = demoras y problemas.'},
  {e:'🧩',t:'Caso ERP',d:'Se construye de forma genérica y modular: la organización compra partes sin necesitar el total. Una vez adquirido, requiere PARAMETRIZACIÓN (adaptarlo y configurarlo).',tip:'Igual que en el Módulo 2: el ERP viene empaquetado y se parametriza.'},
  {e:'⏳',t:'Los 3 tiempos',fq:'¿Cuáles son los 3 tiempos de la clasificación temporal?',d:'Las necesidades marcan cuándo tiene que estar funcionando el sistema:',html:V.tiempos,tip:'“Planeo, Produzco, Mantengo”'}
 ]},
 {type:'order',q:'Los 3 tiempos del proyecto',items:['📋 Planeamiento','🏗️ Producción','🔧 Mantenimiento']},
 {type:'sort',rk:['tiempos','tiempos','tiempos'],q:'¿En qué tiempo del proyecto pasa esto?',buckets:['📋 Planeamiento','🏗️ Producción','🔧 Mantenimiento'],items:[
  ['Análisis profundo de cada proceso',0],['Dividir tareas y armar equipos chicos',0],['Cada equipo modela sus procesos con los usuarios',1],['Ajustes para el acoplamiento entre procesos',1],['Se implementa el sistema',1],['El sistema ya funciona y hay que mantenerlo óptimo',2]]},
 {type:'quiz',qs:[
  {q:'La Ingeniería de Software es…',r:'is',o:['La construcción de software complejo, con más de una versión, hecho en equipo','Programar solo, sin equipo','Arreglar computadoras','Instalar el sistema operativo']},
  {q:'¿Todos los miembros del equipo deben saber todo?',r:'equipo',o:['No: al menos uno debe cubrir cada punto','Sí, todos deben saber todo','Solo el jefe tiene que saber','No hace falta saber programar']},
