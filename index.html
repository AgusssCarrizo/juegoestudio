  {q:'En la metodología tradicional, ¿qué es variable?',r:'triang',o:['Tiempo y costo','El alcance','La visión','El backlog']},
  {q:'¿Las metodologías ágiles necesitan definir al inicio todo el alcance?',r:'agil',o:['No','Sí','Solo en Scrum','Solo en Kanban']},
  {q:'Las ágiles más usadas según la introducción son…',r:'xsk',o:['XP, Scrum y Kanban','PMBOK, PRINCE2 e ISO','Cascada, espiral y RUP','DSDM, FDD y Crystal']},
  {q:'Todas las ágiles se guían por…',r:'xsk',o:['El Manifiesto Ágil','El PMBOK','La ISO 21500','El Chaos Report']},
  {q:'“Las ágiles solo pueden aplicarse a software.”',r:'agil',o:['Falso: son típicas del software, pero se aplican a otros proyectos','Verdadero','Verdadero, salvo Kanban','Solo a obras']}
 ]}
]},
{id:'beneficios',u:5,e:'🎁',t:'Beneficios: las 5 C',ref:'3.2',steps:[
 {type:'cards',items:[
  {e:'🎁',t:'Los beneficios',fq:'¿Cuáles son los 5 grupos de beneficios del ágil?',d:'Según Sarmiento Rojas, Correa Candamil y Jiménez Roa (2020), se agrupan en 5 C:',html:V.c5,tip:'Calidad · Cliente · Control · Cambio · Cash. Si una opción encaja en una C, probablemente es un beneficio.'},
  {e:'✨',t:'Calidad',d:'Más calidad del producto · pruebas periódicas · requisitos definidos JUSTO A TIEMPO (JIT) · mejora continua con retrospectivas.'},
  {e:'🙋',t:'Cliente',d:'Más satisfacción (lanzamientos rápidos para medir su reacción) · victorias tempranas · clientes involucrados y comprometidos.'},
  {e:'🎛️',t:'Control',d:'Más control con reuniones diarias · transparencia con RADIADORES DE INFORMACIÓN · menos probabilidad e impacto de riesgos.'},
  {e:'🔀',t:'Cambio / velocidad',d:'Ciclos incrementales → entrega más rápida de valor · entregas más frecuentes · menos chance de que la competencia llegue antes · libertad para cambiar.'},
  {e:'💵',t:'Cash',d:'Retorno de inversión más rápido (el cliente fija la prioridad) · producto “listo para comercializar” tras algunas iteraciones.'},
  {e:'📚',t:'Más de una docena',fq:'¿Cuáles son las metodologías ágiles más comunes en la industria?',d:'Scrum, XP, Lean (desarrollo de productos ajustados), Kanban, FDD (desarrollo basado en funciones), DSDM (desarrollo de sistemas dinámicos) y la familia Crystal.'}
 ]},
 {type:'sort',rk:['calidad5','cliente5','control5','cambio5','cash5'],q:'¿En qué C va el beneficio?',buckets:['✨ Calidad','🙋 Cliente','🎛️ Control','🔀 Cambio','💵 Cash'],items:[
  ['Requisitos definidos justo a tiempo (JIT)',0],['Pruebas periódicas durante el desarrollo',0],['Mejora continua con retrospectivas',0],['Victorias tempranas',1],['Clientes involucrados y comprometidos',1],['Radiadores de información',2],['Reuniones diarias',2],['Entregas más frecuentes al mercado',3],['Que la competencia no llegue antes',3],['Retorno de inversión más rápido',4],['Producto listo para comercializar',4]]},
 {type:'quiz',qs:[
  {q:'En el ágil, los requisitos se definen…',r:'calidad5',o:['Justo a tiempo (JIT)','Todos al inicio','Al cierre','Solo por el Scrum Master']},
  {q:'Los radiadores de información aportan…',r:'control5',o:['Transparencia (control)','Calor a la oficina','Más costo','Menos calidad']},
  {q:'¿Quién determina la prioridad para un ROI más rápido?',r:'cash5',o:['El cliente','El proveedor','La PMO','El Scrum Master']},
  {q:'“Un beneficio del ágil es definir todos los requisitos al inicio.”',r:'calidad5',o:['Falso: se definen justo a tiempo','Verdadero','Solo en XP','Solo en proyectos grandes']},
  {q:'¿Cuál NO es una metodología ágil?',r:'docena',o:['PMBOK','Crystal','DSDM','FDD']},
  {q:'¿Quiénes son los autores de los beneficios?',r:'sarmiento',o:['Sarmiento Rojas, Correa Candamil y Jiménez Roa (2020)','Torres Hernández (2014)','Standish Group (2018)','Loulakis (2003)']}
 ]}
]},
{id:'scrum',u:5,e:'🏉',t:'Scrum',ref:'3.3',steps:[
 {type:'cards',items:[
  {e:'🏉',t:'Scrum',fq:'¿Qué es Scrum?',d:'Permite trabajar proyectos GRANDES y DIFÍCILES, en entornos dinámicos y cambiantes, de modo FLEXIBLE. Se basa en entregas periódicas y regulares según el VALOR para el cliente, que participa en la prueba de cada entrega.',ex:'Ideal para entornos complejos que piden resultados rápidos y donde la flexibilidad es requisito clave. Los resultados siempre agregan valor.'},
  {e:'📰',t:'Historia',fq:'¿De dónde viene el término Scrum y cuándo se usó por primera vez?',d:'Se usó por primera vez en 1986, en la HARVARD BUSINESS REVIEW. Viene del RUGBY: un scrum es una formación fija para recuperar la pelota y volver a ponerla en juego tras una falta menor.',tip:'“Scrum = rugby, 1986, Harvard”: nadie es jefe, todos empujan juntos'},
  {e:'🦅',t:'Equipos con ASAS',fq:'¿Cuáles son las 4 características de los equipos Scrum?',d:'Autónomos · fases Solapadas · Aprendizaje múltiple · Seguimiento sin control.',html:V.asas,tip:'“Scrum tiene ASAS”'},
  {e:'🎛️',t:'Seguimiento sin control',d:'Funcionan como una pequeña startup, pero con estructura: hay PUNTOS DE CONTROL que analizan el progreso SIN obstaculizar la creatividad.'},
  {e:'🔄',t:'El ciclo completo',fq:'¿Cuáles son los pasos del ciclo completo de Scrum?',d:'Visión → backlog del producto → reunión de planeación → backlog y plan de la iteración → scrum diario → producto de la iteración → revisión → retrospectiva → final.',html:V.ciclo},
  {e:'🔍',t:'Qué pasa en cada paso',d:'Visión: insumos para el backlog. Backlog: todo lo que debe cumplir el producto. Planeación: revisión, estimaciones, metas, definición de “hecho” y plan. Daily: qué hice, qué haré, obstáculos. Revisión: inspeccionar y ajustar. Retro: reflexionar sobre el proceso. Final: entrega del producto aceptado.'},
  {e:'🚨',t:'La actividad del módulo',fq:'En “marque las características propias de Scrum”, ¿cuál era la incorrecta?',d:'Correctas: aporta valor extra · aborda proyectos complejos de modo flexible · entregas parciales y regulares · mejora el trabajo colaborativo.',ex:'Incorrecta: “la rigidez o estructura de trabajo es un requisito imprescindible”. En Scrum el requisito clave es la FLEXIBILIDAD.'}
 ]},
 {type:'order',q:'El ciclo completo de Scrum',items:['🔭 Visión del proyecto','📚 Backlog del producto','🗓️ Reunión de planeación','📝 Backlog y plan de la iteración','☀️ Scrum diario','📦 Producto de la iteración','🔎 Revisión','🔙 Retrospectiva']},
 {type:'order',q:'Las 4 características: ASAS',items:['🦅 Equipos autónomos','🎶 Fases solapadas','📖 Aprendizaje múltiple','🎛️ Seguimiento sin control']},
 {type:'quiz',qs:[
  {q:'El término Scrum proviene de…',r:'histscrum',o:['El rugby','El fútbol americano','El básquet','La ingeniería naval']},
  {q:'Se usó por primera vez en…',r:'histscrum',o:['1986, en la Harvard Business Review','1969, en el PMI','2001, en el Manifiesto Ágil','2018, en el Chaos Report']},
  {q:'¿Cuál NO es una característica de los equipos Scrum?',r:'asas',o:['Jerarquía rígida','Equipos autónomos','Fases solapadas','Aprendizaje múltiple']},
  {q:'“Seguimiento sin control” significa que…',r:'asas',o:['Hay puntos de control que no frenan la creatividad','No hay ninguna estructura','Nadie mira el progreso','El jefe controla todo']},
  {q:'¿Qué NO es propio de Scrum?',r:'scrum',o:['La rigidez como requisito imprescindible','Entregas parciales y regulares','Abordar proyectos complejos con flexibilidad','Mejorar el trabajo colaborativo']},
  {q:'En el scrum diario se responde…',r:'daily',o:['¿Qué hice? ¿Qué haré? ¿Qué obstáculos hay?','¿Cuánto cobro?','¿Quién es el jefe?','¿Cuándo cerramos el proyecto?']}
 ]}
]},
{id:'roles',u:6,e:'👥',t:'Roles de Scrum',ref:'3.4',steps:[
 {type:'cards',items:[
  {e:'👥',t:'El equipo Scrum',fq:'¿Cuáles son los 3 roles del equipo Scrum?',d:'TRES roles: Scrum Master, Product Owner (propietario del producto) y Equipo de desarrollo. Expertos en la materia, propietario del NEGOCIO e interesados son OTROS INTERESADOS.',html:V.roles,tip:'Propietario del PRODUCTO (sí es rol) ≠ propietario del NEGOCIO (no lo es)'},
  {e:'🎯',t:'Product Owner',fq:'¿Qué hace el Product Owner?',d:'MAXIMIZA EL VALOR del producto. Gestiona y PRIORIZA el backlog. Es la voz del cliente: entiende sus necesidades y motivaciones.',ex:'Funciones: comunicar el objetivo del producto · crear y comunicar los elementos del backlog · que el backlog sea transparente, visible y entendible.'},
  {e:'🧑‍🏫',t:'Scrum Master',fq:'¿Qué hace el Scrum Master?',d:'Que la metodología se entienda y se use; REMUEVE OBSTÁCULOS (blockers). Responsable de la efectividad del equipo. Como un entrenador: cuida el timing de las dailys, motiva y crea un entorno colaborativo.',ex:'Entrena en autogestión · enfoca en mejoras de alto valor · asegura que los eventos ocurran y dentro del tiempo.'},
  {e:'👩‍💻',t:'Equipo de desarrollo',fq:'¿Qué caracteriza al equipo de desarrollo?',d:'Profesionales que se AUTOGESTIONAN para construir los incrementos en cada iteración. MULTIFUNCIONALES: cualquiera puede tomar el rol necesario para terminar el trabajo.'},
  {e:'⚽',t:'Como un equipo de fútbol',d:'PO = el dueño que sabe qué quiere la hinchada (el QUÉ). Scrum Master = el DT que cuida el reloj (el PROCESO). Equipo = los que juegan (el CÓMO).',tip:'PO = qué · Equipo = cómo · SM = que el proceso funcione (no es jefe)'}
 ]},
 {type:'sort',rk:['po','sm','dev','otros'],q:'¿De quién es esto?',buckets:['🎯 Product Owner','🧑‍🏫 Scrum Master','👩‍💻 Equipo','🙋 Otros interesados'],items:[
  ['Priorizar el backlog del producto',0],['Maximizar el valor del producto',0],['Ser la voz del cliente',0],['Eliminar impedimentos o blockers',1],['Cuidar el timing de las dailys',1],['Entrenar en autogestión',1],['Construir los incrementos',2],['Ser multifuncionales',2],['Propietario del negocio',3],['Expertos en la materia',3]]},
 {type:'quiz',qs:[
  {q:'¿Cuáles son los 3 roles del equipo Scrum?',r:'roles',o:['PO, Scrum Master y Equipo de desarrollo','PO, propietario del negocio e interesados','Scrum Master, expertos y cliente','Director, PMO y patrocinador']},
  {q:'Quien gestiona y prioriza el backlog del producto es…',r:'po',o:['Product Owner','Scrum Master','Equipo de desarrollo','Propietario del negocio']},
  {q:'Eliminar impedimentos o “blockers” es función de…',r:'sm',o:['Scrum Master','Product Owner','Cliente','Propietario del negocio']},
  {q:'“El Scrum Master es el jefe jerárquico del equipo.”',r:'sm',o:['Falso: los equipos Scrum no tienen jerarquía; el SM facilita','Verdadero','Solo en proyectos grandes','Solo al inicio']},
  {q:'En el equipo de desarrollo, cada miembro…',r:'dev',o:['Es multifuncional: puede tomar el rol necesario','Tiene un rol fijo y único','No programa','Reporta al cliente']},
  {q:'El propietario del negocio es…',r:'otros',o:['Otro interesado, no un rol Scrum','El Product Owner','El Scrum Master','Parte del equipo de desarrollo']}
 ]}
]},
{id:'ceremonias',u:6,e:'🎉',t:'Ceremonias Scrum',ref:'3.5',steps:[
 {type:'cards',items:[
  {e:'🎉',t:'Ceremonia',fq:'¿Qué es una ceremonia Scrum?',d:'Un evento del proceso ágil donde el equipo se reúne a hablar de los próximos pasos, durante el ciclo del sprint. Según el material, “un momento de CELEBRACIÓN”.',html:V.cerem},
  {e:'🧹',t:'Refinamiento del backlog',fq:'¿Cuáles son las 6 actividades del refinamiento del backlog?',d:'PO + equipo, periódico o continuo. Eliminar requisitos sin valor · crear nuevos · reevaluar prioridad · estimar los faltantes · ajustar estimaciones · DIVIDIR los grandes y prioritarios.',tip:'Como ordenar el placard: tirar, agregar, reordenar, etiquetar y separar lo grande'},
  {e:'🗓️',t:'Planeación de la iteración',fq:'¿Cuáles son los pasos de la planeación de la iteración?',d:'PO + SM + equipo, al INICIO. 1) El PO presenta el backlog actualizado. 2) El equipo lo analiza. 3) Pronostica qué puede entregar. 4) Definen el objetivo. 5) El equipo decide cómo lo creará y se organizará.'},
  {e:'☀️',t:'Reunión diaria (daily)',fq:'¿Cómo es la reunión diaria y qué 3 preguntas se responden?',d:'15 MINUTOS, misma hora y lugar, preferiblemente a la mañana. Es para el EQUIPO (se dirigen entre ellos); el SM asegura que se haga. Se INFORMAN problemas, NO se discuten soluciones.',html:V.daily,tip:'“AYER - HOY - PIEDRAS”. Si alguien propone soluciones: “eso lo vemos después”.'},
  {e:'🔎',t:'Revisión vs retrospectiva',fq:'¿Qué diferencia hay entre la revisión y la retrospectiva?',d:'Revisión: el PRODUCTO, al final de la iteración, con PO y SM: ¿está “hecho”? Retrospectiva: el PROCESO, principalmente el equipo, antes de la próxima planeación: “inspección y adaptación”.',html:V.revretro,tip:'REvisión = REsultado · RETROspectiva = mirar para atrás cómo trabajamos'},
  {e:'🔢',t:'El orden',fq:'¿Cuál es el orden de las ceremonias de una iteración?',d:'Planeación → Daily → Revisión → Retrospectiva. El refinamiento es continuo.',tip:'“PlaDa ReRe”'}
 ]},
 {type:'order',q:'El orden de las ceremonias (PlaDa ReRe)',items:['🗓️ Planeación','☀️ Daily','🔎 Revisión','🔙 Retrospectiva']},
 {type:'order',q:'Las 3 preguntas de la daily',items:['⏪ ¿Qué hice desde el último scrum diario?','▶️ ¿Qué planeo hacer hoy?','🪨 ¿Hay algún impedimento?']},
 {type:'sort',rk:['refina','planit','daily','revision','retro'],q:'¿Qué ceremonia es?',buckets:['🧹 Refinamiento','🗓️ Planeación','☀️ Daily','🔎 Revisión','🔙 Retro'],items:[
  ['Dividir requisitos grandes y prioritarios',0],['Eliminar requisitos que no aportan valor',0],['El PO presenta el backlog actualizado',1],['Definir el objetivo de la iteración',1],['15 minutos, misma hora y lugar',2],['Informar problemas sin resolverlos',2],['Mostrar el incremento y decidir si está hecho',3],['Al final de la iteración, con el PO',3],['Inspección y adaptación del proceso',4],['Lecciones aprendidas para la próxima iteración',4]]},
 {type:'quiz',qs:[
  {q:'La reunión diaria dura…',r:'daily',o:['15 minutos','5 minutos','30 minutos','1 hora']},
  {q:'En la reunión diaria…',r:'daily',o:['Se informan problemas pero no se discuten soluciones','Se resuelven los problemas','Se presenta el incremento al cliente','Se prioriza el backlog']},
  {q:'La ceremonia que mira el PRODUCTO al final de la iteración es…',r:'revision',o:['Revisión de la iteración','Retrospectiva','Refinamiento','Daily']},
  {q:'La “inspección y adaptación” del proceso, antes de la próxima planificación, es la…',r:'retro',o:['Retrospectiva','Revisión','Planeación','Daily']},
  {q:'La daily es…',r:'daily',o:['Para el equipo: se dirigen entre ellos','Un reporte al Scrum Master','Un reporte al cliente','Una reunión de una hora']},
  {q:'Según el material, las ceremonias son…',r:'cerem',o:['Un momento de celebración','Reuniones de castigo','Auditorías externas','Optativas']}
 ]}
]},
{id:'artefactos',u:6,e:'📚',t:'Artefactos',ref:'3.5',steps:[
 {type:'cards',items:[
  {e:'🔍',t:'Artefactos',fq:'¿Qué son los artefactos de Scrum?',d:'Todos los elementos de la gestión de la TRANSPARENCIA: evitan los riesgos de mala comunicación y mala gestión de la información. Si no sos transparente, podés tomar malas decisiones.'},
  {e:'📦',t:'Incremento del producto',fq:'¿Qué es el incremento del producto?',d:'La integración de los elementos del Product Backlog incluidos en cada iteración. Sigue CRECIENDO en las iteraciones siguientes.',html:V.increm},
  {e:'📚',t:'Backlog del producto',fq:'¿Qué es el backlog del producto y quién es su responsable?',d:'Lista ORDENADA de todo lo que necesita el producto: ÚNICA FUENTE de requerimientos para cualquier cambio. Responsable: el PRODUCT OWNER (contenido, disponibilidad y orden).',ex:'Figura 8 (“hamburguesa”): soporte, defectos, investigación, desempeño, requerimientos del negocio y técnicos.'},
  {e:'📝',t:'Backlog de la iteración',fq:'¿Qué es el backlog de la iteración y quién lo actualiza?',d:'SUBCONJUNTO del Product Backlog elegido para una iteración + el plan para lograr el objetivo (compromiso). ÚNICAMENTE lo actualiza algún integrante del EQUIPO.',html:V.backlogs},
  {e:'🗺️',t:'Hoja de ruta',d:'Plan de negocios para desarrollar un producto a lo largo del tiempo. La usan los PO para describir funciones futuras y cuándo se lanzarán; da contexto y responde a cambios competitivos.'},
  {e:'📉',t:'Burndown y burnup',fq:'¿Qué diferencia hay entre el burndown y el burnup?',d:'Burndown: el trabajo POR COMPLETAR, baja a 0 (entregar a tiempo; predice iteraciones). Burnup: el trabajo COMPLETADO, sube, y muestra la línea de alcance que puede crecer (“adición de alcance”).',html:V.burn,tip:'DOWN = lo que FALTA (tanque que se vacía) · UP = lo HECHO (escalera hacia el alcance)'},
  {e:'🔴',t:'Leer el burndown',fq:'En un burndown, ¿qué significa que la línea real esté por encima de la ideal?',d:'Ejemplo del material: 28 puntos de función, ideal a 0 en la iteración 14. Real POR ENCIMA de la ideal = RETRASO (rojo). Por debajo = adelanto (verde).',ex:'Burnup del material: alcance 300 → 330 → 350 puntos (adición de alcance) vs. trabajo aceptado que sube mes a mes.'}
 ]},
 {type:'sort',rk:['increm','pbacklog','sbacklog','roadmap','burndown','burnup'],q:'¿Qué artefacto es?',buckets:['📦 Incremento','📚 Backlog producto','📝 Backlog iteración','🗺️ Hoja de ruta','📉 Burndown','📈 Burnup'],items:[
  ['Chasis → pickup → furgón',0],['Sigue creciendo en cada iteración',0],['Única fuente de requerimientos',1],['Su responsable es el Product Owner',1],['Solo lo actualiza el equipo',2],['Subconjunto elegido + plan (compromiso)',2],['Plan de negocios del producto en el tiempo',3],['Muestra lo que falta: baja a 0',4],['Muestra lo completado y la línea de alcance',5]]},
 {type:'quiz',qs:[
  {q:'El backlog de la iteración puede ser actualizado únicamente por…',r:'sbacklog',o:['Integrantes del equipo','El Product Owner','El cliente','El propietario del negocio']},
  {q:'La única fuente de requerimientos para cualquier cambio es…',r:'pbacklog',o:['El backlog del producto','La hoja de ruta','El burnup','El incremento']},
  {q:'El gráfico que muestra el trabajo POR COMPLETAR es el…',r:'burndown',o:['Burndown','Burnup','Kanban','Roadmap']},
  {q:'Si en un burndown la línea real está por encima de la ideal, el proyecto va…',r:'burndown',o:['Retrasado','Adelantado','Terminado','Sin cambios']},
  {q:'El burnup muestra…',r:'burnup',o:['El trabajo completado y la línea de alcance','Solo lo que falta','Los costos','Los roles']},
  {q:'Los artefactos sirven para…',r:'artef',o:['Garantizar transparencia y evitar la mala comunicación','Reemplazar al Scrum Master','Controlar los sueldos','Eliminar las ceremonias']}
 ]}
]},
{id:'mvpkanban',u:6,e:'🚣',t:'MVP, Kanban y proceso ágil',ref:'3.5',steps:[
 {type:'cards',items:[
  {e:'🚣',t:'Producto mínimo viable (MVP)',fq:'¿Qué es el MVP?',d:'Producto con las características MÍNIMAS para cumplir los requisitos de los PRIMEROS USUARIOS y recopilar COMENTARIOS para futuras modificaciones, hasta un producto viable.',html:V.mvp,tip:'MVP = mínimo + VIABLE: balsa (nadie la usa) → bote (MVP) → barco'},
  {e:'🗂️',t:'Kanban',fq:'¿Qué es Kanban y qué representan sus tarjetas y columnas?',d:'Muestra en forma gráfica el trabajo en varias etapas de un proceso. TARJETAS = elementos de trabajo; COLUMNAS = etapas. Se mueven de IZQUIERDA a DERECHA.',html:V.kanban,ex:'Puede tener carriles horizontales por tipo de trabajo. En Scrum se usa como visor del estado del backlog.'},
  {e:'🧭',t:'El proceso ágil completo',fq:'¿Cuáles son las etapas del proceso ágil general (Figura 15)?',d:'Factibilidad (costo-beneficio, TIR, VPN, caso de negocio, visión) → Iniciación (acta, backlog, hoja de ruta) → Planificación (historias, planning poker, plan de liberación) → Iteración X y spikes → Iteraciones 1…n y pre-lanzamiento → Cierre.'}
 ]},
 {type:'order',q:'El tablero Kanban del ejemplo (Figura 14)',items:['📥 Orden recibida','💳 Pagada','📦 Empacada','🚚 Despachada','✅ Entregada']},
 {type:'order',q:'El proceso ágil general',items:['📊 Factibilidad','🚀 Iniciación','📋 Planificación','🧪 Iteración X y spikes','🔁 Iteraciones 1…n y pre-lanzamiento','🏁 Cierre']},
 {type:'sort',rk:['mvp','mvp','mvp'],q:'¿Mínimo, MVP o viable?',buckets:['🪵 Mínimo','🚣 MVP','🚢 Viable'],items:[['Nadie quiere usarlo',0],['La balsa',0],['Atrae a los primeros usuarios',1],['Genera feedback para mejorar',1],['El bote',1],['Cumple todas las expectativas',2],['El barco',2]]},
 {type:'quiz',qs:[
  {q:'El MVP es un producto que…',r:'mvp',o:['Tiene lo mínimo para atraer primeros usuarios y obtener feedback','Nadie quiere usar','Cumple todas las expectativas','No se entrega al cliente']},
  {q:'En un tablero Kanban, las columnas representan…',r:'kanban',o:['Las etapas del proceso','Los elementos de trabajo','Los integrantes','Los costos']},
  {q:'En Kanban las tarjetas se mueven…',r:'kanban',o:['De izquierda a derecha','De arriba hacia abajo','Al azar','De derecha a izquierda']},
  {q:'En Scrum, Kanban se usa como…',r:'kanban',o:['Visor del estado del backlog','Reemplazo de la daily','Contrato con el cliente','Certificación']},
  {q:'TIR, VPN y caso de negocio aparecen en la etapa de…',r:'procagil',o:['Factibilidad','Cierre','Iteración X','Pre-lanzamiento']}
 ]}
]},

{id:'pmi',u:7,e:'🏛️',t:'¿Qué es el PMI?',ref:'Intro – 4.1',steps:[
 {type:'cards',items:[
  {e:'🗺️',t:'El hilo del módulo',nf:1,d:'¿Quién define las reglas? (PMI) → ¿Cómo vive un proyecto? (ciclo de vida y fases) → ¿Quién lo rodea? (interesados) → ¿Dónde vive? (cultura y estructura de la organización).'},
  {e:'🏛️',t:'PMI y PMBOK',fq:'¿Qué es el PMI y qué es el PMBOK?',d:'PMI (Project Management Institute): organización profesional SIN ÁNIMO DE LUCRO para gestores de proyectos y programas. PMBOK (Project Management Body of Knowledge): el cuerpo de conocimientos; su guía es responsabilidad del PMI.',tip:'PMI = la organización · PMBOK = la guía'},
  {e:'⚙️',t:'Un proceso PMI',fq:'¿Qué es un proceso según el PMI?',d:'Tareas o actividades que, a partir de ENTRADAS, producen SALIDAS mediante HERRAMIENTAS Y TÉCNICAS. Se agrupan en áreas de conocimiento y grupos de procesos.',html:V.proceso,tip:'Un proceso es una máquina: entradas → herramientas y técnicas → salidas'},
  {e:'📅',t:'Historia del PMI',fq:'¿Cuál es la historia del PMI?',d:'1969: se funda con socios voluntarios. Años ’70: foco en ingeniería. Años ’80: los negocios se organizan por proyectos; 3 áreas de atención. Hoy: +160 países y 240.000 socios.',html:V.hist,tip:'“69 nace, 70 ingeniería, 80 negocios”'},
  {e:'🧭',t:'Las 3 áreas de los ’80',fq:'¿Cuáles fueron las 3 áreas de atención de los años 80?',d:'ÉTICA (rasgos distintivos del profesional) · NORMAS (contenido y estructura de los fundamentos) · ACREDITACIÓN (reconocimiento de logros).',tip:'“ENA” = Ética · Normas · Acreditación'},
  {e:'🎯',t:'Las 3 actividades',fq:'¿Cuáles son las 3 actividades principales del PMI?',d:'1) Abogar por la profesión (estándares, investigación, acceso a información). 2) Promover su desarrollo (networking, colaboración, voluntariado). 3) Ofrecer certificaciones con respaldo mundial.'},
  {e:'🔭',t:'Visión y misión',fq:'¿Cuál es la visión y cuál la misión del PMI?',d:'Visión: reconocimiento mundial por el desarrollo de la excelencia profesional en dirección de proyectos. Misión: servir a su comunidad desarrollando el arte de dirigir como disciplina profesional.',html:V.visimis,tip:'Visión = lo que quiero que me VEAN · Misión = lo que hago HOY'},
  {e:'🏁',t:'Los 6 objetivos',fq:'¿Cuáles son los 6 objetivos del PMI?',d:'Promover la dirección de proyectos · compartir la experiencia internacional · desarrollar calidad en los RR. HH. · compartir los conocimientos aceptados · consolidar estándares internacionales · certificar profesionales.'}
 ]},
 {type:'order',q:'La historia del PMI',items:['🌱 1969: fundación con voluntarios','🔧 Años ’70: ingeniería','💼 Años ’80: negocios (Ética, Normas, Acreditación)','🌍 Hoy: +160 países y 240.000 socios']},
 {type:'sort',rk:['vision','mision'],q:'¿Visión o misión del PMI?',buckets:['🔭 Visión','🛠️ Misión'],items:[['Reconocimiento mundial',0],['Excelencia profesional en dirección de proyectos',0],['Lo que quiero que me vean',0],['Servir a su comunidad de asociados',1],['Desarrollar el arte de dirigir',1],['Llevar a la práctica la dirección como disciplina',1]]},
 {type:'quiz',qs:[
  {q:'El PMI es…',r:'pmi',o:['Una organización profesional sin ánimo de lucro','Una guía de buenas prácticas','Un software de gestión','Una certificación']},
  {q:'Un proceso según el PMI transforma…',r:'proceso',o:['Entradas en salidas mediante herramientas y técnicas','Riesgos en oportunidades','Tareas en actividades','Backlogs en incrementos']},
  {q:'El PMI se fundó en…',r:'histpmi',o:['1969','1959','1979','1986']},
  {q:'Las 3 áreas de atención de los años 80 fueron…',r:'ena',o:['Ética, normas y acreditación','Tiempo, costo y alcance','Inicio, ejecución y cierre','Riesgo, calidad y compras']},
  {q:'“Reconocimiento mundial por el desarrollo de la excelencia profesional” es la ___ del PMI',r:'vision',o:['Visión','Misión','Objetivo','Actividad']},
  {q:'¿Cuántos socios tiene hoy el PMI según el material?',r:'histpmi',o:['240.000','160.000','24.000','1 millón']},
  {q:'“El PMBOK es una organización y el PMI una guía.”',r:'pmi',o:['Falso: es al revés','Verdadero','Los dos son guías','Los dos son organizaciones']}
 ]}
]},
{id:'certif',u:7,e:'🏅',t:'Las certificaciones',ref:'4.1',steps:[
 {type:'cards',items:[
  {e:'🏅',t:'Certificarse',d:'El administrador debe procurar certificar sus actividades. El PMI ofrece niveles según preparación académica y experiencia. También hay certificaciones del proyecto en sí (calidad, procesos, productos).'},
  {e:'📜',t:'¿Qué significa estar certificado?',fq:'¿Qué 4 cosas significa obtener una certificación del PMI?',d:'1) Demostró educación y experiencia. 2) Aprobó un examen riguroso. 3) Aceptó un código de conducta profesional. 4) Se comprometió a mantener activa la credencial.',tip:'“Estudié, Rendí, Juré, Mantengo”'},
  {e:'🤝',t:'¿Para quién?',d:'Las certificaciones están disponibles para MIEMBROS y NO MIEMBROS del PMI.'},
  {e:'5️⃣',t:'Las 5 certificaciones',fq:'¿Cuáles son las 5 certificaciones principales del PMI y qué reconoce cada una?',d:'PMI-RMP (riesgos) · PMI-SP (cronograma) · PgMP (programas) · PMP (proyectos) · CAPM (asociado, nivel inicial).',html:V.certs,tip:'RMP = Riesgos · SP = Schedule · PgMP = la “g” de proGrama · PMP = el clásico · CAPM = el junior'},
  {e:'🪜',t:'Escalera de nivel',d:'CAPM (entrada) → PMP (proyecto) → PgMP (programa). RMP y SP son ESPECIALIDADES (riesgos y cronograma).',ex:'Ojo: en la Figura 2 la definición del SP aparece copiada de la del RMP (error del material). El SP es la especialidad de programación/cronograma.'},
  {e:'📖',t:'Recomendaciones para el examen',fq:'¿Qué recomienda el material para preparar el examen?',d:'Para todas: el Handbook, la Examination Specification, el PMBOK 3ª ed. y cursos formales. PMP y PgMP: preguntas tipo examen PMP. SP: estándar de programación. CAPM: Project Management Methods and Mechanics (autoestudio web).'}
 ]},
 {type:'match',q:'Uní cada certificación con su especialidad',pairs:[['PMI-RMP','Riesgos'],['PMI-SP','Cronograma (programación)'],['PgMP','Programas: proyectos relacionados'],['CAPM','Nivel inicial: terminología del PMBOK']]},
 {type:'sort',rk:['rmp','sp','pgmp','pmp','capm'],q:'¿Qué certificación es?',buckets:['⚠️ RMP','📅 SP','🧩 PgMP','📁 PMP','🌱 CAPM'],items:[

{id:'requisitos',u:7,e:'🔢',t:'Requisitos y 16 aspectos',ref:'4.1',steps:[
 {type:'cards',items:[
  {e:'🔢',t:'La tabla maestra',fq:'¿Qué horas, examen y ventana de experiencia pide cada certificación?',d:'Datos de Torres Hernández (2014). Hoy el PMI cambió varios requisitos, pero para el examen respondé con los números del material.',html:V.reqs},
  {e:'📁',t:'PMP',fq:'¿Qué pide el PMP?',d:'35 horas de contacto · 200 preguntas en 4 h · últimos 8 años. Licenciatura: 3 años con 4.500 h liderando. Secundario: 5 años con 7.500 h.',tip:'PMP = “35 - 200 - 4”'},
  {e:'🌱',t:'CAPM',fq:'¿Qué pide el CAPM?',d:'Secundario (preparatoria). 1.500 h en un equipo de proyectos O 23 h de educación formal · 150 preguntas en 3 h.',tip:'CAPM = “23 - 150 - 3” (el junior: todo más chico)'},
  {e:'👯',t:'RMP y SP, gemelos',fq:'¿Qué piden el RMP y el SP?',d:'30 horas · 170 preguntas en 3,5 h · últimos 5 años. RMP: 3.000 h / 4.500 h. SP pide un poco más: 3.500 h / 5.000 h (licenciatura / secundario).'},
  {e:'🧩',t:'PgMP, el distinto',fq:'¿Qué tiene de distinto el PgMP?',d:'El ÚNICO sin horas de contacto, el único con MRA (evaluadores múltiples) y el de ventana más larga (15 años) · 170 preguntas en 4 h.',tip:'Ventanas: 5 - 8 - 15 (especialidades - PMP - PgMP)'},
  {e:'🎓',t:'Los 16 aspectos del proceso',fq:'¿Qué ganchos técnicos tienen los 16 aspectos de la certificación?',d:'No hace falta memorizarlos en orden; quedate con los ganchos: JAD (requisitos) · RAD, espiral, RUP (ciclos) · Delphi y UCP (estimación) · ruta crítica (secuencia) · probabilidad × impacto (riesgos) · EVM (seguimiento) · prevenir > detectar (calidad).'},
  {e:'♻️',t:'Algunos aspectos más',d:'El alcance es factor fundamental de éxito o fracaso · cada tarea produce un entregable · procuración: instalaciones, equipos, repuestos, viajes · rara vez se extraen lecciones: empaquetar reutilizables abarata proyectos futuros.'}
 ]},
 {type:'match',q:'Uní cada certificación con su examen',pairs:[['PMP','200 preguntas · 4 h'],['CAPM','150 preguntas · 3 h'],['PMI-RMP','170 preguntas · 3,5 h'],['PgMP','170 preguntas · 4 h + MRA']]},
 {type:'match',q:'Uní cada aspecto con su gancho técnico',pairs:[['Formalizar requisitos','Sesiones JAD'],['Estimación','Wideband Delphi y UCP'],['Secuencia de tareas','Ruta crítica'],['Seguimiento','EVM (valor devengado)']]},
 {type:'quiz',qs:[

  {q:'La única certificación que no exige horas de contacto formal es…',r:'pgmp',o:['PgMP','CAPM','PMP','PMI-RMP']},
  {q:'Para el CAPM se requieren…',r:'capm',o:['1.500 h en equipo de proyectos o 23 h de educación formal','3 años de experiencia','35 h de contacto','Título universitario obligatorio']},
  {q:'¿Cuántas horas de contacto pide el PMP?',r:'pmp',o:['35','30','23','Ninguna']},
  {q:'La ventana de experiencia del PgMP es de…',r:'pgmp',o:['15 años','5 años','8 años','3 años']},
  {q:'En calidad, el material dice que hay que…',r:'aspectos',o:['Prevenir defectos en lugar de medirlos','Medir defectos al final','Ignorar los defectos','Tercerizar la calidad']},
  {q:'El concepto de ruta crítica aparece en…',r:'aspectos',o:['La secuencia de tareas','La presupuestación','El manejo de cambios','La credencialización']}
 ]}
]},
{id:'ciclo',u:8,e:'🔄',t:'Ciclo de vida',ref:'4.2',steps:[
 {type:'cards',items:[
  {e:'🔄',t:'Ciclo de vida del proyecto',fq:'¿Qué es el ciclo de vida del proyecto?',d:'Conjunto de FASES, generalmente SECUENCIALES y en ocasiones SUPERPUESTAS, cuyo nombre y número dependen de las necesidades de gestión y control, la naturaleza del proyecto y su área de aplicación.',ex:'Todo proyecto tiene inicio y fin definidos; lo que varía son los entregables y actividades intermedias. Es el marco de referencia básico.'},
  {e:'🧱',t:'Estructura genérica',fq:'¿Cuál es la estructura genérica del ciclo de vida?',d:'Inicio → Organización y preparación → Ejecución del trabajo → Cierre. Sirve para hablar con la alta dirección y comparar proyectos distintos.',html:V.ioec,tip:'“Inicio, Organizo, Ejecuto, Cierro” (IOEC). No confundir con los 5 grupos de procesos (IPEMC).'},
  {e:'📈',t:'Las 3 curvas',fq:'¿Cómo se comportan el costo, la influencia y el costo de los cambios a lo largo del proyecto?',d:'Lo que siempre preguntan:',html:V.curvas},
  {e:'⛰️',t:'Costo y personal',d:'Bajos al inicio, MÁXIMOS durante la EJECUCIÓN y caen rápido al acercarse el cierre (curva tipo campana).',tip:'Una montaña: sube, hace cima en la ejecución y baja'},
  {e:'🏠',t:'Influencia vs costo del cambio',d:'Influencia de los interesados, riesgo e incertidumbre: MAYORES AL INICIO y bajan. El costo de los cambios y de corregir errores: SUBE hacia el final.',tip:'Una casa: cambiar el plano es gratis; cambiar una pared construida, carísimo. Dos líneas que se cruzan como una X.'},
  {e:'🚨',t:'La actividad del módulo',fq:'¿Qué sucede con la influencia de los interesados, los riesgos y la incertidumbre?',d:'Son MAYORES AL INICIO del proyecto.',ex:'Distractores: “fluctúan levemente”, “suben al cierre”, “se mantienen álgidos en la ejecución”, “son menores al inicio”.'}
 ]},
 {type:'order',q:'La estructura genérica del ciclo de vida',items:['🚀 Inicio','🧰 Organización y preparación','⚙️ Ejecución del trabajo','🏁 Cierre']},
 {type:'sort',rk:['curvas','curvas','curvas'],q:'¿Cuándo es máximo?',buckets:['🚀 Al inicio','⚙️ En la ejecución','🏁 Hacia el final'],items:[['Influencia de los interesados',0],['Riesgo',0],['Incertidumbre',0],['Capacidad de influir sin afectar el costo',0],['Costo del proyecto',1],['Dotación de personal',1],['Costo de los cambios',2],['Costo de corregir errores',2]]},
 {type:'quiz',qs:[
  {q:'El ciclo de vida es un conjunto de fases…',r:'ciclo',o:['Generalmente secuenciales y en ocasiones superpuestas','Siempre simultáneas','Siempre iterativas','Definidas solo por el PMI']},
  {q:'La influencia de los interesados, el riesgo y la incertidumbre son…',r:'curvas',o:['Mayores al inicio','Mayores al cierre','Constantes','Mayores en la ejecución']},
  {q:'El costo de los cambios y de corregir errores…',r:'curvas',o:['Aumenta a medida que el proyecto se acerca al final','Es máximo al inicio','Es constante','Desaparece en la ejecución']},
  {q:'Los niveles de costo y personal alcanzan su máximo…',r:'curvas',o:['Durante la ejecución del trabajo','Al inicio','En el cierre','Antes del inicio']},
  {q:'“Inicio, organización y preparación, ejecución, cierre” es…',r:'ioec',o:['La estructura genérica del ciclo de vida','Los 5 grupos de procesos','Las ceremonias Scrum','Los procesos PEAC']},
  {q:'¿Qué varía entre proyectos según el material?',r:'ciclo',o:['Los entregables y las actividades intermedias','Que tengan inicio y fin','Que tengan objetivos','Nada']}
 ]}
]},
{id:'fases',u:8,e:'🚪',t:'Fases y relaciones',ref:'4.3',steps:[
 {type:'cards',items:[
  {e:'🚪',t:'Fases',fq:'¿Qué son las fases de un proyecto?',d:'Divisiones del proyecto donde se ejerce un CONTROL ADICIONAL para gestionar la conclusión de un ENTREGABLE MAYOR. Suelen ser secuenciales, pero pueden superponerse. Son un elemento del ciclo de vida.',ex:'Cuántas fases y cuánto control dependen del tamaño, la complejidad y el impacto potencial.'},
  {e:'📌',t:'Características comunes',fq:'¿Qué características comparten todas las fases?',d:'1) Al cerrar hay una TRANSFERENCIA del entregable: punto para re-evaluar, cambiar o terminar. 2) Enfoque ÚNICO, distinto de las otras fases. 3) Un grado ADICIONAL de control.'},
  {e:'🚦',t:'Las puertas',fq:'¿Qué nombres recibe el final de una fase?',d:'Salidas de fase, hitos, puertas de fase, puntos de decisión, puertas de etapa o puntos de cancelación.',html:V.puertas,tip:'Todos son “puertas”: ¿sigo, cambio o mato el proyecto?'},
  {e:'1️⃣',t:'¿Cuántas fases?',d:'Algunos proyectos tienen UNA SOLA fase; otros muchas. Suelen durar distinto. No hay una única estructura ideal, ni siquiera en la misma industria.'},
  {e:'🏛️',t:'Gobernabilidad',fq:'¿Qué es la gobernabilidad del proyecto?',d:'Un método integral y coherente de CONTROLAR el proyecto y asegurar el éxito. Se describe en el plan para la dirección. El director y su equipo eligen quiénes participan, recursos, enfoque y cuántas fases.'},
  {e:'🔗',t:'Las 3 relaciones entre fases',fq:'¿Cuáles son las 3 relaciones entre fases con su ventaja y desventaja?',d:'Secuencial (empieza al terminar la anterior) · Superposición (empieza antes: fast tracking) · Iterativa (se planifica una fase a la vez).',html:V.relf,tip:'Secuencial = seguro pero lento · Superpuesta = rápida pero riesgosa · Iterativa = flexible pero miope'},
  {e:'🔁',t:'Conexión con lo ágil',d:'La relación ITERATIVA es la lógica de las metodologías ágiles (Módulo 3). En un mismo proyecto pueden convivir las tres relaciones.'},
  {e:'🏭',t:'Proyectos vs operaciones',fq:'¿Qué comparten proyectos y operaciones y en qué se diferencian?',d:'Comparten: los hacen individuos, tienen restricciones, se planifican y controlan, buscan los objetivos de la organización. Diferencia: el proyecto es TEMPORAL y ÚNICO; las operaciones, CONTINUAS y REPETITIVAS.',ex:'Hay proyectos que modifican operaciones: nuevo producto, instalación con apoyo continuo, cambios internos, mejorar un sistema de información.'}
 ]},
 {type:'sort',rk:['secuencial','superpos','iterativa'],q:'¿Qué relación entre fases es?',buckets:['➡️ Secuencial','⏩ Superposición','🔁 Iterativa'],items:[
  ['Empieza solo cuando termina la anterior',0],['Reduce la incertidumbre',0],['Puede eliminar opciones de acortar el cronograma',0],['Ejecución rápida (fast tracking)',1],['Aumenta el riesgo y el reproceso',1],['Empieza antes de que termine la anterior',1],['Se planifica una fase a la vez',2],['Útil en ambientes inciertos (investigación)',2],['Reduce la planificación a largo plazo',2]]},
 {type:'quiz',qs:[
  {q:'¿Cuál NO es un nombre del punto final de una fase?',r:'puertas',o:['Backlog de iteración','Hito','Puerta de etapa','Punto de cancelación']},
  {q:'La relación donde una fase empieza antes de que termine la anterior es…',r:'superpos',o:['Superposición','Secuencial','Iterativa','Funcional']},
  {q:'La relación útil en ambientes inciertos, que planifica una fase a la vez, es…',r:'iterativa',o:['Iterativa','Secuencial','Superposición','Matricial']},
  {q:'“La ejecución rápida es un ejemplo de relación iterativa.”',r:'superpos',o:['Falso: es de superposición','Verdadero','Es secuencial','No existe']},
  {q:'“Todo proyecto debe tener al menos tres fases.”',r:'fases',o:['Falso: puede tener una sola','Verdadero','Debe tener cinco','Debe tener dos']},
  {q:'Proyectos y operaciones…',r:'proyop',o:['Comparten 4 características; el proyecto es temporal y único','No comparten nada','Son lo mismo','Son siempre repetitivos']}
 ]}
]},
{id:'interesados',u:8,e:'🙋',t:'Interesados',ref:'4.4',steps:[
 {type:'cards',items:[
  {e:'🙋',t:'Interesados (stakeholders)',fq:'¿Qué son los interesados?',d:'Personas u organizaciones que PARTICIPAN en el proyecto, o cuyos intereses se ven AFECTADOS (+ o −) por él, o que INFLUYEN sobre el proyecto, los entregables y el equipo.',tip:'Interesado = todo el que participa, se ve afectado (+ o −) o influye'},
  {e:'🔍',t:'Identificarlos',d:'Internos y externos, para saber requisitos y expectativas. Es un proceso CONTINUO y puede ser difícil: un operario cuyo empleo depende del proyecto también es interesado.',ex:'No identificarlos puede prolongar la duración y elevar mucho los costos.'},
  {e:'📶',t:'Niveles de autoridad',d:'Tienen distintos niveles de responsabilidad y autoridad que pueden CAMBIAR durante el ciclo de vida: desde responder encuestas hasta el patrocinio total (apoyo financiero y político). Pueden tener impacto adverso.'},
  {e:'🧑‍✈️',t:'Responsabilidad del director',fq:'¿Cuál es una responsabilidad clave del director respecto de los interesados?',d:'GESTIONAR LAS EXPECTATIVAS de los interesados, a menudo diferentes o contradictorias.'},
  {e:'👥',t:'Ejemplos de interesados',fq:'¿Qué hace cada tipo de interesado?',d:'Clientes, patrocinador, directores de portafolio y programa, PMO, directores del proyecto y otros (equipo, gerentes funcionales y de operaciones, vendedores y socios).',html:V.intere,tip:'Patrocinador = pone la PLATA · Cliente = USA el resultado'}
 ]},
 {type:'sort',rk:['cliente','patroc','dirport','dirprog','pmo4'],q:'¿Qué interesado es?',buckets:['🙋 Cliente / usuario','💰 Patrocinador','💼 Dir. portafolio','🧩 Dir. programa','🏛️ PMO'],items:[
  ['Usará el producto, servicio o resultado',0],['Puede ser interno o externo y usa el resultado',0],['Proporciona los recursos financieros',1],['Defiende el proyecto cuando se concibe',1],['Revisa proyectos por ROI, valor y riesgos',2],['Gobernabilidad de alto nivel',2],['Coordina proyectos relacionados para un beneficio extra',3],['Dirección centralizada de los proyectos bajo su jurisdicción',4]]},
 {type:'quiz',qs:[
  {q:'Quien proporciona los recursos financieros, en efectivo o en especie, es…',r:'patroc',o:['El patrocinador','El cliente','La PMO','El gerente funcional']},
  {q:'“Un interesado es solo quien se beneficia del proyecto.”',r:'interesados',o:['Falso: también quien se ve afectado negativamente','Verdadero','Solo si paga','Solo si es cliente']},
  {q:'Los interesados se identifican…',r:'interesados',o:['En un proceso continuo','Una única vez al inicio','Al cierre','Nunca']},
  {q:'No identificar a los interesados puede…',r:'interesados',o:['Prolongar la duración y elevar los costos','Acortar el proyecto','Bajar los costos','No tener efecto']},
  {q:'Una responsabilidad clave del director es…',r:'expect',o:['Gestionar las expectativas de los interesados','Elegir a los interesados que le gustan','Evitar a los interesados','Pagar a los interesados']},
  {q:'“El patrocinador es quien usa el producto final.”',r:'patroc',o:['Falso: ese es el cliente; el patrocinador financia','Verdadero','Solo en el gobierno','Solo en Scrum']}
 ]}
]},
{id:'orgz',u:8,e:'🏢',t:'Cultura y estructura',ref:'4.5',steps:[
 {type:'cards',items:[
  {e:'🏢',t:'Influencias de la organización',d:'La cultura, el estilo, la estructura, la madurez en dirección de proyectos y los sistemas de la organización influyen en cómo se ejecutan los proyectos. Con entidades externas (uniones temporales, convenios), influye más de una empresa.'},
  {e:'🎭',t:'Culturas y estilos',fq:'¿En qué se manifiestan las normas culturales de una organización?',d:'Conocimiento común sobre cómo hacer el trabajo, qué medios son aceptables y quién influye. Se manifiestan en: visiones, valores, normas y creencias · políticas y procedimientos · percepción de la autoridad · ética laboral y horario.'},
  {e:'🎩',t:'¿Quién decide de verdad?',d:'La cultura es un FACTOR AMBIENTAL de la empresa. La persona que encabeza el organigrama puede ser solo una FIGURA DECORATIVA: el director debe saber quién decide realmente y trabajar con esa persona.'},
  {e:'🏗️',t:'Estructura de la organización',fq:'¿Cómo cambia el poder del director según la estructura de la organización?',d:'También es un factor ambiental: afecta la disponibilidad de recursos y el modo de dirigir. Va de FUNCIONAL a ORIENTADA A PROYECTOS, con las MATRICIALES en el medio.',html:V.estr,tip:'De izquierda a derecha el director gana poder. Presupuesto “2 - 1 - 2”: 2 del gerente funcional, 1 mixta, 2 del director.'},
  {e:'⏱️',t:'Dedicación',fq:'¿Dónde es parcial la dedicación del director y del personal administrativo?',d:'Dedicación del director: PARCIAL solo en funcional y matricial débil. Personal administrativo: parcial en las 3 primeras (funcional, débil, equilibrada).',tip:'La equilibrada es la “rara”: director a tiempo completo, pero su personal administrativo parcial'},
  {e:'🏛️',t:'Organización funcional clásica',fq:'¿Qué es la organización funcional clásica?',d:'Jerarquía donde cada empleado tiene un SUPERIOR claramente definido. Personal agrupado por ESPECIALIDADES (producción, comercialización, ingeniería, contabilidad). Cada departamento hace su parte del proyecto de forma independiente.'}
 ]},
 {type:'order',q:'De menos a más poder del director',items:['🏛️ Funcional','🔹 Matricial débil','⚖️ Matricial equilibrada','🔷 Matricial fuerte','📁 Orientada a proyectos']},
 {type:'sort',rk:['estr','estr','estr'],q:'¿Quién controla el presupuesto?',buckets:['🏭 Gerente funcional','🔀 Mixto','📁 Director del proyecto'],items:[['Funcional',0],['Matricial débil',0],['Matricial equilibrada',1],['Matricial fuerte',2],['Orientada a proyectos',2]]},
 {type:'quiz',qs:[
  {q:'En una matricial equilibrada, el presupuesto lo controla…',r:'estr',o:['Es mixto','El gerente funcional','El director del proyecto','La PMO']},
  {q:'En una matricial débil, el presupuesto lo controla…',r:'estr',o:['El gerente funcional','El director del proyecto','Es mixto','El cliente']},
  {q:'En la estructura funcional, la autoridad del director es…',r:'estr',o:['Poca o ninguna','Alta a casi total','Moderada a alta','Total']},
  {q:'¿Dónde tiene el director autoridad alta a casi total?',r:'estr',o:['En la orientada a proyectos','En la funcional','En la matricial débil','En la equilibrada']},
  {q:'La cultura y la estructura de la organización son…',r:'cultura',o:['Factores ambientales de la empresa','Grupos de procesos','Certificaciones','Artefactos']},
  {q:'Si quien encabeza el organigrama es una figura decorativa, el director debe…',r:'cultura',o:['Saber quién decide realmente y trabajar con esa persona','Ignorar a todos','Renunciar','Hablar solo con el cliente']}
 ]}
]},
{id:'repaso4',u:'r4',e:'🏁',t:'Repaso final y cierre de la materia',ref:'Repaso',steps:[
 {type:'cards',items:[
  {e:'🎯',t:'Objetivo del módulo',fq:'¿Cuál es el objetivo del Módulo 4?',d:'“Analizar el PMI (Instituto de Gestión de Proyectos).”'},
  {e:'📚',t:'Conclusiones del curso',fq:'¿Qué ideas resumen los 4 módulos?',d:'M1: qué es un proyecto y sus partes (portafolio, programas, actividades y tareas); todo proyecto necesita un administrador. M2: el administrador coordina los procesos de adquisición. M3: las ágiles actúan sobre el software; Scrum da más entregas en menos tiempo y más interacción con el interesado. M4: el PMI, sus objetivos y certificaciones.',ex:'La importancia de certificarse: buscar la mejora continua y la calidad.'},
  {e:'📖',t:'Fuentes',nf:1,d:'PMI (2008), Guía del PMBOK 4ª ed., cap. 2 · Torres Hernández (2014), cap. 4.',tip:'Torres Hernández (2014) aparece en toda la materia: escalera (M1), adquisiciones (cap. 15) y certificaciones (cap. 4).'},
  {e:'🧠',t:'Todas las frases-truco',nf:1,d:'69 nace, 70 ingeniería, 80 negocios · ENA · Estudié, Rendí, Juré, Mantengo · 35-200-4 · 23-150-3 · 5-8-15 · IOEC · la montaña y la X · las puertas · seguro/rápida/miope · patrocinador = plata · 2-1-2.'}
 ]},
 {type:'match',q:'Uní cada frase-truco con lo que recuerda',pairs:[['ENA','Ética, normas, acreditación'],['35 - 200 - 4','PMP'],['23 - 150 - 3','CAPM'],['2 - 1 - 2','Quién controla el presupuesto']]},
 {type:'match',q:'Uní cada módulo con su conclusión',pairs:[['Módulo 1','Proyecto y sus partes; necesita administrador'],['Módulo 2','Coordinar los procesos de adquisición'],['Módulo 3','Scrum: más entregas en menos tiempo'],['Módulo 4','El PMI y la importancia de certificarse']]},
 {type:'quiz',qs:[
  {q:'¿Qué afirmación es FALSA?',r:'pmp',o:['El examen PMP tiene 170 preguntas','El CAPM tiene 150 preguntas','El PgMP no exige horas de contacto','El RMP pide 30 horas']},

 {m:4,k:'objm4',w:['analizar el pmi'],t:'Objetivo M4',d:'“Analizar el PMI (Instituto de Gestión de Proyectos).”'}
];
const GK=Object.fromEntries(GLOSS.map(g=>[g.k,g]));
const norm=s=>String(s).replace(/<[^>]+>/g,' ').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[“”"’]/g,'');
const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
/* Busca el concepto: pesa más lo que aparece en la respuesta correcta que en la pregunta */
function recall(ans,q,key,pm){
  if(key&&GK[key])return [GK[key]];
  const A=' '+norm(ans)+' ',Q=' '+norm(q||'')+' ';
  /* pm = módulo preferido: los conceptos del otro módulo pesan menos */
  const sc=GLOSS.map(g=>{let s=0;g.w.forEach(w=>{const re=new RegExp('(^|[^a-z0-9])'+esc(w)+'($|[^a-z0-9])');if(re.test(A))s=Math.max(s,w.length*3+20);else if(re.test(Q))s=Math.max(s,w.length)});if(pm&&(g.m||1)!==pm)s*=.4;return{g,s:g.g?s*.3:s}}).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
  if(!sc.length)return [];
  return sc.slice(0,2).filter((x,i)=>i===0||x.s>=sc[0].s*.6).map(x=>x.g);
}

function good(){run&&run.ok++;combo++;beep(true);addXP(5)}
function bad(){run&&run.err++;combo=0;beep(false)}

function renderStep(){
  const m=run.m,st=m.steps[run.i];

function feedback(ok,msg,onNext,label,rec){

}

function memo(){
  stop();

  let open=[],found=0,moves=0,lock=false;
  app.innerHTML=`<div class="topbar"><button class="ghost" onclick="home()">✕</button><b style="flex:1">🧩 Memotest</b><span class="mut" id="mv">0 jugadas</span></div>
   <p class="mut" style="margin-top:0">Encontrá cada concepto (amarillo) con su definición.</p>
   <div class="memo">${tiles.map((x,k)=>`<button class="tile ${x.c?'c':''}" data-k="${k}">❔</button>`).join('')}</div>`;
  document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{
    if(lock||b.classList.contains('open')||b.classList.contains('done'))return;
    const x=tiles[+b.dataset.k];b.classList.add('open');b.textContent=x.t;open.push([b,x]);
    if(open.length===2){

      if(x1.i===x2.i&&x1.c!==x2.c){[b1,b2].forEach(z=>{z.classList.remove('open');z.classList.add('done')});open=[];found++;beep(true);
        if(found===pairs.length){addXP(25);confetti();setTimeout(()=>feedback(true,`Terminaste en ${moves} jugadas (lo mínimo es 6).`,memo,'Jugar otra vez 🔁'),400)}}
      else{lock=true;beep(false);setTimeout(()=>{[b1,b2].forEach(z=>{z.classList.remove('open');z.textContent='❔'});open=[];lock=false},1100)}
    }
  });
}

function allQs(){
  const out=[];

    if(st.type==='quiz')st.qs.forEach(q=>out.push({...q,m:m.mod}));

}
function blitz(){
  stop();
  const qs=shuffle(allQs()).slice(0,10);let k=0,score=0,hits=0;
  const show=()=>{
    stop();
    if(k>=qs.length){const rec=score>(S.best||0);if(rec)S.best=score;addXP(hits*4);save();confetti();

    app.innerHTML=`<div class="topbar"><button class="ghost" onclick="home()">✕</button><b style="flex:1">⚡ ${k+1}/10</b><span class="big" style="font-size:20px" id="sc">${score} pts</span></div>
     <div class="timer"><i id="tm" style="width:100%"></i></div><h2 class="q">${q.q}</h2>
     <div class="opts">${opts.map((o,j)=>`<button class="opt" data-i="${o.i}"><span class="k">${j+1}</span>${o.t}</button>`).join('')}</div>`;
    const answer=b=>{
      if(done)return;done=true;stop();
      const ok=b&&+b.dataset.i===0;
      document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.i===0)x.classList.add('right')});
      if(ok){hits++;score+=10+Math.ceil(t);beep(true);$('#sc').textContent=score+' pts'}else{if(b){b.classList.add('wrong');shake(b)}beep(false)}
      if(ok)setTimeout(()=>{k++;show()},700);else feedback(false,b?`Era: <b>${q.o[0]}</b>`:`⏰ ¡Se acabó el tiempo! Era: <b>${q.o[0]}</b>`,()=>{k++;show()},null,recHTML(recall(q.o[0],q.q,q.r,q.m)));

/* ============ teclado ============ */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'&&e.key!=='Enter')return;
  const fbn=$('#fbn');
  if(e.key==='Enter'||e.key===' '){
    if(fbn){e.preventDefault();fbn.click();return}
    const nx=$('#nx');if(nx&&e.target.tagName!=='BUTTON'){e.preventDefault();nx.click()}
    return;
  }
  if(fbn)return;
  if(/^[1-9]$/.test(e.key)){const o=document.querySelectorAll('.opt:not(:disabled)')[+e.key-1];if(o)o.click()}
  if(e.key==='ArrowRight'){const nx=$('#nx');if(nx)nx.click()}
  if(e.key==='ArrowLeft'){const pv=$('#pv');if(pv&&!pv.disabled)pv.click()}
  const vfb=document.querySelectorAll('.vf button:not(:disabled)');
  if(vfb.length&&(e.key==='v'||e.key==='V'))vfb[0].click();
  if(vfb.length&&(e.key==='f'||e.key==='F'))vfb[1].click();
});
