<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestión de Proyectos · Modo Juego</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1124;--bg2:#141938;--card:#1a2045;--card2:#242b5c;--line:#2f3770;
  --txt:#f1f2ff;--mut:#a7acd9;--acc:#8b6cff;--acc2:#22d3ee;--ok:#22c55e;--bad:#f43f5e;--warn:#fbbf24;
  --r:18px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(1200px 600px at 10% -10%,#2a1f6b 0%,transparent 60%),radial-gradient(900px 500px at 110% 10%,#0b4a5c 0%,transparent 55%),var(--bg);background-attachment:fixed;color:var(--txt);font-family:Nunito,system-ui,Segoe UI,Roboto,sans-serif;font-size:17px;line-height:1.45;min-height:100vh}
#app{max-width:760px;margin:0 auto;padding:16px 16px 140px}
h1,h2,h3{margin:0;line-height:1.2}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:default}
.mut{color:var(--mut)}
small{font-size:.8em}

/* botones */
.btn{background:linear-gradient(135deg,var(--acc),#5b3df5);padding:14px 22px;border-radius:14px;font-weight:800;box-shadow:0 6px 0 #3a23a8;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #3a23a8}
.btn.alt{background:linear-gradient(135deg,#0ea5b7,#0b7285);box-shadow:0 6px 0 #075563}
.ghost{padding:10px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:700}
.ghost:disabled{opacity:.35}

/* home */
.hero{background:linear-gradient(135deg,#2b1f7a,#14306b);border:1px solid #4636a8;border-radius:24px;padding:20px;position:relative;overflow:hidden}
.hero h1{font-size:28px;font-weight:900}
.hero p{margin:4px 0 0;color:#c9ccff}
.hero .float{position:absolute;right:-6px;top:-10px;font-size:90px;opacity:.15;transform:rotate(12deg)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{background:rgba(0,0,0,.25);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:900}
.stat span{font-size:12px;color:#c9ccff}
.xpbar{height:12px;background:rgba(0,0,0,.35);border-radius:99px;margin-top:12px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));border-radius:99px;transition:width .5s}
.xplabel{display:flex;justify-content:space-between;font-size:13px;color:#c9ccff;margin-top:6px}
.sec{margin-top:26px}
.sec>h2{font-size:20px;font-weight:900;margin-bottom:4px}
.sec>p{margin:0 0 12px;color:var(--mut);font-size:15px}
.unit{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--acc2);margin:16px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:flex;gap:12px;align-items:center;transition:transform .12s,border-color .12s}
.mcard:hover{transform:translateY(-2px);border-color:var(--acc)}
.mcard .em{font-size:34px;width:52px;height:52px;display:grid;place-items:center;background:var(--card2);border-radius:14px;flex:none}
.mcard h3{font-size:16px;font-weight:800}
.mcard .meta{font-size:12px;color:var(--mut)}
.mcard .st{font-size:14px;letter-spacing:2px;margin-top:2px}
.mcard.done{border-color:#2e7d4f}
.mode{background:linear-gradient(135deg,var(--card),var(--card2))}
.plan{display:flex;gap:8px;flex-wrap:wrap}
.plan span{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px}
details{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin-top:12px}
summary{font-weight:800;cursor:pointer}
details ol{margin:10px 0 4px;padding-left:20px}
details li{margin-bottom:6px}

/* barra misión */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;position:sticky;top:0;padding:10px 0;background:linear-gradient(var(--bg) 70%,transparent);z-index:5}
.prog{flex:1;height:14px;background:var(--card);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#86efac);border-radius:99px;transition:width .4s}
.tag{display:inline-block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--acc2);margin-bottom:8px}
.q{font-size:22px;font-weight:900;margin-bottom:16px}
.big{font-size:1.5em;color:var(--warn)}

/* tarjetas de concepto */
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:99px;background:var(--line)}
.dots i.on{background:var(--acc2)}
.card{background:linear-gradient(160deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:24px;padding:24px 20px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.35)}
.emo{font-size:72px;line-height:1;margin-bottom:10px}
.card h2{font-size:28px;font-weight:900;background:linear-gradient(90deg,#fff,#c4b5fd);-webkit-background-clip:text;background-clip:text;color:transparent}
.d{font-size:19px;font-weight:600;margin:12px 0 0}
.ex{margin-top:14px;background:rgba(34,211,238,.1);border:1px dashed rgba(34,211,238,.5);border-radius:14px;padding:10px 12px;font-size:15px;text-align:left}
.tip{margin-top:14px;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.55);border-radius:14px;padding:10px 12px;font-size:16px;text-align:left;color:#fde68a}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:18px}
.nav .btn{flex:1}
.pop{animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.92) translateY(10px);opacity:0}to{transform:none;opacity:1}}

/* visuales dentro de tarjetas */
.ladder{display:flex;flex-direction:column-reverse;gap:6px;margin-top:16px}
.ladder div{margin-left:calc(var(--i)*14%);width:58%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:10px;padding:8px 10px;font-weight:800;text-align:left;font-size:15px}
.flow{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:16px}
.flow span{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-weight:800;font-size:15px}
.flow span.hl{background:rgba(251,191,36,.18);border-color:var(--warn);color:#fde68a}
.flow b{color:var(--acc2);font-size:20px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.duo div{background:var(--card2);border-radius:14px;padding:12px;border:1px solid var(--line)}
.duo div b{display:block;font-size:20px}
.scale{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:16px}
.scale span{background:var(--card2);border-radius:8px;padding:6px 0;font-weight:900;font-size:15px;display:flex;flex-direction:column}
.scale small{color:var(--mut);font-weight:600;font-size:11px}
.pyr{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:16px}
.pyr div{padding:10px 6px;font-weight:900;border-radius:6px;font-size:15px}
.pyr div:nth-child(1){background:#7c3aed}.pyr div:nth-child(2){background:#2563eb}.pyr div:nth-child(3){background:#0d9488}
.pyr small{display:block;font-weight:600;opacity:.9}
.nest{margin-top:16px;text-align:left;font-weight:800;font-size:15px}
.nest div{border:2px solid var(--acc2);border-radius:14px;padding:8px 10px 10px;margin-top:6px;background:rgba(34,211,238,.06)}
.arch{display:grid;gap:8px;margin-top:14px;text-align:left;font-size:14px}
.arch div{background:var(--card2);border-radius:12px;padding:10px;border:1px solid var(--line)}
.arch b{display:block;color:var(--acc2)}
.tb{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px;text-align:left;background:var(--card2);border-radius:12px;overflow:hidden}
.tb td,.tb th{padding:6px 8px;border-bottom:1px solid var(--line)}
.tb th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.tree{margin-top:14px;text-align:left;font-size:14px;font-weight:700}
.tree div{border-left:3px solid var(--acc2);padding:4px 0 4px 10px;margin:6px 0 0 8px}
.tree .tq{color:var(--warn)}

/* módulos */
.modh{margin:22px 0 2px;padding:10px 14px;border-radius:14px;background:linear-gradient(90deg,rgba(139,108,255,.28),transparent);border-left:4px solid var(--acc);font-weight:900;font-size:17px}
.modh small{display:block;font-weight:600;color:var(--mut);font-size:13px}
.modsel{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.modsel button{padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:14px}
.modsel button.on{background:var(--acc);border-color:var(--acc)}

/* opciones / quiz */
.opts{display:grid;gap:10px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;font-weight:700;transition:transform .08s,border-color .1s;display:flex;gap:10px;align-items:center}
.opt:hover:not(:disabled){border-color:var(--acc);transform:translateY(-1px)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--card2);display:grid;place-items:center;font-size:13px;color:var(--mut)}
.opt.right{border-color:var(--ok);background:rgba(34,197,94,.15)}
.opt.wrong{border-color:var(--bad);background:rgba(244,63,94,.15)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

/* feedback */
.fb{position:fixed;left:0;right:0;bottom:0;padding:16px max(16px,calc(50% - 364px));display:flex;gap:14px;align-items:center;justify-content:space-between;z-index:20;animation:up .25s ease-out;border-top:3px solid}
.fb.ok{background:#0f2e22;border-color:var(--ok)}
.fb.bad{background:#3a1220;border-color:var(--bad)}
.fb b{font-size:19px;font-weight:900}
.fb.ok b{color:#86efac}.fb.bad b{color:#fda4af}
.fb p{margin:4px 0 0;font-size:15px}
.fb .btn{flex:none}
.fb{max-height:75vh;overflow:auto}
.rec{margin-top:10px;background:rgba(255,255,255,.07);border-left:4px solid var(--acc2);border-radius:10px;padding:8px 12px;font-size:14.5px}
.rec span{display:block;font-size:12px;font-weight:900;color:var(--acc2);text-transform:uppercase;letter-spacing:.08em}
.rec p{margin:4px 0 0}
.rec b{font-size:inherit;color:#fff!important}
@media(max-width:560px){.fb{flex-direction:column;align-items:stretch}.fb .btn{width:100%}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}

/* ordenar */
.slots{display:grid;gap:8px;margin-bottom:16px}
.slot{border:2px dashed var(--line);border-radius:14px;padding:12px 14px;min-height:50px;display:flex;gap:10px;align-items:center;color:var(--mut);font-weight:800}
.slot.fill{border-style:solid;border-color:var(--ok);background:rgba(34,197,94,.12);color:var(--txt);animation:pop .3s}
.slot .n{width:26px;height:26px;border-radius:99px;background:var(--card2);display:grid;place-items:center;font-size:13px;flex:none}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card2);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:800}
.chip:hover:not(:disabled){border-color:var(--acc)}
.chip:disabled{opacity:.15}
.chip.sel{border-color:var(--warn);background:rgba(251,191,36,.15)}

/* clasificar */
.item{background:linear-gradient(135deg,#3b2a99,#1f3b8a);border-radius:20px;padding:26px 18px;text-align:center;font-size:21px;font-weight:900;margin-bottom:16px;box-shadow:0 14px 30px rgba(0,0,0,.35)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.bucket{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px 10px;font-weight:900;font-size:16px}
.bucket:hover:not(:disabled){border-color:var(--acc2)}
.bucket.right{border-color:var(--ok);background:rgba(34,197,94,.15)}
.bucket.wrong{border-color:var(--bad);background:rgba(244,63,94,.15)}
.buckets.pyrb{display:flex;flex-direction:column;align-items:center;gap:6px}
.buckets.pyrb .bucket{border-radius:8px}
.counter{font-size:13px;color:var(--mut);margin-bottom:8px;text-align:center}

/* unir */
.match{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.match .col{display:grid;gap:8px;align-content:start}
.mt{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;text-align:left;font-weight:700;font-size:15px}
.mt.l{font-weight:900;background:var(--card2)}
.mt.sel{border-color:var(--warn);background:rgba(251,191,36,.15)}
.mt.done{border-color:var(--ok);background:rgba(34,197,94,.12);opacity:.55}

/* binario */
.bulbs{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:14px}
.bulb{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .15s}
.bulb .l{font-size:28px;filter:grayscale(1) brightness(.5)}
.bulb b{font-size:15px}
.bulb .bit{font-size:18px;font-weight:900;color:var(--mut)}
.bulb.on{border-color:var(--warn);background:rgba(251,191,36,.15);box-shadow:0 0 22px rgba(251,191,36,.35)}
.bulb.on .l{filter:none}
.bulb.on .bit{color:var(--warn)}
.sumline{text-align:center;font-size:18px;margin-bottom:6px}
.sumline .over{color:var(--bad)}
.binout{text-align:center;font-family:ui-monospace,Consolas,monospace;font-size:30px;letter-spacing:6px;font-weight:900;color:var(--acc2);margin:8px 0 12px}
.hintbox table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px;background:var(--card);border-radius:12px;overflow:hidden}
.hintbox td,.hintbox th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.bitsrow{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;text-align:center;margin-bottom:6px}
.bitsrow span{background:var(--card);border-radius:10px;padding:8px 0;font-weight:900;font-size:24px;font-family:ui-monospace,Consolas,monospace}
.bitsrow span.one{background:rgba(251,191,36,.18);color:var(--warn)}
.bitsrow.sc span{font-size:14px;font-family:inherit;color:var(--mut);padding:4px 0;background:none}
.inp{width:100%;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;color:var(--txt);font:inherit;font-size:22px;font-weight:800;text-align:center;margin:12px 0}
.inp:focus{outline:none;border-color:var(--acc)}
.asc{display:grid;gap:8px;margin:10px 0 16px}
.asc div{display:grid;grid-template-columns:50px 60px 1fr;align-items:center;background:var(--card);border-radius:12px;padding:8px 12px}
.asc .c{font-size:26px;font-weight:900;color:var(--warn)}
.asc code{font-size:20px;letter-spacing:3px;color:var(--acc2);font-weight:800}

/* flashcards */
.flash{perspective:1200px;margin-bottom:14px}
.flash .inner{position:relative;min-height:320px;transition:transform .5s;transform-style:preserve-3d}
.flash.flip .inner{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center}
.flash .back{transform:rotateY(180deg)}
.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px}
.boxes div{background:var(--card);border-radius:12px;padding:8px 4px;text-align:center;font-size:12px;color:var(--mut);border:1px solid var(--line)}
.boxes b{display:block;font-size:20px;color:var(--txt)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate button{padding:14px 6px;border-radius:14px;font-weight:900;background:var(--card);border:2px solid var(--line)}
.rate .r1{border-color:var(--bad)}.rate .r2{border-color:var(--warn)}.rate .r3{border-color:var(--ok)}

/* memotest */
.memo{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:560px){.memo{grid-template-columns:repeat(3,1fr)}}
.tile{aspect-ratio:3/4;border-radius:14px;background:linear-gradient(135deg,var(--acc),#3b2a99);display:grid;place-items:center;font-size:30px;padding:6px;transition:transform .3s}
.tile.open,.tile.done{background:var(--card);border:2px solid var(--line);font-size:13px;font-weight:800;line-height:1.25}
.tile.open.c,.tile.done.c{color:var(--warn);font-size:15px;font-weight:900}
.tile.done{border-color:var(--ok);background:rgba(34,197,94,.12)}

/* VF */
.vf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vf button{padding:22px;border-radius:18px;font-size:20px;font-weight:900}
.vf .v{background:rgba(34,197,94,.15);border:2px solid var(--ok)}
.vf .f{background:rgba(244,63,94,.15);border:2px solid var(--bad)}

/* timer */
.timer{height:10px;background:var(--card);border-radius:99px;overflow:hidden;margin-bottom:14px}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--bad),var(--warn),var(--ok));transition:width .1s linear}

/* final */
.final{text-align:center;padding-top:30px}
.final .stars{font-size:64px;letter-spacing:6px;margin:10px 0}
.final .stars span{display:inline-block;animation:pop .5s backwards}
.final h2{font-size:30px;font-weight:900}
.final .row{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}

/* trucos */
.cheat{display:grid;gap:10px}
.cheat div{background:var(--card);border-left:4px solid var(--warn);border-radius:12px;padding:10px 14px}
.cheat b{color:var(--acc2);font-size:13px;text-transform:uppercase;letter-spacing:.06em}

.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--acc),#5b3df5);padding:12px 20px;border-radius:99px;font-weight:900;z-index:50;animation:pop .3s;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:26px;flex-wrap:wrap}
/* personaje: Bit */
.bitbot{animation:float 3s ease-in-out infinite;overflow:visible;flex:none}
.bitbot.party{animation:jump .45s ease-in-out infinite alternate}
.bitbot.sad{animation:none;transform:rotate(-7deg)}
.bitbot.wow{animation:float 1.6s ease-in-out infinite}
.bitbot .eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
.bitbot .led{animation:led 1.1s infinite alternate}
@keyframes float{50%{transform:translateY(-5px)}}
@keyframes jump{to{transform:translateY(-12px) rotate(5deg)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes led{to{opacity:.35}}
.say{display:flex;gap:10px;align-items:flex-end;text-align:left;margin:16px 0}
.say .bitw{cursor:pointer;flex:none}
.say .bub{background:#f4f2ff;color:#1b1840;border-radius:18px 18px 18px 4px;padding:10px 14px;font-weight:700;font-size:15px;line-height:1.4;box-shadow:0 8px 20px rgba(0,0,0,.25);animation:pop .35s}
.say .bub b{color:#5b3df5}
.say .bub small{display:block;color:#6b6890;font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.fbl{display:flex;gap:12px;align-items:center}
.final .bitbot{margin:0 auto}

/* machete */
.mach{columns:2 330px;column-gap:14px;margin-top:6px}
.mach section{break-inside:avoid;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:0 0 14px;font-size:14.5px;display:inline-block;width:100%}
.mach h3{font-size:16px;color:var(--acc2);margin-bottom:8px;font-weight:900}
.mach table{width:100%;border-collapse:collapse;margin:4px 0}
.mach td,.mach th{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.mach th{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.mach ul{margin:4px 0;padding-left:18px}.mach li{margin-bottom:4px}
.mach p{margin:6px 0}
.mach .tr{color:#fde68a;font-weight:800}
.mach .tp{color:#fda4af}
.mach .h{transition:filter .2s}
.mach.hide .h{filter:blur(5px);background:rgba(255,255,255,.1);border-radius:4px;cursor:pointer;user-select:none}

const pick=a=>a[Math.random()*a.length|0];
const VALS=[128,64,32,16,8,4,2,1];
const SUP=['⁷','⁶','⁵','⁴','³','²','¹','⁰'];

const KEY='proyectos-juego-v1';
let S={xp:0,stars:{},box:{},best:0,bestVF:0,sound:true,streak:0,lastDay:null,mod:0};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY))||{})}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let TIMER=null;
function stop(){clearInterval(TIMER);document.querySelectorAll('.fb').forEach(x=>x.remove())}

const LEVELS=[['💡 Idea',0],['📋 Planificado',150],['⚙️ En ejecución',450],['🏁 Entregado',900],['👑 Leyenda PMP',1500]];
function levelOf(xp){let i=0;LEVELS.forEach((l,k)=>{if(xp>=l[1])i=k});return i}
function today(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function addXP(n){
  const before=levelOf(S.xp);S.xp+=n;
  const t=today();
  if(S.lastDay!==t){const y=new Date(Date.now()-864e5);const ys=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();S.streak=S.lastDay===ys?S.streak+1:1;S.lastDay=t}
  save();
  const after=levelOf(S.xp);
  if(after>before){toast('⬆️ Subiste a '+LEVELS[after][0]);confetti()}
}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function confetti(){const cols=['#8b6cff','#22d3ee','#fbbf24','#22c55e','#f43f5e','#fff'];for(let i=0;i<70;i++){const c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=pick(cols);c.style.animationDuration=(1.4+Math.random()*1.6)+'s';c.style.animationDelay=Math.random()*.4+'s';c.style.borderRadius=Math.random()>.5?'50%':'2px';document.body.appendChild(c);setTimeout(()=>c.remove(),3600)}}
let AC;
function beep(ok){if(!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=ok?'triangle':'sawtooth';o.frequency.setValueAtTime(ok?660:200,t);o.frequency.exponentialRampToValueAtTime(ok?1320:110,t+.18);g.gain.setValueAtTime(ok?.14:.08,t);g.gain.exponentialRampToValueAtTime(.001,t+.28);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.3)}catch(e){}}
function shake(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}

    :`<rect x="4" y="46" width="12" height="20" rx="6" fill="#4c35d6"/><rect x="84" y="46" width="12" height="20" rx="6" fill="#4c35d6"/>`;
  return `<svg class="bitbot ${mood}" width="${size}" height="${Math.round(size*1.1)}" viewBox="0 0 100 110" role="img" aria-label="Bit">
    <defs><linearGradient id="bitg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a08bff"/><stop offset="1" stop-color="#5b3df5"/></linearGradient></defs>

    <rect x="14" y="18" width="72" height="68" rx="22" fill="url(#bitg)" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="23" y="28" width="54" height="42" rx="13" fill="#0e1124"/>
    ${eyes}${mouth}
    <text x="50" y="81" text-anchor="middle" font-size="9" font-weight="900" fill="#e9e5ff" font-family="ui-monospace,Consolas,monospace">01</text>
  </svg>`;
}

  {q:'¿Cuál es la traducción oficial del PMBOK para administración de proyectos?',r:'adminp',o:['Dirección de proyectos','Gerencia de proyectos','Liderazgo de proyectos','Control de proyectos']},

{id:'portafolio',u:2,e:'💼',t:'Portafolio y programa',ref:'1.3',steps:[
 {type:'cards',items:[
  {e:'💼',t:'Portafolio',fq:'¿Qué es un portafolio de proyectos?',d:'Conjunto de proyectos y programas (NO necesariamente relacionados) que trabajan juntos para cumplir los OBJETIVOS ESTRATÉGICOS. Es el nivel más agregado: lo que se ejecuta, lo autorizado y lo que espera.',ex:'Una empresa que quiere rentabilidad mezcla proyectos de petróleo y gas, energía, agua, caminos, vías férreas y aeropuertos.'},
  {e:'📈',t:'El portafolio como cartera',d:'Su valor neto es el valor que obtiene la organización por el resultado de sus proyectos. Se agrupa en categorías y, como todo portafolio de activos, considera RIESGO y RENTABILIDAD.',ex:'En finanzas agrupa instrumentos financieros; en administración agrupa proyectos.'},
  {e:'🧩',t:'Programa',fq:'¿Qué es un programa de proyectos?',d:'Grupo de proyectos RELACIONADOS administrados de forma coordinada para obtener beneficios y control que NO se lograrían por separado.',tip:'PROgrama = PRimos: proyectos de la misma familia'},
  {e:'🔗',t:'¿Cuándo hablamos de programa?',fq:'¿Cuándo se usa el término programa?',d:'Cuando los proyectos comparten recursos críticos, tienen los mismos objetivos, se justificaron con el mismo estudio de factibilidad financiera o están muy relacionados y vinculados en secuencia.',ex:'Ganar mercado: estudio de mercado + infraestructura + distribución + capital de trabajo + personal de ventas, crédito y cobranza.'},
  {e:'⚠️',t:'Proyecto ↔ programa',d:'Un proyecto PUEDE O NO ser parte de un programa, pero un programa SIEMPRE tiene proyectos. Y el PMBOK lo aclara: “los programas NO son proyectos grandes”.'},
  {e:'⚖️',t:'Portafolio vs programa',fq:'¿Qué diferencia a un portafolio de un programa?',d:'Portafolio: estrategia, riesgo-rentabilidad, cualquier cosa (relacionada o no). Programa: coordinación, beneficio extra, proyectos relacionados.',html:V.portprog,tip:'PORTAfolio = PORTA-todo · PROgrama = PRimos'},
  {e:'🏢',t:'Pueden convivir',d:'Una empresa puede tener a la vez proyectos sueltos, programas (proyectos + otras actividades) y portafolios (proyectos + programas) para lograr sus objetivos y optimizar recursos.'},
  {e:'🎨',t:'Gerencia de proyectos',fq:'¿Qué es la gerencia de proyectos y cuál es su importancia?',d:'Una CIENCIA y un ARTE para manejar un proyecto desde que inicia hasta que cierra. Ciencia: conocimientos de varias ramas. Arte: buenas prácticas de miles de gerentes.',ex:'“Lo único que importa es entregar el producto.” Ayuda a maximizar ganancias, ganar credibilidad, prepararse para imprevistos y entregar según costo, tiempo y satisfacción.'}
 ]},
 {type:'sort',rk:['portafolio','programa'],q:'¿Portafolio o programa?',buckets:['💼 Portafolio','🧩 Programa'],items:[
  ['Proyectos NO necesariamente relacionados',0],['Riesgo y rentabilidad',0],['El nivel más agregado',0],['Alineado a los objetivos estratégicos',0],['Petróleo, agua, caminos y aeropuertos juntos',0],['Proyectos relacionados y coordinados',1],['Beneficios que no se lograrían por separado',1],['Comparten recursos críticos',1],['Mismo estudio de factibilidad financiera',1]]},
 {type:'quiz',qs:[
  {q:'Según el PMBOK, “los programas son proyectos grandes”.',r:'programa',o:['Falso: lo aclara explícitamente','Verdadero','Solo en construcción','Depende del presupuesto']},
  {q:'“Todo proyecto pertenece a un programa.”',r:'programa',o:['Falso: puede o no; lo que sí, todo programa tiene proyectos','Verdadero','Solo si es grande','Solo en el PMBOK']},
  {q:'El nivel más agregado, con componentes no necesariamente relacionados, es…',r:'portafolio',o:['El portafolio','El programa','La actividad','La PMO']},
  {q:'La gerencia de proyectos es…',r:'gerencia',o:['Una ciencia y un arte','Solo una ciencia','Solo un arte','Una técnica contable']},
  {q:'¿Qué palabra clave va con portafolio?',r:'portafolio',o:['Estrategia / riesgo-rentabilidad','Coordinación / beneficio extra','Ladrillo','Daily']},
  {q:'Cita del material sobre la gerencia de proyectos:',r:'gerencia',o:['“Lo único que importa es entregar el producto”','“El cliente siempre tiene razón”','“Más vale tarde que nunca”','“El tiempo es dinero”']}
 ]}
]},
{id:'chaos',u:2,e:'📊',t:'Chaos Report 2018',ref:'1.3',steps:[
 {type:'cards',items:[
  {e:'📊',t:'Chaos Report',fq:'¿Qué es el Chaos Report y qué criterios evalúa?',d:'Encuesta anual del Standish Group a más de mil empresas que ejecutan proyectos. Evalúa 4 criterios (que son parte de las siete restricciones): satisfacción, a tiempo, presupuesto y alcance.'},
  {e:'⏱️',t:'Tiempo, presupuesto y alcance',fq:'¿Qué porcentajes da el Chaos Report 2018 en tiempo, presupuesto y alcance?',d:'A tiempo: 35% sí / 65% no. En presupuesto: 35% sí / 65% no. En alcance: 52% sí / 48% no.',html:V.chaos,tip:'“35 - 35 - 52”: tiempo y plata fallan igual; el alcance es el único donde la mayoría cumple'},
  {e:'😐',t:'Satisfacción',fq:'¿Cómo se reparte la satisfacción en el Chaos Report?',d:'Muy satisfecho 14% · Satisfecho 20% · De alguna manera 24% · Insatisfecho 25% · Decepcionado 17%.',html:V.satisf,tip:'La más grande: Insatisfecho 25%. La más chica: Muy satisfecho 14%.'},
  {e:'💡',t:'Conclusión',fq:'¿Qué conclusión saca el material del Chaos Report?',d:'Más del 50% de los proyectos tiene problemas → hay que adoptar BUENAS PRÁCTICAS, independientemente del marco metodológico.'}
 ]},
 {type:'match',q:'Uní cada criterio con su resultado',pairs:[['A tiempo','35% sí · 65% no'],['Dentro del alcance','52% sí · 48% no'],['Muy satisfecho','14% (la porción más chica)'],['Insatisfecho','25% (la porción más grande)']]},
 {type:'quiz',qs:[

  {q:'¿Qué porcentaje NO cumplió el presupuesto?',r:'chaos',o:['65%','35%','48%','25%']},
  {q:'El porcentaje de “muy satisfecho” fue…',r:'satisf',o:['14%','17%','24%','25%']},
  {q:'“Decepcionado” fue…',r:'satisf',o:['17%','20%','14%','25%']},

 ]}
]},
{id:'tareas',u:2,e:'🧱',t:'Actividades y tareas',ref:'1.4',steps:[
 {type:'cards',items:[
  {e:'🧱',t:'Actividad',fq:'¿Qué es una actividad?',d:'Acciones con MAYOR grado de concreción del proyecto. Medio de intervención sobre la realidad mediante acciones secuenciales e integradas para lograr los resultados específicos.'},
  {e:'🔹',t:'Tarea',fq:'¿Qué es una tarea?',d:'La acción con el MÁXIMO grado de concreción y especificidad. Un conjunto de TAREAS configura una ACTIVIDAD.',html:V.actarea,tip:'La tarea es el ladrillo; la actividad es la pared'},
  {e:'🪆',t:'La muñeca rusa',fq:'¿Cuál es la escalera completa, de lo más grande a lo más chico?',d:'Portafolio → Programa → Proyecto → Actividad → Tarea.',html:V.nest,tip:'“Por Probar Pizza Andamos Tarde”'},
  {e:'🏫',t:'Ejemplos (Torres Hernández, 2014)',fq:'¿Cuáles son los ejemplos de la Figura 13 en cada nivel?',d:'Dos ejemplos de la escalera, nivel por nivel:',html:V.escuela}

{id:'director',u:2,e:'🧑‍✈️',t:'El administrador del proyecto',ref:'1.5',steps:[
 {type:'cards',items:[
  {e:'🧑‍✈️',t:'Project Manager',fq:'¿Cómo se traduce “Project Manager” y cuál es la traducción oficial del PMBOK?',d:'Se traduce indistintamente como líder, director, gerente o administrador. La traducción oficial del PMBOK es DIRECTOR DE PROYECTOS.',ex:'El PMI usa: directores de portafolio, de programa, de proyecto y directores funcionales.'},
  {e:'🎯',t:'¿Qué hace?',d:'Es el responsable principal de que el proyecto llegue a su estado final, cubriendo expectativas y con la mayor eficiencia en cada fase. Hace lo de todo administrador: planea, dirige, controla y motiva.'},
  {e:'🦄',t:'¿Qué lo hace único?',fq:'¿Qué hace único al administrador de proyectos frente al funcional?',d:'Administra actividades TEMPORALES y NO REPETITIVAS de un proyecto con vida fija. Crea un equipo y una organización DONDE ANTES NO EXISTÍAN.',html:V.dirfun},
  {e:'🧠',t:'El perfil',fq:'¿Cuáles son las características del perfil del administrador?',d:'Decidir · vencer retos · trabajar con gente diversa · relacionarse bien · manejar tensiones · trabajar y formar equipos · tolerar la frustración · conocimientos GENERALES (no experto técnico) · extrovertido · flexible · creativo · orgulloso de sus logros.'},
  {e:'🧘',t:'En síntesis',d:'Trabajo flexible y en equipo, comunicarse y negociar, tomar decisiones y, sobre todo, tener DOMINIO SOBRE SÍ MISMO.',tip:'No es el mayor experto técnico: es un generalista extrovertido con dominio de sí mismo'}
 ]},
 {type:'sort',rk:['perfil','perfil'],q:'¿Está en el perfil del administrador según el material?',buckets:['✅ Sí','❌ No'],items:[
  ['Tener tolerancia a la frustración',0],['Ser extrovertido, más que tímido',0],['Saber formar equipos',0],['Ser flexible',0],['Ser creativo e innovador',0],['Estar orgulloso por sus logros',0],['Ser el mayor experto técnico del equipo',1],['Ser tímido y reservado',1],['Evitar tomar decisiones',1]]},
 {type:'quiz',qs:[
  {q:'La traducción oficial del PMBOK para “Project Manager” es…',r:'dirpm',o:['Director de proyectos','Gerente de proyectos','Líder de proyectos','Administrador de proyectos']},
  {q:'Lo que hace único al administrador de proyectos es que…',r:'dirpm',o:['Crea equipo y organización donde antes no existían','Administra operaciones existentes','No planifica','Solo controla costos']},
  {q:'Según el material, el administrador debe tener conocimientos…',r:'perfil',o:['Generales, no necesariamente de experto técnico','De experto técnico en todo','Solo contables','Solo de informática']},
  {q:'Lo que más destaca el material del perfil es…',r:'perfil',o:['El dominio sobre sí mismo','El conocimiento técnico','La timidez','La antigüedad']},
  {q:'El administrador de proyectos, como cualquier administrador…',r:'dirpm',o:['Planea, dirige, controla y motiva','Solo ejecuta tareas','Solo firma contratos','Solo reporta']}
 ]}
]},
{id:'pmo',u:2,e:'🏛️',t:'Importancia, beneficios y PMO',ref:'1.5',steps:[
 {type:'cards',items:[
  {e:'🌍',t:'Ya no es “especial”',d:'Naciones, organizaciones e individuos recurren a la administración de proyectos para ser eficientes con recursos cada vez más escasos.'},
  {e:'5️⃣',t:'Las 5 razones de su importancia',fq:'¿Cuáles son las 5 razones de la importancia de la administración de proyectos?',d:'Tecnología · Competencia global · Detonación del conocimiento · Técnicas de eficiencia · Procesos y clientes.',html:V.cinco,tip:'“Tu Compa Dice Todo Perfecto” = T · C · D · T · P'},
  {e:'⏳',t:'El dato estrella',fq:'¿Cuánto ingreso se puede perder con 6 meses de retraso?',d:'Un retraso de 6 MESES puede ocasionar una pérdida del 33% de los ingresos del producto. Por eso hay que reducir el ciclo de vida del proyecto.',tip:'6 meses → −33%'},
  {e:'🔁',t:'La era de los procesos',d:'Quien sabe administrar proyectos puede administrar cualquier proceso productivo. La AP se adapta a un ambiente que exige rendición de cuentas, flexibilidad, innovación, velocidad y mejora continua.'},
  {e:'😊',t:'El mayor beneficio',fq:'¿Cuál es el mayor beneficio de implantar la administración de proyectos?',d:'Tener un CLIENTE SATISFECHO. Cuando los proyectos son exitosos, todos ganan.'},
  {e:'🔑',t:'Factores críticos de éxito',fq:'¿Cuáles son los factores críticos de éxito?',d:'Planeación y comunicación · un plan eficaz antes de iniciar · objetivo bien definido y aceptado por el cliente · cliente como socio · comunicación continua · control eficaz (real vs. planeado) · lecciones aprendidas al concluir.'},
  {e:'🏛️',t:'PMO',fq:'¿Qué es la PMO?',d:'Oficina de dirección de proyectos (Project Management Office). Área de compañías MADURAS que GOBIERNA los proyectos: estandariza con procesos, procedimientos, instructivos, plantillas e indicadores.',tip:'La PMO gobierna y estandariza; NO ejecuta los proyectos'},
  {e:'🚨',t:'Funciones de la PMO',fq:'¿Cuáles son las 5 funciones de la PMO?',d:'Alineación con los objetivos · Lineamientos y políticas · Entrenamientos · Recursos y priorización · Trazabilidad en el repositorio.',html:V.alert,tip:'A-L-E-R-T: la PMO está “alerta”'}
 ]},
 {type:'order',q:'Las 5 razones (Tu Compa Dice Todo Perfecto)',items:['💻 Tecnología','🌍 Competencia global','💥 Detonación del conocimiento','⚙️ Técnicas de eficiencia','🙋 Procesos y clientes']},
 {type:'order',q:'Funciones de la PMO: A-L-E-R-T',items:['🎯 Alineación','📜 Lineamientos','🎓 Entrenamientos','🧰 Recursos y priorización','🗂️ Trazabilidad']},
 {type:'quiz',qs:[
  {q:'Un retraso de 6 meses puede ocasionar una pérdida de ingresos del…',r:'importancia',o:['33%','10%','25%','50%']},
  {q:'El mayor beneficio de implantar la administración de proyectos es…',r:'beneficio',o:['Tener un cliente satisfecho','Reducir personal','Eliminar riesgos','Evitar contratos']},
  {q:'¿Cuál NO es función de la PMO?',r:'pmo',o:['Ejecutar personalmente cada tarea del proyecto','Alineación con los objetivos','Entrenamientos sobre procesos y plantillas','Consolidar información y trazabilidad']},
  {q:'La PMO existe en…',r:'pmo',o:['Algunas compañías maduras','Todas las empresas','Solo en el gobierno','Solo en empresas de software']},
  {q:'“Just in time, downsizing, outsourcing, benchmarking” son…',r:'importancia',o:['Técnicas de eficiencia (desde los ’70)','Certificaciones del PMI','Grupos de procesos','Funciones de la PMO']},
  {q:'Medir el avance real y compararlo con el planeado es…',r:'exito',o:['Control eficaz','Lecciones aprendidas','Entrenamiento','Detonación del conocimiento']},
  {q:'Evaluar el desempeño y pedir realimentación al cliente al concluir genera…',r:'exito',o:['Lecciones aprendidas','Un nuevo portafolio','Un programa','Una PMO']}
 ]}
]},

/* ================= MÓDULO 2 · DIFERENCIA ENTRE COMPRAR Y HACER ================= */
{id:'adq',u:3,e:'🛒',t:'Gestión de adquisiciones',ref:'Intro – 2.1',steps:[
 {type:'cards',items:[
  {e:'🗺️',t:'El embudo del módulo',nf:1,d:'¿Cómo consigue un proyecto lo que no tiene (personas, materiales, equipos y servicios)? Todo el módulo es un embudo:',html:V.embudo},
  {e:'🛒',t:'Gestión de las adquisiciones',fq:'¿Qué es la gestión de las adquisiciones del proyecto?',d:'Incluye los procesos de compra o adquisición. También se la llama el proceso “DESDE EL ORIGEN HASTA LA LIQUIDACIÓN”: evaluar, seleccionar, crear acuerdos contractuales y gestionar la relación con los proveedores.',tip:'Origen → liquidación'},
  {e:'🔄',t:'Compradora o vendedora',d:'La organización puede ser COMPRADORA o VENDEDORA. Y no es solo comprar: también ALQUILAR o CONTRATAR un recurso externo.',ex:'Incluye la gestión del contrato y el control de cambios de contratos u órdenes de compra.'},
  {e:'🎯',t:'Objetivo de compras',fq:'¿Cuál es el objetivo primordial de la gestión de compras?',d:'Proveer ININTERRUMPIDAMENTE materiales, servicios subcontratados y recambios para que la actividad sea constante.'},
  {e:'💸',t:'Importancia sustantiva',fq:'¿Por qué adquisiciones tiene “importancia sustantiva”?',d:'Articula las necesidades de cada actividad y genera el proceso de pagos: “es de donde sale el dinero”. Por eso debe comprar la mejor calidad al menor costo.',ex:'Áreas del PMBOK: integración, ámbitos, tiempos, costos, calidad, RR. HH., comunicación, riesgo y adquisiciones.'},
  {e:'👗',t:'Los 3 recursos',fq:'¿Qué recursos gestiona adquisiciones y con qué ejemplo?',d:'Humanos, materiales y equipamiento. Ejemplo del material: una línea de ropa para dama.',html:V.recursos},
  {e:'🧾',t:'Características mínimas',fq:'¿Qué características mínimas debe tener toda adquisición?',d:'Precio, calidad, cantidad, condiciones de entrega y de pago, incluyendo la negociación de los servicios de POSTVENTA.'},
  {e:'🧑‍💼',t:'El gestor de adquisiciones',fq:'¿Qué habilidades tiene el gestor de adquisiciones y qué le permiten?',d:'Además del conocimiento técnico del proyecto, necesita 5 habilidades que le permiten 4 cosas:',html:V.gestor,tip:'“NeLi-MeSeRe”: Negociar · Liderar · Mercado · Seleccionar · Reducir la gestión'}
 ]},

{id:'ritchie',u:3,e:'⚖️',t:'Caso Ritchie Paving',ref:'2.1',steps:[
 {type:'cards',items:[
  {e:'⚖️',t:'El caso',fq:'¿De qué trata el caso Ritchie Paving vs. Deerfield?',d:'“Recurso por contratación preferente no divulgada”: Ritchie Paving contra la ciudad de Deerfield (Kansas). Michael C. Loulakis, Civil Engineering, junio 2003.',html:V.ritchie},
  {e:'📢',t:'La licitación',d:'Abril de 2000: mejorar calles. Debía terminarse en 2000, con inicio antes del 17 de octubre. Ganaría: costo más bajo, calidad y responsabilidad del oferente.'},
  {e:'🙊',t:'El interés oculto',fq:'¿Por qué perdió Ritchie si hizo la oferta más baja?',d:'Ritchie ofertó lo más bajo e iniciaba el 1/10 (cumplía las reglas). Pero Deerfield quería terminar en el VERANO de 2000… y no lo puso en los documentos.'},
  {e:'🌦️',t:'Factores intangibles',fq:'¿Cuáles fueron los “factores intangibles” de Deerfield?',d:'Demoras por clima · posible pérdida de donaciones federales · altas tasas de los bonos · un acuerdo con otra ciudad para transportar su basura.'},
  {e:'🏛️',t:'Los fallos',fq:'¿Cómo fallaron la Corte de Distrito y la Suprema Corte de Kansas?',d:'Corte de Distrito: a favor de DEERFIELD (podía considerar factores intangibles). Suprema Corte de Kansas: a favor de RITCHIE (Deerfield se basó en factores no divulgados).'},
  {e:'💵',t:'¿Qué recupera Ritchie?',fq:'¿Qué pudo recuperar Ritchie?',d:'Los GASTOS DE PREPARACIÓN de la oferta. NO la pérdida de ganancias. Y no es regla general para todo el que pierde una licitación.'},
  {e:'💡',t:'La lección',fq:'¿Cuál es la lección del caso Ritchie?',d:'No hay razón para ocultar intereses: hacer públicas las preferencias fomenta la competencia y asegura un trato justo a todos los licitadores.',ex:'Si el cliente no especifica todo: reclamos judiciales, nulidad del proceso, pagar costos de oferta, demoras y pérdida de credibilidad.'}
 ]},
 {type:'order',q:'Ordená la historia del caso',items:['📢 Licitación (abril 2000)','💲 Ritchie hace la oferta más baja','🙊 Deerfield usa un interés no divulgado','⚖️ Corte de Distrito: a favor de Deerfield','🏛️ Suprema Corte: a favor de Ritchie']},
 {type:'sort',rk:['ritchie','ritchie'],q:'¿Fue un factor intangible de Deerfield?',buckets:['✅ Sí','❌ No'],items:[['Demoras por el clima',0],['Posible pérdida de donaciones federales',0],['Altas tasas de los bonos',0],['Acuerdo para transportar la basura con otra ciudad',0],['Precio del asfalto importado',1],['Una huelga de transportistas',1]]},
 {type:'quiz',qs:[
  {q:'La Suprema Corte de Kansas permitió a Ritchie recuperar…',r:'ritchie',o:['Los gastos de preparación de la oferta','Las ganancias perdidas','El valor total del contrato','Nada']},
  {q:'¿Qué corte falló a favor de Deerfield?',r:'ritchie',o:['La Corte de Distrito','La Suprema Corte de Kansas','Ninguna','La Corte Federal']},
  {q:'Desde este fallo, ¿todo licitador que pierda puede recuperar sus gastos?',r:'ritchie',o:['No: el tribunal no adoptó una regla general','Sí, siempre','Solo en Kansas','Solo si la oferta fue la más baja']},
  {q:'¿Qué quería Deerfield y no escribió?',r:'ritchie',o:['Terminar la obra en el verano de 2000','Empezar en 2001','Usar asfalto importado','Contratar a una empresa local']},
  {q:'La lección del caso es…',r:'ritchie',o:['Hacer públicas las preferencias para un trato justo','Ocultar intereses para negociar mejor','Elegir siempre la oferta más cara','No hacer licitaciones']}
 ]}
]},

{id:'planadq',u:4,e:'📋',t:'Planear y programar',ref:'2.2',steps:[
 {type:'cards',items:[
  {e:'📋',t:'Planeación de las adquisiciones',fq:'¿Qué es la planeación de las adquisiciones?',d:'Identificar qué partes del proyecto deben adquirirse FUERA de la organización. Se basa en los requerimientos de cada área, por ESCRITO, y está ligada al manejo de INVENTARIOS: asegura el flujo de insumos.'},
  {e:'❓',t:'Las 7 preguntas',fq:'¿Cuáles son las 7 preguntas que responde la planeación de adquisiciones?',d:'¿Qué materiales? ¿Cuántos? ¿Cómo? ¿Cuándo? ¿A quién? ¿Cuánto tarda la entrega? ¿Cuánto costará que llegue y su almacenamiento?',html:V.preg7,tip:'Las preguntas del periodista: Qué, Cuánto, Cómo, Cuándo, A quién + Demora + Costo de traer y guardar'},
  {e:'🧭',t:'Cómo se planea',d:'Considerar políticas y reglas de la organización (condiciones, plazos de pago, tipos de proveedor), el objetivo, el presupuesto, los costos y tiempos. Preguntar a los expertos de cada área y reflexionar si la compra es INNECESARIA (si se puede hacer con recursos internos).',ex:'Identificar artículos con almacenamiento largo o manejo especial y armar la lista de adquisiciones con características físicas y de operación.'},
  {e:'📆',t:'Programación',fq:'¿Qué desfases hay en la programación de adquisiciones y cómo se resuelven?',d:'Además de las necesidades: calidad, experiencia de proveedores, presupuesto y fechas. Hay desfases entre la decisión y la compra efectiva, y entre la entrega pactada y la real.',tip:'Solución: experiencias anteriores + un tiempo de HOLGURA entre etapas'}
 ]},
 {type:'order',q:'Las 7 preguntas de la planeación',items:['📦 ¿Qué materiales?','🔢 ¿Cuántos?','🛠️ ¿Cómo adquirir?','📅 ¿Cuándo?','🏪 ¿A quién comprarle?','🚚 ¿Cuánto tarda la entrega?','🏬 ¿Cuánto cuesta traerlo y guardarlo?']},
 {type:'quiz',qs:[
  {q:'La planeación de adquisiciones identifica…',r:'planadq',o:['Qué partes del proyecto deben adquirirse fuera de la organización','Quién dirige el proyecto','Los riesgos del clima','El cronograma de la PMO']},
  {q:'La planeación está directamente relacionada con…',r:'planadq',o:['El manejo de inventarios','El marketing','Los sueldos','El organigrama']},
  {q:'Para los desfases en la programación se recomienda…',r:'programadq',o:['Usar experiencias anteriores y un tiempo de holgura','Comprar todo el primer día','Ignorar las fechas','Cambiar de proveedor siempre']},
  {q:'Al planear, hay que reflexionar si la compra…',r:'planadq',o:['Es innecesaria porque se puede hacer con recursos internos','Es la más cara posible','La aprueba el proveedor','Debe ser en efectivo']},
  {q:'¿Cuál NO es una de las 7 preguntas?',r:'planadq',o:['¿De qué color es el logo del proveedor?','¿Cuántos?','¿A quién comprarle?','¿Cuánto tomará la entrega?']}
 ]}
]},
{id:'formas',u:4,e:'📢',t:'Formas de adquirir y licitación',ref:'2.2',steps:[
 {type:'cards',items:[
  {e:'🛍️',t:'Las 4 formas de adquirir',fq:'¿Cuáles son las 4 formas de adquirir y cuándo se usa cada una?',d:'Dependen del MONTO y la ESPECIFICIDAD:',html:V.formas},
  {e:'🛒',t:'Compra directa',d:'Montos o cantidades NO considerables: se compra en cualquier establecimiento comercial.'},
  {e:'📢',t:'Licitación',d:'Montos mayores. Empieza con la CONVOCATORIA (o invitación) y termina con el FALLO (elección del proveedor).',tip:'Licitación = una carrera: largada (convocatoria) y llegada (fallo)'},
  {e:'✉️',t:'Adjudicación restringida',d:'Necesidades específicas o de alta especialización: se invita a un grupo de una lista previa (invitación a CUANDO MENOS TRES), que presenta propuestas en SOBRE CERRADO.'},
  {e:'☝️',t:'Adjudicación directa',d:'Se otorga el contrato a un proveedor DETERMINADO, buscando las mejores condiciones, SIN pasar por ninguna de las etapas anteriores.',tip:'Compra directa (montos chicos) ≠ adjudicación directa (contrato sin etapas)'},
  {e:'📣',t:'Convocatoria',fq:'¿Qué es la convocatoria?',d:'El aviso formal a TODOS los interesados en participar que cumplan los criterios. El cliente fija requisitos y debe dar a todos IGUAL ACCESO a la información para no favorecer a nadie.',ex:'No pueden faltar requisitos legales, técnicos y económicos. El contrato fija penas económicas por incumplimiento.'},
  {e:'📑',t:'La propuesta',d:'El cliente prepara documentos (requerimientos, especificaciones, invitación, solicitud de cotización y de propuesta) para una propuesta sólida a precio realista. La propuesta muestra la habilidad del proveedor y puede ser verbal o electrónica.'},
  {e:'🌱',t:'Criterios de las adquisiciones',fq:'¿Cuáles son los criterios de las adquisiciones?',d:'Precio, calidad, oportunidad, entrega y, recientemente, el uso responsable de recursos y la protección del medio ambiente.'}
 ]},
 {type:'sort',rk:['compradir','licit','restring','adjdir'],q:'¿Qué forma de adquirir es?',buckets:['🛒 Compra directa','📢 Licitación','✉️ Restringida','☝️ Adjudicación directa'],items:[

  {q:'Otorgar un contrato a un proveedor determinado sin etapas previas es…',r:'adjdir',o:['Adjudicación directa','Compra directa','Licitación','Invitación restringida']},
  {q:'La adjudicación restringida implica invitar a…',r:'restring',o:['Cuando menos tres proveedores','Todos los interesados','Un único proveedor','Solo proveedores extranjeros']},
  {q:'¿Qué es lo que está abierto a TODOS los interesados?',r:'convoc',o:['La convocatoria de la licitación','La invitación restringida','La adjudicación directa','El fallo']},
  {q:'En la convocatoria, el cliente debe dar a todos…',r:'convoc',o:['Igual acceso a la información','Un descuento','Un adelanto de pago','El mismo puntaje']},
  {q:'Un criterio de adquisición que se sumó recientemente es…',r:'critadq',o:['El uso responsable de recursos y el medio ambiente','El color del producto','La nacionalidad del gestor','La antigüedad del cliente']}
 ]}
]},
{id:'hacercomprar',u:4,e:'🤔',t:'¿Hacer o comprar? + documentos',ref:'2.3 – 2.4',steps:[
 {type:'cards',items:[
  {e:'🤔',t:'Decisiones de hacer o comprar',fq:'¿Qué son las decisiones de hacer o comprar?',d:'Documentan qué productos, servicios o resultados se ADQUIRIRÁN FUERA de la organización y cuáles se DESARROLLARÁN INTERNAMENTE por el equipo.',html:V.hacer,tip:'HACER = adentro (mi equipo) · COMPRAR = afuera (proveedor). Es el nombre del módulo.'},
  {e:'📝',t:'Cómo es esa decisión',fq:'¿Qué características tiene la decisión de hacer o comprar?',d:'Puede ser una SIMPLE LISTA con justificación breve · puede MODIFICARSE si las adquisiciones posteriores lo piden · puede incluir PÓLIZAS DE SEGURO o garantías de cumplimiento para riesgos identificados.'},
  {e:'📄',t:'Documentos de la adquisición',fq:'¿Para qué se usan los documentos de la adquisición?',d:'Para SOLICITAR PROPUESTAS a posibles vendedores. Incluyen la forma de respuesta, el enunciado del trabajo y las disposiciones contractuales.',ex:'Su complejidad es coherente con el valor y riesgo, con flexibilidad para sugerencias. Se publican en periódicos, boletines, registros públicos o Internet.'},
  {e:'💲',t:'Precio o técnica',fq:'¿Qué términos se usan cuando la selección se basa en el precio y cuál cuando no?',d:'Licitación, oferta o cotización → la selección se basa en el PRECIO. Propuesta → importan otras cosas: capacidad o enfoque TÉCNICO.',html:V.loco,tip:'“LOCO por el precio”: Licitación · Oferta · COtización. La Propuesta es Pensada.'},
  {e:'🔤',t:'Las siglas',fq:'¿Qué significan RFI, IFB, RFP y RFQ?',d:'Cuatro siglas para pedir ofertas:',html:V.siglas,tip:'Quote y Bid = plata · Proposal = técnica · I = info'},
  {e:'🚨',t:'La actividad del módulo',fq:'¿Qué términos hacen referencia a la selección basada en el precio?',d:'Opciones: plazo de entrega, licitación, oferta, propuesta, cotización. Correctas: LICITACIÓN, OFERTA y COTIZACIÓN.',ex:'Trampas: “Propuesta” es técnica y “Plazo de entrega” no es un tipo de documento.'}
 ]},
 {type:'sort',rk:['loco','loco'],q:'¿Se basa en el precio o en lo técnico?',buckets:['💲 Precio','🧠 Técnica'],items:[['Licitación',0],['Oferta',0],['Cotización',0],['IFB',0],['RFQ',0],['Propuesta',1],['RFP',1],['Enfoque técnico',1]]},
 {type:'match',q:'Uní cada sigla con su significado',pairs:[['RFI','Solicitud de información'],['IFB','Invitación a licitación'],['RFP','Solicitud de propuesta'],['RFQ','Solicitud de cotización']]},

  {q:'¿Qué término se usa cuando la selección NO se basa principalmente en el precio?',r:'loco',o:['Propuesta','Licitación','Oferta','Cotización']},
  {q:'RFQ significa…',r:'siglas',o:['Solicitud de cotización','Solicitud de información','Invitación a licitación','Solicitud de propuesta']},
  {q:'Los documentos de la adquisición sirven para…',r:'docadq',o:['Solicitar propuestas a posibles vendedores','Pagar al proveedor','Cerrar el proyecto','Despedir personal']},
  {q:'La complejidad de los documentos debe ser coherente con…',r:'docadq',o:['El valor y los riesgos de la adquisición','El tamaño del logo','La cantidad de empleados','El clima']},
  {q:'“Plazo de entrega” es…',r:'loco',o:['Un distractor: no es un tipo de documento','Un documento basado en precio','Lo mismo que propuesta','Una sigla del PMBOK']}
 ]}
]},
{id:'seleccion',u:4,e:'🏆',t:'Selección de proveedores',ref:'2.5',steps:[
 {type:'cards',items:[
  {e:'🏆',t:'Criterios de selección',d:'Suelen ir en los documentos de solicitud; sirven para calificar propuestas y pueden ser objetivos o subjetivos. Pueden limitarse al precio si el artículo abunda, pero OJO: el precio incluye el artículo + gastos accesorios (por ej., la entrega).'},
  {e:'📋',t:'Los 14 criterios del PMBOK',fq:'¿Cómo se agrupan los 14 criterios de selección del PMBOK?',d:'Comprensión de la necesidad · costo del ciclo de vida · capacidad técnica · riesgo · enfoque de gestión · enfoque técnico · garantía · capacidad financiera · capacidad de producción · tamaño y tipo · desempeño pasado · referencias · propiedad intelectual · propiedad exclusiva.',html:V.cajones,tip:'4 cajones: ¿Entiende? · ¿Puede? · ¿Cuánto cuesta y arriesgo? · ¿Quién es?'},
  {e:'💰',t:'Costo total o del ciclo de vida',fq:'¿Qué considera el criterio “costo total o del ciclo de vida”?',d:'¿Dará el costo total más bajo? Suma el costo de COMPRA + el de OPERACIÓN.'},
  {e:'⚖️',t:'Selección de la propuesta',d:'El gestor evalúa lo TÉCNICO (enfoque y metodología) y lo ECONÓMICO/comercial (precio). Ejemplo de graduación: legal = permisos; técnico = estacionamiento; económico = costo del servicio. Si no hay normatividad interna, se sugiere crearla.'},
  {e:'🔢',t:'Cualitativos vs cuantitativos',fq:'¿Qué criterios son cualitativos y cuáles cuantitativos?',d:'Cualitativos: experiencia, referencias, requerimientos específicos (fechas). Cuantitativos: precios y características financieras (capital social, garantías).',html:V.cuali},
  {e:'5️⃣',t:'Los 5 criterios normales',fq:'¿Cuáles son los 5 criterios normales en orden?',d:'1 Tiempo de respuesta (el PRIMER filtro) · 2 Servicio al cliente · 3 Tiempo de entrega · 4 Cumplimiento de especificaciones · 5 Tipo de pago.',html:V.normales,tip:'“Te Sirvo En Envase Plástico”'},
  {e:'🚑',t:'Detalles de los 5',d:'Emergencia: se compra al primero que cotiza a precio razonable (horas, no días). Atención deficiente → descartado. Importaciones = entregas más largas. Especificaciones: no siempre obligatorias, pero sí en compras para la operación.',ex:'A igual producto y precio similar, gana el que da MÁS DÍAS DE CRÉDITO.'},
  {e:'📊',t:'Comparativo y ponderación',fq:'¿Qué pesos tiene la ponderación de la Tabla 15.3?',d:'Comparativo: título, fecha, proveedor, descripción, marca, condiciones de pago, entrega, observaciones, moneda y precio unitario. La ponderación reparte 100 puntos:',html:V.ponder,tip:'El precio NO es el que más pesa (15). Los de 20: experiencia, certificaciones y materiales. El menor: pago (10).'},
  {e:'🔄',t:'Nuevos proveedores',fq:'¿Por qué buscar nuevos proveedores aunque ya tengas lista?',d:'Precios razonables, tecnología avanzada, atención oportuna y no depender de un solo proveedor.'}
 ]},
 {type:'order',q:'Los 5 criterios normales (Te Sirvo En Envase Plástico)',items:['⏱️ Tiempo de respuesta','🙋 Servicio al cliente','🚚 Tiempo de entrega','📐 Cumplimiento de especificaciones','💳 Tipo de pago']},
 {type:'sort',rk:['cajones','cajones','cajones','cajones'],q:'¿En qué cajón va el criterio?',buckets:['🤔 ¿Entiende?','💪 ¿Puede?','💸 ¿Cuesta / arriesga?','🪪 ¿Quién es?'],items:[

{id:'contrato',u:4,e:'✍️',t:'Técnicas, contrato y cierre',ref:'2.5',steps:[
 {type:'cards',items:[
  {e:'🧰',t:'Técnicas de selección',fq:'¿Cuáles son las 6 técnicas de selección de proveedores?',d:'Se pueden combinar:',html:V.tecnicas,tip:'Pondero · Estimo · Detecto · Negocio · Califico · Consulto. Detección = filtro de entrada; estimación = miro afuera de la licitación.'},
  {e:'🏁',t:'Fallo y negociación',fq:'¿Qué pasa con el poder del proveedor cuando la necesidad de compra es grande?',d:'Terminada la evaluación se emite el FALLO. Después hay NEGOCIACIÓN (precio y condiciones de pago), que debe ser beneficiosa para ambas partes.',ex:'Mientras MÁS GRANDE la necesidad de compra, MAYOR PODER tiene el proveedor → planear para no comprar caro por falta de tiempo.'},
  {e:'✍️',t:'El contrato',fq:'¿Qué es el contrato?',d:'Convenio formal entre comprador y vendedor, oral o escrito (siempre mejor por ESCRITO): el proveedor entrega y el cliente paga. También: acuerdo, subcontrato, orden de compra o memorándum de entendimiento.',ex:'“Si no hay un contrato, ¿cómo se puede exigir que se cumpla lo acordado?” Lo firman personas con poder y autorización.'},
  {e:'📑',t:'Qué debe detallar',d:'Requerimientos para aceptar lo entregado · condiciones de pago · penalizaciones · garantías financieras del proveedor · acciones ante modificaciones · todo lo que mitigue riesgos.'},
  {e:'🔒',t:'Tipos de contrato',fq:'¿Quién corre el riesgo en cada tipo de contrato?',d:'Precio fijo: el riesgo ALTO es del PROVEEDOR si suben los costos. Reembolso del costo (costo real + utilidad acordada): el riesgo es del CLIENTE.',html:V.contratos,tip:'“El que fija el número se come la suba”',ex:'Ojo: el material dice “bajo riesgo para el contratista” en precio fijo, refiriéndose a quien contrata (el cliente).'},
  {e:'🔎',t:'Administración del contrato',fq:'¿Qué implica administrar el contrato?',d:'Garantizar que ambos cumplan (tiempos, especificaciones, fechas y montos). Proveedor: reclamos, pagos, resultados. Cliente: inspecciones, auditorías, revisión de desempeño. Si el proveedor incumple, se lo notifica y se registra.',ex:'Materiales: seguir pedido → transportar → recibir → verificar → almacenar → cerrar → comparar pagos. Servicios: control de cambios del contrato.'},
  {e:'🗄️',t:'Cierre',fq:'¿Cómo se cierra un contrato?',d:'Cuando ambas partes confirman el cumplimiento: NOTIFICACIÓN POR ESCRITO firmada de conformidad. Se ARCHIVA todo para futuros trabajos y como evidencia.'},
  {e:'📏',t:'¿Cómo se mide la gestión?',fq:'¿Cómo se mide la gestión de adquisiciones?',d:'Control de costos que ahorre · stocks mínimos · habilidad para encontrar fuentes de abastecimiento · investigar nuevos materiales.',tip:'“CoSto, Stock, Fuentes, Nuevos”'}
 ]},
 {type:'sort',rk:['ponderac','estimind','deteccion','negoc','calific','expertos'],q:'¿Qué técnica de selección es?',buckets:['⚖️ Ponderaciones','🔭 Estimación indep.','🚧 Detección','🤝 Negociación','📊 Calificación','🎓 Expertos'],items:[
  ['Matriz de criterios: gana el mayor puntaje',0],['Estudio de mercado con proveedores que no participan',1],['Descartar desde el inicio a quien no cumple',2],['Acordar costos, tiempos y penalizaciones',3],['Basarse en experiencias previas con el proveedor',4],['Recurrir a la experiencia probada de otros',5]]},
 {type:'sort',rk:['contratos','contratos'],q:'¿Qué tipo de contrato?',buckets:['🔒 Precio fijo','🧾 Reembolso del costo'],items:[['El precio no cambia salvo acuerdo de ambos',0],['Alto riesgo para el proveedor si suben los costos',0],['Bajo riesgo para el cliente',0],['Costo real + utilidad acordada',1],['Seguridad para el proveedor',1],['Si suben los precios, paga el cliente',1]]},
 {type:'quiz',qs:[
  {q:'La técnica que descarta desde el inicio a quienes no cumplen un criterio es…',r:'deteccion',o:['Sistema de detección','Estimaciones independientes','Juicio de expertos','Sistema de ponderaciones']},
  {q:'En un contrato de precio fijo, el alto riesgo si suben los costos lo tiene…',r:'contratos',o:['El proveedor','El cliente','El gobierno','Ambos por igual']},
  {q:'Mientras más grande sea la necesidad de compra…',r:'fallo',o:['Mayor poder tiene el proveedor','Menor poder tiene el proveedor','No cambia nada','Desaparece la licitación']},
  {q:'El contrato se recomienda que sea…',r:'contrato',o:['Siempre por escrito','Siempre oral','Secreto','Sin firmas']},
  {q:'El cierre del contrato se hace mediante…',r:'cierre',o:['Notificación por escrito firmada de conformidad','Un llamado telefónico','Un mail sin respuesta','Nada: se cierra solo']},
  {q:'¿Cuál NO mide la gestión de adquisiciones?',r:'medir',o:['La cantidad de reuniones diarias','Control de costos que ahorre','Stocks mínimos','Encontrar fuentes de abastecimiento']},
  {q:'Las estimaciones independientes son…',r:'estimind',o:['Un estudio de mercado con proveedores que no participan en la licitación','Un filtro de entrada','La opinión de expertos','La negociación final']}
 ]}
]},

{id:'agil',u:5,e:'⚡',t:'¿Qué es lo ágil?',ref:'Intro – 3.1',steps:[
 {type:'cards',items:[
  {e:'🗺️',t:'Scrum en 3 - 5 - 3',nf:1,d:'El módulo contrapone la forma tradicional (cascada) con la ágil y profundiza en Scrum: qué es lo ágil, beneficios, Scrum, roles, ceremonias y artefactos.',tip:'3 roles · 5 ceremonias · 3 artefactos principales'},
  {e:'⚡',t:'Metodologías ágiles',fq:'¿Qué son las metodologías ágiles?',d:'Una forma innovadora de trabajar y organizarse que FRAGMENTA el proyecto en partes que se adaptan sobre la marcha, se complementan y se resuelven en poco tiempo. NO necesitan definir al inicio TODO el alcance.',ex:'No son una simple herramienta: son una estrategia integral para gestionar con rapidez y flexibilidad.'},
  {e:'🚀',t:'Qué buscan',d:'Entregar en poco tiempo PEQUEÑAS PIEZAS de software funcionando para aumentar la satisfacción del cliente, con enfoques flexibles y trabajo en equipo.',ex:'Tradicional: planificación proactiva (costo, alcance y tiempo). Ágil: equipo, colaboración con el cliente y flexibilidad.'},
  {e:'📜',t:'Las más usadas',fq:'¿Cuáles son las metodologías ágiles más usadas según la introducción?',d:'Programación extrema (XP), Scrum y Kanban. Todas se guían por el MANIFIESTO ÁGIL, escrito por varios autores.',tip:'“XSK” = XP · Scrum · Kanban'},
  {e:'🔺',t:'El triángulo invertido',fq:'¿Qué es fijo y qué es variable en lo tradicional y en lo ágil?',d:'Tradicional: alcance FIJO; tiempo y costo VARIABLES. Ágil: tiempo y costo FIJOS (de cada iteración); alcance VARIABLE.',html:V.triang,tip:'Ágil: sé CUÁNTO dura y cuesta la iteración (timebox); lo que varía es QUÉ entrego'},
  {e:'🌊',t:'Cascada vs ágil',fq:'¿Cómo es el ciclo de vida en cascada y en ágil?',d:'Cascada: proceso secuencial que se hace UNA vez con los menores cambios. Ágil: un producto inicial que EVOLUCIONA en iteraciones abiertas a cambios.',html:V.cascada},
  {e:'🤝',t:'Rasgos del ágil',d:'Desarrollo y prueba ITERATIVOS · típico de resultados intangibles (software, documentación) pero aplicable a otros proyectos · comunicación CARA A CARA: interesados, desarrolladores y clientes juntos.'}
 ]},
 {type:'order',q:'El ciclo en cascada',items:['📋 Planear','🔍 Analizar','✏️ Diseñar','🏗️ Construir','🧪 Prueba','📦 Entregar']},
 {type:'sort',rk:['cascada','agil'],q:'¿Tradicional (cascada) o ágil?',buckets:['🌊 Tradicional','⚡ Ágil'],items:[
  ['Alcance fijo; tiempo y costo variables',0],['Proceso secuencial que se hace una única vez',0],['La menor cantidad posible de cambios',0],['Planificación proactiva de costo, alcance y tiempo',0],['Tiempo y costo fijos por iteración',1],['Alcance variable',1],['Iteraciones abiertas a cambios',1],['No define todo el alcance al inicio',1],['Comunicación cara a cara con el cliente',1]]},
 {type:'quiz',qs:[
