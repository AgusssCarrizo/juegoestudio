  {q:'¿Cuál NO es una ciencia que involucra la Ingeniería de Software?',r:'is',o:['Contabilidad','Sistemas Operativos','Bases de Datos','Inteligencia Artificial']}
 ]}
]},
{id:'etapas9',u:5,e:'🪜',t:'Las 9 etapas (Senn)',ref:'5.2',steps:[
 {type:'cards',items:[
  {e:'🪜',t:'Fases y etapas',fq:'¿Cuáles son las 9 etapas de construcción de un SI (Senn, 1992)?',d:'Procedimiento estandarizado, más allá del ciclo de vida elegido. 2 fases: 4 etapas INICIALES + 5 de CONSTRUCCIÓN.',html:V.senn,ex:'Senn (1992). Se pueden ver con enfoque general (todo el proyecto) o específico (por proceso).',tip:'Reco-Rele-Diag-Facti / Aná-Dise-Progra-Prue-Imple'},
  {e:'🔎',t:'Fase 1: etapas iniciales',d:'1) Reconocimiento · 2) Relevamiento · 3) Diagnóstico · 4) Estudio de factibilidad. Al cerrarlas hay una visión clara de la empresa y se decide si el proyecto sigue.',tip:'Las primeras 4 deciden SI se hace.'},
  {e:'✅',t:'Estudio de factibilidad',fq:'¿Qué muestra el estudio de factibilidad?',d:'Muestra si el proyecto es VIABLE y qué RECURSOS participarán. Es la última etapa previa: recién después se aprueba y se construye.'},
  {e:'🏗️',t:'Fase 2: construcción',d:'5) Análisis · 6) Diseño · 7) Programación · 8) Prueba · 9) Implementación. Arranca cuando se APRUEBA el proyecto.',ex:'La hacen los ingenieros, pero los actores de la organización SIGUEN participando: en el análisis surgen dudas que se consultan.',tip:'Las últimas 5 lo HACEN.'},
  {e:'🧪',t:'Análisis y prueba',d:'ANÁLISIS (etapa 5): se plantea cada problema (proceso) y se busca su solución. PRUEBA: el sistema no se pone en marcha directo; usuarios e ingenieros lo prueban y se corrige “una y otra vez”.',tip:'Vuelve en 6.1: las pantallas respetan el análisis de la etapa 5 y se desarrollan en el diseño.'},
  {e:'📣',t:'10 ventajas de los SI de marketing',fq:'¿Cuáles son las 10 ventajas de los SI de marketing (NeoAttack)?',d:'Infografía de NeoAttack. Se analizan en la planificación estratégica para debatir la viabilidad:',html:V.mkt}
 ]},
 {type:'order',q:'Las 9 etapas, en orden',items:['🔎 Reconocimiento','📋 Relevamiento','🩺 Diagnóstico','✅ Estudio de factibilidad','🧠 Análisis','✏️ Diseño','⌨️ Programación','🧪 Prueba','🚀 Implementación']},
 {type:'sort',rk:['fase1','fase2'],q:'¿Etapa inicial o de construcción?',buckets:['🔎 Fase 1 · Iniciales','🏗️ Fase 2 · Construcción'],items:[
  ['Reconocimiento',0],['Relevamiento',0],['Diagnóstico',0],['Estudio de factibilidad',0],['Análisis',1],['Diseño',1],['Programación',1],['Prueba',1],['Implementación',1]]},
 {type:'quiz',qs:[
  {q:'¿Qué etapa decide si el proyecto es viable?',r:'facti',o:['El estudio de factibilidad','El diagnóstico','La prueba','La implementación']},
  {q:'Contando las 9 en orden, la etapa 5 es…',r:'fase2',o:['Análisis','Diseño','Prueba','Diagnóstico']},
  {q:'¿Los usuarios participan durante la construcción?',r:'fase2',o:['Sí: siguen participando, incluso en la prueba junto a los ingenieros','No, solo los ingenieros','Solo al final','Solo en el reconocimiento']},
  {q:'¿Cuándo comienza la fase de construcción?',r:'fase2',o:['Cuando el proyecto es aprobado','Antes del relevamiento','Durante el diagnóstico','Después de la implementación']},
  {q:'Las 9 etapas de construcción de un SI son de…',r:'senn',o:['Senn (1992)','McConnell (1996)','Sommerville (2011)','Pressman (2010)']},
  {q:'“Si no podemos obtener los datos, podemos comprarlos” es una ventaja de…',r:'mkt',o:['Los SI de marketing (NeoAttack)','El ciclo de vida en cascada','La memoria ROM','El SPT']}
 ]}
]},
{id:'clasicas',u:5,e:'🧭',t:'Metodologías clásicas',ref:'5.3',steps:[
 {type:'cards',items:[
  {e:'🧭',t:'Metodologías de desarrollo',d:'Hay varios paradigmas para construir un SI. Las 9 etapas suelen respetarse, pero a veces se unifican o se subdividen en ciclos chicos por proceso.',ex:'La elección depende de los requerimientos, los tiempos y el estilo del equipo.'},
  {e:'⚖️',t:'¿Cómo elegir? (McConnell, 1996)',d:'Considerar: los TIEMPOS disponibles, qué tan definidos tiene el cliente los REQUERIMIENTOS y los RECURSOS ECONÓMICOS (incluida la estabilidad económica del país).'},
  {e:'💧',t:'Cascada pura',d:'Muy estructurada: no empieza una etapa hasta terminar la anterior. Va bien en proyectos complejos y bien definidos; encuentra errores temprano y barato.',ex:'Desventajas: NO es flexible (un problema en la fase 6 obliga a actualizar desde la 1) y el cliente no ve avances.'},
  {e:'⌨️',t:'Codificar y corregir',d:'Poco formal: sin documentación, arranca directo a producir. Para proyectos CORTOS y BARATOS; no requiere mucha experiencia.',ex:'Desventajas: no sirve para proyectos grandes; si falla, se desecha.'},
  {e:'🌀',t:'Espiral',d:'Compleja y combinable. Estudia cada proceso para optimizarlo ANTES de construir. A mayor inversión, mayor reducción de RIESGOS. Se construye cuando se aprueba el análisis.',ex:'Desventajas: requiere conocimientos profundos, costos altos y demoras.'},
  {e:'🧪',t:'Prototipado evolutivo',d:'Ideal cuando el cliente NO TIENE CLAROS los requerimientos. Se construye por partes y se le consulta; muestra avances visibles.',ex:'Desventaja: no se puede estipular el TIEMPO (el ida y vuelta puede ser muy largo).'},
  {e:'📦',t:'Entrega por etapas',d:'Divide en MÓDULOS (ventas, compras, finanzas) que se entregan e implementan por partes. Progreso rápido y análisis de prioridades. Si falta plata, los módulos terminados QUEDAN.',ex:'Desventaja: la planificación (dividir el trabajo y lograr módulos independientes).'},
  {e:'🗺️',t:'Guía rápida para elegir',fq:'¿Qué metodología clásica conviene en cada caso?',d:'Requerimientos claros y proyecto complejo → Cascada · Chico, corto y barato → Codificar y corregir · Mucho riesgo e inversión → Espiral · El cliente no sabe qué quiere → Prototipado · Usar algo ya, por módulos → Entrega por etapas.',tip:'Las 5: Cascada, Codificar, Espiral, Prototipado, Entrega'}
 ]},
 {type:'sort',rk:['cascada','codcor','espiral','proto','entrega'],q:'¿Qué metodología clásica es?',buckets:['💧 Cascada','⌨️ Codificar y corregir','🌀 Espiral','🧪 Prototipado','📦 Entrega por etapas'],items:[
  ['Requerimientos claros y proyecto complejo',0],['No se empieza una etapa sin terminar la anterior',0],['Un error en la fase 6 obliga a actualizar desde la 1',0],['Proyecto chico, corto y barato',1],['No genera documentación',1],['Si falla, se desecha',1],['A mayor inversión, mayor reducción de riesgos',2],['Costos altos, demoras y conocimientos profundos',2],['El cliente no sabe lo que quiere',3],['No se puede estipular el tiempo',3],['Si se acaba la plata, los módulos terminados quedan',4],['Ventas, compras y finanzas se entregan por separado',4]]},
 {type:'quiz',qs:[
  {q:'El cliente no tiene claros los requerimientos. ¿Qué metodología usás?',r:'proto',o:['Prototipado evolutivo','Cascada pura','Codificar y corregir','Espiral']},
  {q:'La mayor desventaja de la cascada es…',r:'cascada',o:['No es flexible: un error en la fase 6 obliga a actualizar desde la 1','Que no tiene etapas','Que es muy barata','Que el cliente ve todo el tiempo los avances']},
  {q:'Las metodologías clásicas del módulo son de…',r:'mccon',o:['McConnell (1996)','Sommerville (2011)','Senn (1992)','Davis (1993)']},
  {q:'En la entrega por etapas, si la organización tiene problemas económicos…',r:'entrega',o:['Conserva los módulos terminados','Pierde todo','Tiene que empezar de cero','El sistema se borra']},
  {q:'“A mayor inversión, mayor reducción de riesgos” describe…',r:'espiral',o:['Espiral','Codificar y corregir','Prototipado evolutivo','Entrega por etapas']},
  {q:'¿Qué NO se considera al elegir una metodología?',r:'mccon',o:['El color del logo de la empresa','Los tiempos disponibles','La definición de requerimientos','Los recursos económicos y la estabilidad del país']}
 ]}
]},
{id:'agiles',u:5,e:'⚡',t:'Ágiles: XP y Scrum',ref:'5.3',steps:[
 {type:'cards',items:[
  {e:'⚡',t:'Metodologías ágiles',fq:'¿Qué caracteriza a las metodologías ágiles?',d:'Rompen las estructuras de los modelos clásicos. Desarrollo INCREMENTAL: no se analizan antes las soluciones; se construye directo, en contacto estrecho con el cliente, empezando por lo importante y urgente.',ex:'Sommerville (2011).'},
  {e:'⚖️',t:'Pros y contras',d:'✅ Más económicas y dinámicas; pequeñas partes cada PAR DE SEMANAS; retroalimentación rápida con comunicación INFORMAL. ❌ Carecen de documentación formal y estructurada, que podría servir en el futuro.'},
  {e:'🚀',t:'XP vs Scrum',fq:'¿En qué se diferencian XP y Scrum?',d:'Las 2 metodologías ágiles del módulo:',html:V.xpscrum,tip:'XP = eXPress (entregas vertiginosas) · Scrum = el administrativo'},
  {e:'🔄',t:'El sprint de Scrum',fq:'¿Cuáles son las 4 etapas del sprint?',d:'Primero un bosquejo con objetivos generales y diseño arquitectónico. Después el SPRINT: 4 etapas en bucle. Al final se entrega la funcionalidad completa.',html:V.sprint,tip:'“VaSe-DeRe”: Valoración, Selección, Desarrollo, Revisión'}
 ]},
 {type:'order',q:'Las etapas del sprint (VaSe-DeRe)',items:['🔍 Valoración','✅ Selección','⌨️ Desarrollo','🔎 Revisión']},
 {type:'sort',rk:['xp','scrum','agil'],q:'¿XP, Scrum o ágiles en general?',buckets:['🚀 XP','🏉 Scrum','⚡ Ágiles en general'],items:[
  ['Requerimientos como escenarios',0],['Prueba para el usuario final en días',0],['Dinámica vertiginosa de evaluación continua',0],['Enfoque administrativo del desarrollo',1],['Bosquejo inicial con diseño arquitectónico',1],['Ciclo llamado sprint',1],['Poca documentación formal',2],['Entregas cada par de semanas',2],['Comunicación informal y rápida',2]]},
 {type:'quiz',qs:[
  {q:'¿Cuáles son las etapas del sprint de Scrum?',r:'sprint',o:['Valoración, selección, desarrollo y revisión','Análisis, diseño, programación y prueba','Planeamiento, producción y mantenimiento','Objetivos, límites y alcances']},
  {q:'La principal desventaja de las ágiles es que…',r:'agil',o:['Carecen de documentación formal y estructurada','Son muy caras','Son muy lentas','No tienen contacto con el cliente']},
  {q:'Scrum es…',r:'scrum',o:['Un enfoque administrativo del desarrollo','Un lenguaje de programación','Un tipo de base de datos','Una metodología clásica']},
  {q:'En XP, los requerimientos se establecen como…',r:'xp',o:['Escenarios','Casos de uso UML','Tablas','Diagramas en cascada']},
  {q:'Las metodologías ágiles del módulo son de…',r:'agil',o:['Sommerville (2011)','McConnell (1996)','Senn (1992)','Pressman (2010)']},
  {q:'¿Cada cuánto preparan las ágiles pequeñas partes para el cliente?',r:'agil',o:['Cada par de semanas','Cada 5 años','Solo al final','Nunca']}
 ]}
]},
{id:'datosobj',u:5,e:'🧱',t:'Datos vs objetos',ref:'5.4',steps:[
 {type:'cards',items:[
  {e:'🧱',t:'2 paradigmas de análisis y diseño',fq:'¿Cuáles son los 2 paradigmas de análisis y diseño?',d:'ORIENTADO A DATOS (estructural) y ORIENTADO A OBJETOS. La Ingeniería de Software está muy ligada a las Bases de Datos.',html:V.datosobj},
  {e:'✂️',t:'Separación de objetivos',fq:'¿Qué es el principio de separación de objetivos?',d:'Dividir el problema en SUBPROBLEMAS (particiones). En cada una se ven la secuencia del evento (estímulo y respuesta) y las tablas que participan.',ex:'Un sistema orientado a datos = conjunto de particiones; su unión cumple el objetivo general.'},
  {e:'🧾',t:'Ejemplo: “Cliente hace pedido”',d:'Partición “1 Tratar pedido”. Entidad externa: el Cliente.',html:V.particion},
  {e:'➡️',t:'Las flechas',fq:'¿Qué operaciones hay sobre las tablas?',d:'LECTURA: una consulta a la tabla. GRABACIÓN: se genera un registro nuevo. LECTURA Y GRABACIÓN: más de una operación sobre la misma tabla.',ex:'Clientes → lectura · Facturas → grabación · Productos → lectura y grabación (leo el stock y lo actualizo).'},
  {e:'✈️',t:'Orientado a objetos',fq:'¿Qué es un objeto?',d:'Los datos se transforman en OBJETOS, con 2 partes:',html:V.objeto,tip:'Atributos = cómo ES · Métodos = qué HACE'},
  {e:'📐',t:'UML y casos de uso',fq:'¿Qué es UML y qué representa?',d:'UML = Lenguaje de Modelado Unificado (Pressman, 2010). Cada proceso se refleja en CASOS DE USO, con ACTORES y CONTROLADORES (subprocesos o módulos).',ex:'Caso de Uso N°1, alarma silenciosa del Banco X. Actores: Central Alarma, Operador, Banco. Controladores: Servidor Mensajes, Control Clientes, Control Incidencias.'},
  {e:'🗣️',t:'Comunicación',d:'Al construir y al mantener el sistema es esencial la comunicación entre todas las partes de la empresa: cada proceso se optimiza con distintas perspectivas.'}
 ]},
 {type:'sort',rk:['opstab','opstab','opstab'],q:'¿Qué operación sobre la tabla es?',buckets:['👁️ Lectura','💾 Grabación','🔁 Lectura y grabación'],items:[
  ['Una consulta a la tabla',0],['Clientes: se busca al solicitante',0],['Se genera un nuevo registro',1],['Facturas: se graba la venta',1],['Más de una operación sobre la misma tabla',2],['Productos: se lee el stock y se actualiza',2]]},

  {q:'Si el cliente no está registrado…',r:'parti',o:['Se emite un rechazo del pedido','Se emite la factura igual','Se borra la tabla de productos','Se da de alta un proveedor']},
  {q:'En UML, cada proceso se refleja en…',r:'uml',o:['Casos de uso','Particiones con tablas','Cubos de datos','Sprints']},
  {q:'En el caso de la alarma del banco, el Operador es…',r:'uml',o:['Un actor','Un controlador','Una tabla','Un atributo']},

  {q:'El principio de separación de objetivos consiste en…',r:'sepobj',o:['Dividir el problema en subproblemas (particiones)','Separar a los usuarios de los ingenieros','No documentar','Juntar todos los procesos en uno']}

{id:'docbd',u:5,e:'📚',t:'Documentación y bases de datos',ref:'5.5 – 5.6',steps:[
 {type:'cards',items:[
  {e:'📚',t:'La documentación',d:'Un desarrollo formal documenta cada detalle: funcionamiento y componentes. Se ADAPTA A CADA LECTOR: detalles para los expertos que mantienen, y lo superficial para los usuarios.'},
  {e:'📑',t:'3 tipos de documentación',fq:'¿Cuáles son los 3 tipos de documentación y para quién es cada uno?',d:'Cada una tiene su lector:',html:V.docs,tip:'SRS = QUÉ hace · Análisis = CÓMO está hecho · Manual = CÓMO se usa'},
  {e:'🏛️',t:'Capital estructural',d:'La documentación se vincula con la estructura jerárquica: cada nivel tiene su documentación y el manual refleja el apoyo a los procesos de cada uno.'},
  {e:'🗃️',t:'Base de datos',fq:'¿Qué es una base de datos (Elmasri y Navathe, 2007)?',d:'Colección de datos con una relación de significado IMPLÍCITO: están juntos porque se relacionan, pero esa relación no está expresada. Representa el mundo real; los datos no son aleatorios.',ex:'Explícito: “Repasá SI de la unidad 2”. Implícito: “En las unidades anteriores está SI, que se vincula con esta” → se entiende sin decirlo.'},
  {e:'⚡',t:'¿Por qué tener una BD?',fq:'¿Cuáles son las 3 razones para tener una BD?',d:'1) Información COMPACTADA (sin pilas de papel) · 2) Más VELOCIDAD de respuesta · 3) Información PRECISA y ACTUALIZADA.'},
  {e:'🔐',t:'Usuarios y seguridad',d:'SIMPLES: lecturas, modificaciones y altas (operativo). AVANZADOS: trabajan la info táctica y estratégica. Acceso con usuario, clave y nivel.',ex:'El auxiliar de compras ve productos y órdenes de compra, pero NO facturación ni cuentas corrientes.'},
  {e:'🔑',t:'Tablas, campos y claves',fq:'¿Qué son tabla, campo, registro y clave primaria?',d:'TABLA: datos de un tema · CAMPO = columna (ej. CUIT) · REGISTRO = fila (un proveedor) · CLAVE PRIMARIA: identifica un registro ÚNICO.',html:V.bdtabla,ex:'StockMinimo indica cuándo hay que comprar; StockActual se actualiza con compras y ventas.',tip:'Fila = Registro · Columna = Campo'}
 ]},
 {type:'sort',rk:['srs','docan','umanual'],q:'¿Qué tipo de documentación es?',buckets:['📄 SRS','🔧 Doc. del análisis','📘 Manual de usuario'],items:[
  ['Comportamiento del sistema sin detalles de construcción',0],['Se hace al final de la definición de requerimientos',0],['Acompaña al producto final',0],['Estructuras de datos y armado de la BD',1],['Solo para desarrolladores, para el mantenimiento',1],['Funcionamiento de las pantallas',2],['Guía para los usuarios que lo operan',2]]},
 {type:'sort',rk:['bdtab','bdcampo','bdfila','bdclave'],q:'¿Tabla, campo, registro o clave primaria?',buckets:['🗂️ Tabla','📏 Campo','➖ Registro','🔑 Clave primaria'],items:[
  ['Proveedores',0],['Productos',0],['CUIT',1],['StockMinimo',1],['Una columna',1],['Chinfae SA, San Martín 2541',2],['Una fila',2],['Identifica un registro único',3],['No puede repetirse entre proveedores',3]]},
 {type:'quiz',qs:[
  {q:'La relación entre los datos de una BD es…',r:'bd',o:['Implícita: existe pero no está expresada','Explícita y escrita en cada dato','Aleatoria','Inexistente']},
  {q:'La documentación del análisis es para…',r:'docan',o:['Solo los desarrolladores','Los clientes','Los proveedores','Todos los usuarios']},
  {q:'La SRS (Especificación de Requerimientos) es de…',r:'srs',o:['Davis (1993)','Senn (1992)','McConnell (1996)','Robbins y Coulter (2005)']},
  {q:'¿Cuál NO es una razón para tener una BD?',r:'bdpq',o:['Tener más papel impreso','Información compactada','Mayor velocidad de respuesta','Información precisa y actualizada']},
  {q:'Los usuarios avanzados…',r:'usuarios',o:['Trabajan la info en niveles táctico y estratégico','Solo hacen altas operativas','No tienen clave','Diseñan las pantallas']},
  {q:'La clave primaria…',r:'bdclave',o:['Representa un registro único','Es la contraseña del usuario','Es una fila vacía','Es el nombre de la tabla']}
 ]}
]},

/* ================= MÓDULO 3 · UNIDAD 6 ================= */
{id:'pantallas',u:6,e:'🖥️',t:'Interfaz y pantallas',ref:'6.1',steps:[
 {type:'cards',items:[
  {e:'🔌',t:'Usuario ⇄ Equipo ⇄ Servidor',d:'El usuario usa el equipo (entrada: mouse, teclado, lápiz óptico · salida: monitor, impresora) y el equipo se comunica con el servidor. Ambas conexiones son BIDIRECCIONALES: petición y respuesta.',html:V.interac,ex:'Esa red mantiene la disponibilidad de la info; bien implementada, hace FIABLE al SI.'},
  {e:'🖼️',t:'La interfaz',d:'Es el NEXO entre el usuario y lo interno del sistema: debe ser amigable y funcional. El diseño parte de una ESTRUCTURA JERÁRQUICA DE PANTALLAS, construida a partir de la estructura organizativa.',ex:'“Sistema XYZ”: Ventas, Compras, Taller, ABM y Listados, cada una con subpantallas.'},
  {e:'🚧',t:'Pantallas de acceso limitado',d:'Operaciones avanzadas (presupuestos, ventas, compras), ligadas a decisiones tácticas y estratégicas, y el ABM.',ex:'ABM = Alta-Baja-Modificación de registros (clientes, proveedores, productos, insumos). Acceso restringido, aunque pueden participar algunos del nivel operativo.'},
  {e:'🎨',t:'Diseño de pantallas: 4 etapas',fq:'¿Cuáles son las 4 etapas del diseño de pantallas (Pressman, 2010)?',d:'1) ANÁLISIS Y MODELADO (entrevistas: cómo percibe cada usuario sus procesos) · 2) DISEÑO inicial (participan todos) · 3) CONSTRUCCIÓN y vínculo con el SI · 4) VALIDACIÓN (buscar errores de uso).',html:V.adcv,tip:'A-D-C-V: Analizo, Diseño, Construyo, Valido'},
  {e:'➕',t:'Usabilidad',fq:'¿Qué es la usabilidad?',d:'FUNCIONALIDAD: cada pantalla hace bien su operación y da toda la info necesaria. AMIGABILIDAD: sencillas, con un lineamiento general en todas. USABILIDAD: la propiedad mayor, engloba las dos y mide CUALITATIVAMENTE la facilidad y eficiencia.',html:V.usab},
  {e:'😨',t:'Los 2 estadios del usuario',fq:'¿Cuáles son los 2 estadios del usuario y cómo se resuelven?',d:'El lineamiento general (misma estructura en todas las pantallas) ayuda en dos momentos:',html:V.estadios,ex:'Ej.: “¿Confirma el alta del cliente? SÍ/NO”. El temor se transforma en confianza.'},
  {e:'✋',t:'5 características de las pantallas',fq:'¿Cuáles son las 5 características del diseño de pantallas?',d:'1) Sin acciones innecesarias · 2) Con las PREFERENCIAS de cada usuario · 3) Sin info compleja que no aporte · 4) El usuario NO debe MEMORIZAR: todo está en pantalla · 5) No muy cargadas: la info aparece por etapas.',ex:'Pressman (2010). La pantalla es lo ÚNICO que el usuario “ve”: la BD y los procesos son internos.'},
  {e:'🔗',t:'Pantalla ↔ partición',fq:'¿Qué se construye primero: particiones o pantallas?',d:'Cada pantalla se vincula con su partición: pide y muestra los datos, y después se hacen las operaciones internas. Las PARTICIONES se construyen en el ANÁLISIS y las PANTALLAS después, en el DISEÑO.',ex:'Sommerville (2011).'},
  {e:'🪑',t:'Ejemplo: “Generar pedido”',d:'N° de cliente o DNI → Consultar (si no existe: “No se encuentra el cliente” + Alta de cliente) → producto y cantidad (Silla NIXI × 4) → Añadir (sin stock: rechazo) → Finalizar → CONFIRMAR (factura + actualizar productos) o CANCELAR, los dos con reconfirmación.',ex:'Es FUNCIONAL (cumple la tarea) y AMIGABLE (guiado y robusto ante errores). El mantenimiento sirve para corregir errores y también para evolucionar.'}
 ]},
 {type:'order',q:'Las 4 etapas del diseño de pantallas (A-D-C-V)',items:['🔍 Análisis y modelado','✏️ Diseño','🏗️ Construcción','✅ Validación']},
 {type:'sort',rk:['estad1','estad2'],q:'¿Estadio inicial o de confianza?',buckets:['😨 Estadio inicial','😎 Estadio de confianza'],items:[

{id:'cultsim',u:6,e:'🎮',t:'Cultura y simulación',ref:'6.1 – 6.2',steps:[
 {type:'cards',items:[
  {e:'🏛️',t:'Cultura organizacional',fq:'¿Qué es la cultura organizacional según Robbins y Coulter (2005)?',d:'“Un sistema de SIGNIFICADOS e IDEAS que comparten los integrantes de una organización y que determina en buena medida cómo se COMPORTAN entre ellos y con la gente de afuera.”',ex:'El SI debe respetar la estructura jerárquica Y la cultura y los valores: así se fortalece el vínculo usuario-SI.'},
  {e:'📱',t:'Cambio cultural por las TIC',d:'Las TIC generaron más flujos de información y comunicación e innumerables recursos, en lo personal, laboral y académico (Gil Rodríguez, 2002).',ex:'Los cambios de la sociedad impactan en la organización y repercuten en el SI.'},
  {e:'🎮',t:'Simulación',fq:'¿Qué es la simulación y en qué se diferencia de la prueba?',d:'Simular el sistema o algunos procesos para ver cómo responden a los estímulos. El usuario usa un PROTOTIPO sin temor.',ex:'En la PRUEBA, el usuario teme “romper” el sistema porque cree que es el final. En la simulación trabaja tranquilo y detecta mejor anomalías.',tip:'Simulación = jugar sin miedo a romper'},
  {e:'🎓',t:'Otro uso: capacitar',d:'Sirve para CAPACITAR o “entrenar” usuarios con un modelo que a priori no es el que se implementará (Tarifa, 2001).'},
  {e:'6️⃣',t:'6 fases de la simulación',fq:'¿Cuáles son las 6 fases de un estudio de simulación?',d:'García Sánchez y Ortega Mier (2006):',html:V.simfases,tip:'Objetivos → Conceptual → Comunicativo → Construyo → Experimento → Documento (conceptual va ANTES que comunicativo)'},
  {e:'🧠',t:'Conceptual vs comunicativo',d:'CONCEPTUAL (fase 2): modelo LÓGICO con la funcionalidad básica, validado con quienes operan cada proceso. COMUNICATIVO (fase 3): modelo entre DISEÑADORES y PROGRAMADORES, con diagramas.'},
  {e:'🏆',t:'Ventaja competitiva',d:'Optimiza los procesos: una implementación eficiente da ventaja competitiva. Sin simulación, la puesta en marcha puede causar pérdidas y demoras.',ex:'Ventas online sin simulación ni pruebas → caída de ventas, clientes disconformes y pérdidas económicas.'}
 ]},
 {type:'order',q:'Las 6 fases de la simulación',items:['🎯 Definición de objetivos y del sistema','🧠 Modelo conceptual','💬 Modelo comunicativo','🏗️ Construcción y verificación','🧪 Explotación y diseño de experimentos','📄 Documentación e implantación']},

{id:'estrat',u:7,e:'🎯',t:'Estrategia y planificación',ref:'7.1',steps:[
 {type:'cards',items:[
  {e:'🎯',t:'Punto de partida',d:'Al inicio se analizan la situación de la empresa y el IMPACTO ESTRATÉGICO del SI: procesos, aspectos positivos y negativos (internos y externos) y objetivos → ¿es viable y a qué costo?'},
  {e:'🦴',t:'El SI se adapta al organigrama',fq:'¿Para qué se adapta el SI al organigrama?',d:'El SI es la columna vertebral y se adapta a la estructura jerárquica para: 1) que la comunicación y el tratamiento de la info FLUYAN entre niveles · 2) no romper la INTEGRIDAD · 3) asignar PERMISOS según los niveles.',tip:'¡Es la respuesta de la actividad del módulo!'},
  {e:'📅',t:'¿Cuándo planificar?',fq:'¿Cuándo hay que planificar estratégicamente un SI?',d:'Al ADQUIRIR un SI o al hacer MODIFICACIONES SIGNIFICATIVAS en uno que ya funciona.',ex:'La planificación identifica necesidades, define los objetivos y la función del SI, e incluye el escenario: recursos, infraestructura y arquitectura.'},
  {e:'🔻',t:'Los 3 aspectos',fq:'¿Cuáles son los 3 aspectos de la relación estrategia–SI–TI?',d:'Rodríguez y Lamarca (2012), de lo general a lo específico:',html:V.asp3,tip:'Negocio (por qué) → SI (qué) → TI (con qué)'},
  {e:'🏢',t:'1. Estrategia de negocio',d:'Misión, visión y estrategia de la empresa; el mercado y los productos o servicios; qué fin tiene el cambio y cómo impactará.'},
  {e:'🗄️',t:'2. Estrategia de SI',d:'Procesos a abordar, necesidades de almacenamiento y tratamiento de info, aplicaciones. Una estructura eficiente para almacenar y el grado de INTEROPERABILIDAD de los subsistemas.'},
  {e:'🖧',t:'3. Estrategia de TI',d:'La ARQUITECTURA tecnológica y el apoyo a los procesos. Políticas de SEGURIDAD y CONTINGENCIA y recursos tecnológicos.'},
  {e:'♻️',t:'El modelo no es estático',fq:'¿Por qué el modelo estrategia–SI–TI no es estático?',d:'Los SI son sistemas ABIERTOS: deben evolucionar para no volverse obsoletos. Hay un alineamiento CONTINUO entre la estrategia de negocio y la de sistemas y tecnologías (Rodríguez y Lamarca, 2012, p. 18).',tip:'Conecta con la entropía del Módulo 1.'}
 ]},
 {type:'order',q:'Los 3 aspectos, de lo general a lo específico',items:['🏢 Estrategia de negocio','🗄️ Estrategia de SI','🖧 Estrategia de TI']},
 {type:'sort',rk:['negocio','estsi','estti'],q:'¿Estrategia de negocio, de SI o de TI?',buckets:['🏢 Negocio','🗄️ SI','🖧 TI'],items:[

 {type:'quiz',qs:[
  {q:'¿Para qué se adapta el SI al organigrama?',r:'organig',o:['Fluidez de la info entre niveles, integridad y permisos según el nivel','Para tener menos usuarios','Para no usar base de datos','Para cambiar el organigrama']},
  {q:'¿Cuándo hay que planificar estratégicamente un SI?',r:'planif',o:['Al adquirirlo o al hacer modificaciones significativas','Solo cuando se rompe','Todos los días','Nunca']},
  {q:'Orden de los 3 aspectos, de lo general a lo específico:',r:'asp3',o:['Negocio → SI → TI','TI → SI → Negocio','SI → Negocio → TI','Negocio → TI → SI']},

  {q:'Los 3 aspectos de la relación estrategia–SI–TI son de…',r:'asp3',o:['Rodríguez y Lamarca (2012)','Yourdon (1993)','Fernández Alarcón (2006)','Pressman (2010)']}
 ]}
]},
{id:'olafoda',u:7,e:'📐',t:'Fase 1: OLA y FODA',ref:'7.2',steps:[
 {type:'cards',items:[
  {e:'🗺️',t:'Las 4 fases del proceso SI/TI',fq:'¿Cuáles son las 4 fases del proceso SI/TI?',d:'Rodríguez y Lamarca (2012). Cada fase se vincula con la anterior por RETROALIMENTACIÓN.',html:V.fasesti,ex:'Las acompaña la gestión del proceso: dirección, manejo del equipo, comunicación y adaptación a cambios.',tip:'Comprendo → Analizo → Formulo → Implanto'},
  {e:'📐',t:'OLA',fq:'¿Qué es el OLA y quién lo plantea?',d:'Objetivos, Límites y Alcances, más PRIORIDADES (Yourdon, 1993). Parte de un relevamiento de todos los procesos y de los requerimientos del cliente.',html:V.ola},
  {e:'⭐',t:'Prioridades',d:'Muchos SI arrancan sin estar 100% terminados y eso NO es una falla: se construyen por módulos, priorizando los centrales (ventas, compras). Mientras funciona lo importante, se sigue con lo demás.'},
  {e:'🎬',t:'Videoclub “Películas MAX”',d:'Alquila películas gratis a sus socios (subvención del Estado). 3 procesos: ASOCIACIÓN (carnet) · ALQUILER (comprobante) · DEVOLUCIÓN (comprobante si devuelve todo).',ex:'Objetivo general: “Gestionar el alquiler de películas del videoclub Películas MAX”. Límite general: “Desde que la persona solicita asociarse hasta que es rechazada o devuelve la película”.'},
  {e:'✍️',t:'Cómo escribir un OLA',fq:'¿Cómo se escriben los objetivos, los límites y los alcances?',d:'OBJETIVOS: empiezan con un verbo (“Gestionar…”, “Implementar el subsistema de…”). LÍMITES: “Desde que… hasta que se rechaza o se emite…”. ALCANCES: dos listas, INCLUYE y NO INCLUYE.',ex:'Videoclub · Incluye: alta de socios, carnets, comprobantes de alquiler y de devolución. No incluye: actualización de clientes, facturación, proveedores, compras y sueldos.'},
  {e:'🧭',t:'FODA',fq:'¿Qué es la FODA y quién la desarrolló?',d:'Fortalezas, Oportunidades, Debilidades y Amenazas. La desarrolló ALBERT HUMPHREY y se adapta a la implementación de un SI (Sarli, González y Ayres, 2015).',html:V.foda,tip:'F y D = INTERNAS (dependen de la empresa) · O y A = EXTERNAS (vienen del entorno)'},
  {e:'⚠️',t:'Amenaza ≠ debilidad',d:'Variaciones de la moneda, problemas gremiales, cambios de ley → AMENAZAS (externas). DEBILIDADES = los mismos recursos que las fortalezas, pero con carencias.',ex:'La FODA sirve en cualquier situación: individual, empresarial o de producto.'}
 ]},
 {type:'order',q:'Las 4 fases del proceso SI/TI',items:['🧭 Comprensión de la estrategia de negocio','🔭 Análisis de los SI/TI','🧠 Formulación de la estrategia','📆 Plan de implantación']},
 {type:'sort',rk:['olaobj','olalim','olaalc'],q:'Videoclub: ¿objetivo, límite o alcance?',buckets:['🎯 Objetivo','↔️ Límite','📦 Alcance'],items:[
  ['Gestionar el alquiler de películas',0],['Implementar el subsistema de devolución',0],['Desde que solicita asociarse hasta que es rechazada o devuelve',1],['Desde que solicita el alquiler hasta que se rechaza o se emite el comprobante',1],['Incluye: emisión de carnets',2],['No incluye: liquidación de sueldos',2]]},
 {type:'sort',rk:['olaalc','olaalc'],q:'El sistema del videoclub, ¿lo incluye o no?',buckets:['✅ Incluye','❌ No incluye'],items:[
  ['Alta de socios',0],['Emisión de carnets',0],['Comprobante de alquiler',0],['Comprobante de devolución',0],['Sistema de facturación',1],['Proveedores',1],['Sistema de compras',1],['Liquidación de sueldos',1],['Actualización de clientes',1]]},
 {type:'sort',rk:['ffort','fopo','fdeb','famen'],q:'¿Qué parte de la FODA es?',buckets:['💪 Fortaleza','🌤️ Oportunidad','🩹 Debilidad','⛈️ Amenaza'],items:[
  ['Personal técnico muy capacitado',0],['Buena infraestructura propia',0],['Un mercado que crece y favorece a la empresa',1],['Un entorno que genera ventaja competitiva',1],['Servidores viejos que no soportan la carga',2],['Poco presupuesto para el proyecto',2],['Variaciones de la moneda',3],['Problemas gremiales',3],['Cambios en la legislación',3]]},
 {type:'quiz',qs:[
  {q:'OLA significa…',r:'ola',o:['Objetivos, Límites y Alcances','Organización, Logística y Administración','Operaciones, Lectura y Actualización','Objetivos, Lineamientos y Accesos']},
  {q:'El OLA lo plantea…',r:'ola',o:['Yourdon (1993)','Albert Humphrey','Sommerville (2011)','Fernández Alarcón (2006)']},
  {q:'“Problemas gremiales”, ¿qué es en la FODA?',r:'famen',o:['Amenaza: externa y negativa','Debilidad','Fortaleza','Oportunidad']},
  {q:'¿Quién desarrolló la matriz FODA?',r:'foda',o:['Albert Humphrey','Yourdon','Rodríguez y Lamarca','Pressman']},
  {q:'Un SI se pone en marcha sin estar 100% terminado. Eso significa que…',r:'prio',o:['Se construye por módulos según prioridades, no que falle','Tiene fallas graves','Se eligió mal el ciclo de vida','No tiene OLA']},
  {q:'Los límites se escriben…',r:'olalim',o:['“Desde que… hasta que se rechaza o se emite…”','Con un verbo en infinitivo','Como dos listas: incluye y no incluye','Con porcentajes']},
  {q:'Las fortalezas y las debilidades son…',r:'foda',o:['Internas','Externas','Siempre positivas','Del entorno']}
 ]}
]},
{id:'confimpl',u:7,e:'🛡️',t:'Confiabilidad e implantación',ref:'7.2',steps:[
 {type:'cards',items:[
  {e:'🔭',t:'Fase 2: Análisis de los SI/TI',d:'1) COBERTURA: con OLA y FODA listos, qué cubrirá y en qué contribuirá el SI (nuevo o un cambio). 2) EFICIENCIA DE LAS TI: frecuencia estimada de operaciones y si los recursos soportan ese flujo.'},
  {e:'📈',t:'Los picos',fq:'¿Qué se mira para saber si las TI alcanzan?',d:'Se detectan los PICOS de operaciones (altas, facturación, despachos…, todas juntas) y se comparan con las TI para ver si soportan esa CONCURRENCIA.'},
  {e:'🛡️',t:'Confiabilidad',fq:'¿Qué es la confiabilidad y qué dos conceptos engloba?',d:'Determina la performance y la estabilidad del sistema. CONFIABILIDAD = FIABILIDAD + DISPONIBILIDAD.',html:V.confiab,tip:'Fiabilidad = que RESPONDA (Sommerville) · Disponibilidad = que ESTÉ cuando la necesito (Pressman)'},
  {e:'💬',t:'Fiabilidad',fq:'¿Qué es la fiabilidad según Sommerville?',d:'“La probabilidad de que los servicios del sistema se entregarán como se definió en la especificación del sistema” (Sommerville, 2011).',ex:'Todo estímulo tiene respuesta, positiva o negativa: “hay stock” o “no lo tenemos”, pero responde. Si falla la respuesta, se pierde fiabilidad.'},
  {e:'⏱️',t:'Disponibilidad',fq:'¿Qué es la disponibilidad según Pressman?',d:'“La probabilidad que un programa opere de acuerdo con los requerimientos determinados en un momento de tiempo” (Pressman, 2010).',ex:'Mide el PORCENTAJE de efectividad de obtener la info en el momento en que se necesita.'},
  {e:'🧠',t:'Fase 3: Formulación',fq:'¿Qué se define en la formulación de la estrategia?',d:'1) Impacto y valor · 2) Riesgos y costos · 3) Política de ACCESOS y SEGURIDAD por niveles y organigrama · 4) Cuestiones ÉTICAS, LEGALES y POLÍTICAS de la info · 5) Necesidades e infraestructura.',ex:'La empresa debe seguir funcionando normalmente hasta lograr el salto de calidad del nuevo SI.'},
  {e:'📆',t:'Fase 4: Plan de implantación',d:'Empieza cuando se APRUEBA la estrategia. Se preparan los recursos (propios y a adquirir), calendarios y planes por etapa con tiempos estrictos; qué va en simultáneo y qué depende de qué.',ex:'Herramientas: Microsoft Project y Microsoft Planner, entre otras.'},
  {e:'✅',t:'Planner: 4 estados',fq:'¿Cuáles son los 4 estados de las tareas en Planner?',d:'Cada tarea está en uno de estos estados:',html:V.planner,ex:'Se cargan los subsistemas (Compras, Finanzas, Despachos) y en cada uno los procesos con fechas, encargado y estado. Ej.: Proceso H5 atrasado, en rojo.'},
  {e:'🔟',t:'10 ventajas de los SI',d:'Son las mismas 10 de la infografía de SI de marketing del Módulo 3; se debaten en la planificación junto a las propias:',html:V.mkt}
 ]},
 {type:'order',q:'Formulación: ordená lo que se analiza',items:['💎 Impacto y valor','⚠️ Riesgos y costos','🔐 Política de accesos y seguridad','⚖️ Cuestiones éticas, legales y políticas','🏗️ Necesidades e infraestructura']},
 {type:'sort',rk:['fiab','disp'],q:'¿Fiabilidad o disponibilidad?',buckets:['💬 Fiabilidad','⏱️ Disponibilidad'],items:[

const GK=Object.fromEntries(GLOSS.map(g=>[g.k,g]));
const norm=s=>String(s).replace(/<[^>]+>/g,' ').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[“”"’]/g,'');
const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
/* Busca el concepto: pesa más lo que aparece en la respuesta correcta que en la pregunta */
function recall(ans,q,key,pm){
  if(key&&GK[key])return [GK[key]];
  const A=' '+norm(ans)+' ',Q=' '+norm(q||'')+' ';
  /* pm = módulo preferido: los conceptos del otro módulo pesan menos */
  const sc=GLOSS.map(g=>{let s=0;g.w.forEach(w=>{const re=new RegExp('(^|[^a-z0-9])'+esc(w)+'($|[^a-z0-9])');if(re.test(A))s=Math.max(s,w.length*3+20);else if(re.test(Q))s=Math.max(s,w.length)});if(pm&&(g.m||1)!==pm)s*=.4;return{g,s:g.g?s*.3:s}}).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
  if(!sc.length)return [];
  return sc.slice(0,2).filter((x,i)=>i===0||x.s>=sc[0].s*.6).map(x=>x.g);
}

/* ============ MOTOR DE MISIONES ============ */
let run=null;
function startMission(id){stop();run={m:MISSIONS.find(m=>m.id===id),i:0,ok:0,err:0};combo=0;renderStep()}
function good(){run&&run.ok++;combo++;beep(true);addXP(5)}
function bad(){run&&run.err++;combo=0;beep(false)}
function next(){run.i++;renderStep()}
function renderStep(){
  const m=run.m,st=m.steps[run.i];
  if(!st)return finish();
  app.innerHTML=`<div class="topbar"><button class="ghost" onclick="home()" aria-label="Salir">✕</button><div class="prog"><i style="width:${run.i/m.steps.length*100}%"></i></div><span class="mut">${m.e}</span></div><div id="stage"></div>`;
  STEPS[st.type](st,$('#stage'));
  window.scrollTo(0,0);
}
function feedback(ok,msg,onNext,label,rec){
  document.querySelectorAll('.fb').forEach(x=>x.remove());
  const d=document.createElement('div');d.className='fb '+(ok?'ok':'bad');
  const head=ok?(combo>=3?`¡Combo x${combo}! 🔥 Estás imparable`:pick(BIT_OK)):pick(BIT_BAD);
  d.innerHTML=`<div class="fbl">${bit(ok?(combo>=3?'party':'happy'):'sad',50)}<div><b>${head}</b>${msg?`<p>${msg}</p>`:''}${rec||''}</div></div><button class="btn" id="fbn">${label||'Seguir →'}</button>`;
  document.body.appendChild(d);
  d.querySelector('button').onclick=()=>{d.remove();onNext()};
}
function finish(){
  const{ok,err}=run,tot=ok+err,ratio=tot?ok/tot:1;
  const stars=ratio>=.9?3:ratio>=.7?2:1;
  const prev=S.stars[run.m.id]||0;
  if(stars>prev)S.stars[run.m.id]=stars;
  addXP(20+stars*10);save();confetti();beep(true);
  const msg=stars===3?'¡Impecable! Esto ya es tuyo.':stars===2?'¡Muy bien! Una vuelta más y queda perfecto.':'Vas bien. Repetila y vas a ver cómo mejora.';
  app.innerHTML=`<div class="final">${bit(stars===3?'party':stars===2?'happy':'think',110)}<h2>¡Misión completa!</h2><p class="mut">${run.m.e} ${run.m.t}</p>
   <div class="stars">${[0,1,2].map(i=>`<span style="animation-delay:${i*.2}s;${i<stars?'':'opacity:.2'}">⭐</span>`).join('')}</div>
   <p><b>${ok}</b> aciertos · <b>${err}</b> errores</p><div class="say" style="justify-content:center"><div class="bub"><small>Bit</small>${msg}</div></div>
   <div class="row"><button class="ghost" onclick="startMission('${run.m.id}')">🔁 Repetir</button><button class="btn" onclick="nextMission()">Siguiente misión →</button><button class="ghost" onclick="home()">🗺️ Mapa</button></div></div>`;
}
function nextMission(){const i=MISSIONS.indexOf(run.m);MISSIONS[i+1]?startMission(MISSIONS[i+1].id):home()}

    const upd=()=>{

const DECK=[];
MISSIONS.forEach(m=>m.steps.forEach(st=>{if(st.type==='cards')st.items.forEach((c,i)=>{if(c.nf)return;DECK.push({id:m.id+i,m:m.mod,f:`<div class="emo">${c.e}</div><h2>${c.fq||c.t}</h2>${c.fq?'':'<p class="mut">¿Qué es? ¿Qué dice? Decilo en voz alta.</p>'}`,b:`<h2 style="font-size:20px">${c.t}</h2><p class="d">${c.d}</p>${c.html||''}${c.tip?`<div class="tip">🧠 ${c.tip}</div>`:''}`})})}));
AUTO.forEach(([q,a,m],i)=>DECK.push({id:'a'+i,m:m||1,f:`<div class="emo">❓</div><h2>${q}</h2>`,b:`<p class="d">${a}</p>`}));
function flash(){
  stop();let last=null,seen=0;
  const W=[0,16,8,4,2,1];
  const DK=DECK.filter(x=>inMod(x.m));
  const pickCard=()=>{const c=DK.filter(x=>x.id!==last);const tot=c.reduce((s,x)=>s+W[S.box[x.id]||1],0);let r=Math.random()*tot;for(const x of c){r-=W[S.box[x.id]||1];if(r<=0)return x}return c[0]};
  const show=()=>{
    const c=pickCard();last=c.id;const box=S.box[c.id]||1;
    const counts=[1,2,3,4,5].map(b=>DK.filter(x=>(S.box[x.id]||1)===b).length);
    app.innerHTML=`<div class="topbar"><button class="ghost" onclick="home()">✕</button><b style="flex:1">🃏 Flashcards</b><span class="mut">${seen} vistas</span></div>
     <div class="boxes">${['😵 Nueva','🤔 Floja','🙂 Va','😎 Sabida','👑 Grabada'].map((n,i)=>`<div style="${i+1===box?'border-color:var(--acc2)':''}"><b>${counts[i]}</b>${n}</div>`).join('')}</div>
     <div class="flash" id="fl"><div class="inner"><div class="face card">${c.f}<p class="mut" style="margin-top:16px">👆 Tocá para dar vuelta</p></div><div class="face back card">${c.b}</div></div></div>
     <div id="ctl"><button class="btn" style="width:100%" id="nx">Dar vuelta 🔄</button></div>`;
    const flip=()=>{
      $('#fl').classList.add('flip');
      $('#ctl').innerHTML=`<p class="mut" style="text-align:center;margin:0 0 8px">¿Te la sabías?</p><div class="rate"><button class="r1" data-r="1">😵 No</button><button class="r2" data-r="2">🤔 Más o menos</button><button class="r3" data-r="3">😎 Sí</button></div>`;
      document.querySelectorAll('.rate button').forEach(b=>b.onclick=()=>{const r=+b.dataset.r;S.box[c.id]=r===1?1:r===2?Math.max(1,box):Math.min(5,box+1);if(r===3){addXP(3);beep(true)}save();seen++;show()});
    };
    $('#fl').onclick=flip;$('#nx').onclick=flip;
    const fl=$('#fl .inner'),h=Math.max(...[...fl.children].map(x=>x.scrollHeight));fl.style.minHeight=Math.max(320,h)+'px';
  };show();
}

/* ============ MEMOTEST ============ */
function memo(){
  stop();
  const pairs=shuffle(MEMO.filter(p=>inMod(p[2]))).slice(0,6);
  const tiles=shuffle(pairs.flatMap((p,i)=>[{t:p[0],i,c:1},{t:p[1],i,c:0}]));
  let open=[],found=0,moves=0,lock=false;
  app.innerHTML=`<div class="topbar"><button class="ghost" onclick="home()">✕</button><b style="flex:1">🧩 Memotest</b><span class="mut" id="mv">0 jugadas</span></div>
   <p class="mut" style="margin-top:0">Encontrá cada concepto (amarillo) con su definición.</p>
   <div class="memo">${tiles.map((x,k)=>`<button class="tile ${x.c?'c':''}" data-k="${k}">❔</button>`).join('')}</div>`;
  document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{
    if(lock||b.classList.contains('open')||b.classList.contains('done'))return;
    const x=tiles[+b.dataset.k];b.classList.add('open');b.textContent=x.t;open.push([b,x]);
    if(open.length===2){
      moves++;$('#mv').textContent=moves+' jugadas';
      const[[b1,x1],[b2,x2]]=open;
      if(x1.i===x2.i&&x1.c!==x2.c){[b1,b2].forEach(z=>{z.classList.remove('open');z.classList.add('done')});open=[];found++;beep(true);
        if(found===pairs.length){addXP(25);confetti();setTimeout(()=>feedback(true,`Terminaste en ${moves} jugadas (lo mínimo es 6).`,memo,'Jugar otra vez 🔁'),400)}}
      else{lock=true;beep(false);setTimeout(()=>{[b1,b2].forEach(z=>{z.classList.remove('open');z.textContent='❔'});open=[];lock=false},1100)}
    }
  });
}

/* ============ VERDADERO / FALSO ============ */
function vf(){
  stop();
  const qs=shuffle(VF.filter(x=>inMod(x[3]))).slice(0,10);let k=0,hits=0;

function allQs(){
  const out=[];
  MISSIONS.forEach(m=>{if(inMod(m.mod))m.steps.forEach(st=>{
    if(st.type==='quiz')st.qs.forEach(q=>out.push({...q,m:m.mod}));
    if(st.type==='sort')st.items.forEach(([t,b])=>out.push({q:`${st.q}<br><span style="color:var(--warn)">“${t}”</span>`,o:[st.buckets[b],...shuffle(st.buckets.filter((_,i)=>i!==b)).slice(0,3)],r:st.rk&&st.rk[b],m:m.mod}));
  })});
  return out;
}
function blitz(){
  stop();
  const qs=shuffle(allQs()).slice(0,10);let k=0,score=0,hits=0;
  const show=()=>{
    stop();
    if(k>=qs.length){const rec=score>(S.best||0);if(rec)S.best=score;addXP(hits*4);save();confetti();
      app.innerHTML=`<div class="final">${bit(rec?'party':hits>=6?'happy':'think',100)}<h2>${score} puntos</h2><p>${hits}/10 correctas ${rec?'· <b style="color:var(--warn)">¡NUEVO RÉCORD!</b>':''}</p><p class="mut">Responder rápido suma puntos extra. Récord: ${S.best} pts.</p><div class="row"><button class="btn" onclick="blitz()">⚡ Otra vez</button><button class="ghost" onclick="home()">🗺️ Mapa</button></div></div>`;return}
    const q=qs[k],opts=shuffle(q.o.map((t,i)=>({t,i})));let t=15,done=false;
    app.innerHTML=`<div class="topbar"><button class="ghost" onclick="home()">✕</button><b style="flex:1">⚡ ${k+1}/10</b><span class="big" style="font-size:20px" id="sc">${score} pts</span></div>
     <div class="timer"><i id="tm" style="width:100%"></i></div><h2 class="q">${q.q}</h2>
     <div class="opts">${opts.map((o,j)=>`<button class="opt" data-i="${o.i}"><span class="k">${j+1}</span>${o.t}</button>`).join('')}</div>`;
    const answer=b=>{
      if(done)return;done=true;stop();
      const ok=b&&+b.dataset.i===0;
      document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.i===0)x.classList.add('right')});
      if(ok){hits++;score+=10+Math.ceil(t);beep(true);$('#sc').textContent=score+' pts'}else{if(b){b.classList.add('wrong');shake(b)}beep(false)}
      if(ok)setTimeout(()=>{k++;show()},700);else feedback(false,b?`Era: <b>${q.o[0]}</b>`:`⏰ ¡Se acabó el tiempo! Era: <b>${q.o[0]}</b>`,()=>{k++;show()},null,recHTML(recall(q.o[0],q.q,q.r,q.m)));
    };
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b));
    TIMER=setInterval(()=>{t-=.1;const e=$('#tm');if(e)e.style.width=Math.max(0,t/15*100)+'%';if(t<=0)answer(null)},100);
  };show();
}

   <p class="tp">⚠️ El modelo ${H('NO es estático: alineamiento continuo (SI = sistema abierto)')}</p>
  </section>

  <section><h3>📐 7.2 Fase 1: OLA y FODA</h3>
   <p><b>4 fases SI/TI:</b> ${H('Comprensión → Análisis SI/TI → Formulación → Plan de implantación')} <small class="mut">+ gestión: dirección, equipo, comunicación, cambios</small></p>
   <table>
    <tr><td><b>Objetivos</b></td><td>${H('general + uno por proceso; empiezan con verbo')}</td></tr>
    <tr><td><b>Límites</b></td><td>${H('“Desde que… hasta que se rechaza o se emite…”')}</td></tr>
    <tr><td><b>Alcances</b></td><td>${H('Incluye / No incluye')}</td></tr>
    <tr><td><b>Prioridades</b></td><td>${H('primero los módulos centrales')}</td></tr>
   </table>
   <ul><li><small class="mut">OLA = Yourdon (1993)</small> · Videoclub, límite: ${H('desde que solicita asociarse hasta que es rechazada o devuelve la película')}</li>
   <li>No incluye: ${H('actualización de clientes, facturación, proveedores, compras, sueldos')}</li></ul>
   <table><tr><th></th><th>Positivo</th><th>Negativo</th></tr>
    <tr><td><b>Interno</b></td><td>${H('Fortalezas')}</td><td>${H('Debilidades')}</td></tr>
    <tr><td><b>Externo</b></td><td>${H('Oportunidades')}</td><td>${H('Amenazas')}</td></tr></table>
   <p>FODA: ${H('Albert Humphrey')} · <small class="mut">Sarli, González y Ayres (2015)</small> · moneda, gremios, leyes = ${H('amenazas')}</p>
  </section>

  <section><h3>🛡️ 7.2 Fases 2 a 4</h3>
   <ul><li><b>Fase 2:</b> ${H('cobertura + eficiencia de las TI (comparar los PICOS de operaciones)')}</li>
   <li><b>Confiabilidad</b> = ${H('fiabilidad + disponibilidad')}</li>
   <li><b>Fiabilidad (Sommerville):</b> ${H('servicios como dice la especificación; siempre hay respuesta')}</li>
   <li><b>Disponibilidad (Pressman):</b> ${H('opera cuando se necesita; se mide en %')}</li>
   <li><b>Fase 3:</b> ${H('impacto y valor · riesgos y costos · accesos y seguridad · ética, legal y política · infraestructura')}</li>
   <li><b>Fase 4:</b> ${H('tras aprobar la estrategia: recursos, calendarios, Project y Planner')}</li>
   <li><b>Planner:</b> ${H('no iniciada · en curso · con retraso · completada')}</li></ul>
  </section>

  <section><h3>🔺 7.3 Triángulo y papel estratégico</h3>
   <ul><li><b>Dirección estratégica de SI:</b> ${H('alinear SI y TI con la dirección estratégica de la empresa')}</li>
   <li><b>Triángulo:</b> ${H('Organización – SI – TI')} → ${H('sinergia')}</li>
   <li><b>Fernández Alarcón (2006):</b> ${H('Introducción → Expansión → Coordinación → Interdependencia')}</li>
   <li><b>TI:</b> BD ${H('hacen perdurar los datos')} · procesadores ${H('nexo usuario–aplicaciones–BD')}</li>
   <li class="tp">⚠️ No mezclar con las 4 fases SI/TI (Rodríguez y Lamarca)</li></ul>
  </section>

  <section><h3>🏁 Cierre de la materia</h3>
   <ul><li><b>Actividad:</b> el SI se adapta al organigrama para ${H('fluidez de comunicación entre niveles, integridad y acceso a la info')}</li>
   <li><b>Hilo:</b> ${H('dato → información → conocimiento → sabiduría')}</li>
   <li>M1 ${H('info como eje, BD')} · M2 ${H('variantes de SI y conocimiento')} · M3 ${H('construcción por etapas')} · M4 ${H('planificación estratégica')}</li></ul>
   <table>
    <tr><td><b>Rodríguez y Lamarca (2012)</b></td><td>${H('3 aspectos · 4 fases SI/TI · dirección estratégica')}</td></tr>
    <tr><td><b>Yourdon (1993)</b></td><td>${H('OLA')}</td></tr>
    <tr><td><b>Humphrey · Sarli y otros</b></td><td>${H('FODA')}</td></tr>
    <tr><td><b>Sommerville / Pressman</b></td><td>${H('fiabilidad / disponibilidad')}</td></tr>
    <tr><td><b>Fernández Alarcón (2006)</b></td><td>${H('4 fases del papel estratégico')}</td></tr>
   </table>
  </section>

  <section><h3>🚨 Trampas M4: esto es FALSO</h3><ul class="tp">${trapsOf(4)}</ul></section>
  `:''}
  </div>`;
  const mach=$('#mach');
  $('#hideb').onclick=()=>{const on=mach.classList.toggle('hide');mach.querySelectorAll('.h.show').forEach(x=>x.classList.remove('show'));$('#hideb').textContent=on?'👁️ Destapar':'👁️ Tapar'};
  mach.onclick=e=>{const h=e.target.closest('.h');if(h&&mach.classList.contains('hide')){h.classList.toggle('show');beep(true)}};
  window.scrollTo(0,0);
}

/* ============ teclado ============ */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'&&e.key!=='Enter')return;
  const fbn=$('#fbn');
  if(e.key==='Enter'||e.key===' '){
    if(fbn){e.preventDefault();fbn.click();return}
    const nx=$('#nx');if(nx&&e.target.tagName!=='BUTTON'){e.preventDefault();nx.click()}
    return;
  }
  if(fbn)return;
  if(/^[1-9]$/.test(e.key)){const o=document.querySelectorAll('.opt:not(:disabled)')[+e.key-1];if(o)o.click()}
  if(e.key==='ArrowRight'){const nx=$('#nx');if(nx)nx.click()}
  if(e.key==='ArrowLeft'){const pv=$('#pv');if(pv&&!pv.disabled)pv.click()}
  const vfb=document.querySelectorAll('.vf button:not(:disabled)');
  if(vfb.length&&(e.key==='v'||e.key==='V'))vfb[0].click();
  if(vfb.length&&(e.key==='f'||e.key==='F'))vfb[1].click();
});

home();
